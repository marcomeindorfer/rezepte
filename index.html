<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme:dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Küchenplan</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%234A7A3D'/><path d='M20 16v12a6 6 0 0 0 6 6v14M26 16v12M32 34V16M44 16c-4 0-6 6-6 12s2 8 4 8v12' stroke='%23EFF1EC' stroke-width='4' fill='none' stroke-linecap='round'/></svg>">
<style>
/* ── Farbkonzept ────────────────────────────────────────────────────────────
   Der Grund ist warmes Papier, kein kaltes Systemgrau: eine Küchenapp soll
   nicht wie ein Systemdialog wirken. Darauf genau EINE Leitfarbe – ein tiefes
   Kräutergrün, das Fortschritt, Erledigtes und die aktive Leiste trägt.
   Die Kategorien kommen aus der Lebensmittelwelt statt aus der Systempalette:
   Terracotta für Fleisch, Schiefergrau-Blau für Fisch, Bernstein für Angebote.
   Gefahr ist davon getrennt – Fleisch ist kein Fehler und darf nicht so aussehen.
   Alle Textfarben liegen über 4,5:1, die Kategoriefarben über 4,5:1 auf Weiß. */
:root{
  --paper:#F7F6F2;--card:#FFFFFF;--card-2:#F1EFE9;
  --fill:rgba(60,56,44,.08);--fill-2:rgba(60,56,44,.14);
  --ink:#1A1A17;--ink-2:rgba(30,29,24,.74);--ink-3:#6B6960;
  --line:rgba(30,29,24,.11);--line-2:rgba(30,29,24,.22);
  --herb:#1F7A4C;--herb-bg:rgba(31,122,76,.10);
  --sea:#3B6EA5;--sea-bg:rgba(59,110,165,.10);
  --beet:#B0442E;--beet-bg:rgba(176,68,46,.10);
  --sun:#B4600A;--sun-bg:rgba(180,96,10,.12);
  --gefahr:#C4362B;
  --akz:var(--herb);
  --schatten:0 1px 2px rgba(40,36,26,.06);
  --r:14px;--r-s:11px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --nav-h:50px;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#111110;--card:#1C1C19;--card-2:#262622;
  --fill:rgba(238,234,222,.10);--fill-2:rgba(238,234,222,.17);
  --ink:#F5F3EE;--ink-2:rgba(245,243,238,.74);--ink-3:rgba(245,243,238,.58);
  --line:rgba(245,243,238,.12);--line-2:rgba(245,243,238,.23);
  --herb:#5BC98A;--herb-bg:rgba(91,201,138,.15);
  --sea:#7FB0E0;--sea-bg:rgba(127,176,224,.15);
  --beet:#E58C72;--beet-bg:rgba(229,140,114,.15);
  --sun:#E7A64F;--sun-bg:rgba(231,166,79,.15);
  --gefahr:#FF6B5E;
  --schatten:none;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:17px;line-height:1.4;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  overscroll-behavior-y:none;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Große Titelzeile wie in den Systemapps */
header{padding:calc(env(safe-area-inset-top) + 14px) 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.eyebrow{display:none}
header h1{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.hd-side{font-size:13px;color:var(--ink-3);text-align:right;white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:99px;background:var(--ink-3)}
.sync.on i{background:var(--herb)}.sync.off i{background:var(--sun)}

.card{background:var(--card);border:0;border-radius:var(--r);padding:15px;box-shadow:var(--schatten)}
@media (prefers-color-scheme:dark){.card{border:0.5px solid var(--line)}}
.card+.card{margin-top:10px}
/* Das Einwurffeld steht bewusst vor allen anderen Feldern: der kürzeste Weg
   von „irgendwo kopiert" zu einem fertigen Rezept. */
.einwurf{background:var(--sea-bg);border-radius:var(--r);padding:13px 14px;margin:12px 0 4px}
.einwurf b{display:block;font-size:15.5px;font-weight:650}
.einwurf textarea{background:var(--card)}
.sect{margin:26px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 3px}
.sect h2{font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.btn{background:var(--fill);border:0;box-shadow:none;border-radius:var(--r-s);padding:12px 16px;font-weight:500;font-size:16px;min-height:44px;transition:opacity .12s,transform .12s}
.btn:active{transform:scale(.97);opacity:.7}
.btn-primary{background:var(--herb);color:#fff;font-weight:600;box-shadow:none}
@media (prefers-color-scheme:dark){.btn-primary{color:#00250C}}
.btn-wide{width:100%;display:block;text-align:center;padding:14px;font-size:17px}
.btn-s{padding:9px 14px;font-size:15px;border-radius:99px;min-height:36px}
.btn-ghost{background:transparent;box-shadow:none;color:var(--sea);padding:9px 10px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

/* Kennzeichen bleiben grau, nur die Schrift trägt die Farbe */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--fill);color:var(--ink-2)}
.t-fisch{color:var(--sea)}.t-fleisch{color:var(--beet)}
.t-veg{color:var(--herb)}.t-neutral{color:var(--ink-2)}
.t-sun{color:var(--sun)}
.dot{width:7px;height:7px;border-radius:99px;flex:none}
.d-fisch{background:var(--sea)}.d-fleisch{background:var(--beet)}.d-veg{background:var(--herb)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--fill);border-radius:99px;padding:8px 15px;font-size:15px;white-space:nowrap;min-height:36px;color:var(--ink-2)}
/* Auswahl überall gleich: graue Bahn, heller Schalter – wie die Systemsegmente.
   Ein schwarz gefülltes Element wäre das Schwerste auf der Seite und zöge den
   Blick von der Liste weg, um die es eigentlich geht. */
.chip[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){.chip[aria-pressed="true"]{background:#636366;color:#fff;box-shadow:none}}

.rhythm{display:flex;gap:8px}
.rh{flex:1;background:var(--card);border-radius:var(--r-s);padding:10px 6px;text-align:center;box-shadow:var(--schatten)}
@media (prefers-color-scheme:dark){.rh{background:var(--card-2)}}
.rh b{display:block;font-size:22px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.rh span{font-size:11px;color:var(--ink-3)}
.rh.warn{background:var(--sun-bg)}
.rh.warn b{color:var(--sun)}

/* Bio hat eine eigene Farbe – die Leitfarbe, weil es das ist, was wir wollen.
   Die gewöhnliche Angebotspille bleibt bernstein. */
.pill.bio{background:var(--herb-bg);color:var(--herb);border-color:var(--herb);font-weight:600}

/* Thema der Woche über dem Ideenstrom */
.themakarte{background:var(--card);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--schatten);
  border-left:3px solid var(--herb)}
.themakarte .thema-k{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-3);font-weight:600}
.themakarte b{display:block;font-size:19px;letter-spacing:-.02em;margin-top:3px}
/* Der Titel einer Idee führt in die Einzelheiten – deshalb ein Knopf, kein Text */
.ideen-t{display:block;width:100%;text-align:left;background:transparent;border:0;padding:0;
  font-weight:600;font-size:17px;line-height:1.25;letter-spacing:-.02em;color:inherit}

/* Tagesplan */
.day{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:10px;box-shadow:var(--schatten)}
@media (prefers-color-scheme:dark){.day{border:0.5px solid var(--line)}}
/* Der Tageskopf ist ein Knopf über die volle Breite – zugeklappt ist er die
   ganze Karte, deshalb muss die Antippfläche der Zeile entsprechen. */
.day-h{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  padding:12px 15px;background:transparent;border:0;text-align:left;min-height:56px;color:inherit}
.day-t{min-width:0;flex:1}
.day-k{display:block;font-size:13px;color:var(--ink-3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-z{display:flex;align-items:center;gap:6px;flex:none;font-size:12px;color:var(--ink-3)}
.chev{display:grid;place-items:center;width:20px;height:20px;transition:transform .18s}
.chev svg{width:16px;height:16px}
.chev.auf{transform:rotate(180deg)}
.day.heute .day-h b{color:var(--herb)}
.heutetag{font-size:11px;font-weight:600;background:var(--herb);color:#fff;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:1px;letter-spacing:0}
@media (prefers-color-scheme:dark){.heutetag{color:#00250C}}
.day-h b{font-size:17px;font-weight:600;letter-spacing:-.02em}
.day-h span{font-size:12px;color:var(--ink-3)}
.slot{display:flex;align-items:center;gap:12px;padding:10px 15px;border-top:0.5px solid var(--line);min-height:52px}
.slot:first-of-type{border-top:0.5px solid var(--line)}
.slot-l{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-3);width:48px;flex:none}
.slot-m{flex:1;min-width:0}
.slot-n{font-size:16px;font-weight:500;line-height:1.25}
.slot-s{font-size:12.5px;color:var(--ink-3);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--fill);color:var(--ink-2);border:0;white-space:nowrap}
.slot-e{font-size:16px;color:var(--ink-3)}
.slot button.pick{flex:1;text-align:left;background:transparent;border:0;padding:0;min-width:0}
.mini{display:flex;align-items:center;gap:1px;background:var(--fill);border-radius:99px;padding:2px;flex:none}
.mini button{width:28px;height:28px;border:0;background:transparent;border-radius:99px;font-size:16px;line-height:1;display:grid;place-items:center;color:var(--sea)}
.mini b{font-size:13px;min-width:18px;text-align:center;font-weight:600}
.warnrow{padding:9px 15px;background:var(--sun-bg);color:var(--sun);font-size:13px}

.rec{display:flex;gap:12px;background:var(--card);border:0;border-radius:var(--r);padding:14px;width:100%;text-align:left;box-shadow:var(--schatten);position:relative;overflow:hidden}
@media (prefers-color-scheme:dark){.rec{border:0.5px solid var(--line)}}
.rec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink-3);opacity:.5}
.rec+.rec{margin-top:9px}
.rec.k-fisch::before{background:var(--sea);opacity:1}
.rec.k-fleisch::before{background:var(--beet);opacity:1}
.rec.k-veg::before{background:var(--herb);opacity:1}
.rec-b{flex:1;min-width:0}
.rec-t{font-weight:600;font-size:17px;line-height:1.25;letter-spacing:-.02em}
.rec-m{font-size:13px;color:var(--ink-3);margin-top:5px}
.rec-tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.add-b{flex:none;width:40px;height:40px;border-radius:99px;border:0;background:var(--fill);font-size:21px;color:var(--sea);display:grid;place-items:center;align-self:center}

.deck{position:relative;height:400px;margin-top:6px}
.swipe{position:absolute;inset:0;background:var(--card);border:0;border-radius:20px;padding:22px;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;box-shadow:0 6px 20px rgba(0,0,0,.10)}
@media (prefers-color-scheme:dark){.swipe{border:0.5px solid var(--line)}}
.swipe h3{font-size:24px;line-height:1.15;margin-bottom:10px;letter-spacing:-.03em}
.swipe .why{font-size:16px;color:var(--ink-2);line-height:1.45}
.swipe .ing{margin-top:auto;font-size:14px;color:var(--ink-3);line-height:1.5;border-top:0.5px solid var(--line);padding-top:14px}
.stamp{position:absolute;top:22px;font-size:16px;font-weight:700;letter-spacing:.06em;padding:7px 14px;border-radius:10px;border:2.5px solid;opacity:0;transition:opacity .12s}
.stamp-y{right:20px;color:var(--herb);border-color:var(--herb);transform:rotate(9deg)}
.stamp-n{left:20px;color:var(--gefahr);border-color:var(--gefahr);transform:rotate(-9deg)}
.deck-btns{display:flex;justify-content:center;gap:24px;margin-top:18px}
.circ{width:60px;height:60px;border-radius:99px;border:0;background:var(--card);font-size:24px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.10);color:var(--ink-3)}
@media (prefers-color-scheme:dark){.circ{background:var(--card-2)}}
.circ.yes{color:var(--herb)}.circ.no{color:var(--gefahr)}

.route{position:relative;padding-left:34px;margin-top:4px}
.route::before{content:"";position:absolute;left:12px;top:14px;bottom:14px;width:2px;background:var(--line)}
.stop{position:relative;margin-bottom:18px}
.stop::before{content:attr(data-n);position:absolute;left:-34px;top:1px;width:24px;height:24px;border-radius:99px;background:var(--herb);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:3px solid var(--paper)}
.stop.done::before{background:var(--ink-3)}
@media (prefers-color-scheme:dark){.stop::before{color:#00250C}}
.stop h3{font-size:16px;margin-bottom:8px;font-weight:600}
.stop.done h3{color:var(--ink-3)}
.items{background:var(--card);border:0;border-radius:var(--r);overflow:hidden;box-shadow:var(--schatten)}
@media (prefers-color-scheme:dark){.items{border:0.5px solid var(--line)}}
.itemrow{display:flex;align-items:stretch;border-top:0.5px solid var(--line)}
.itemrow:first-child{border-top:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 15px;flex:1;min-width:0;text-align:left;background:transparent;border:0;min-height:48px}
.item-x{border:0;background:transparent;color:var(--ink-3);padding:0 15px;font-size:15px}

.box{width:24px;height:24px;border-radius:99px;border:1.8px solid var(--line-2);flex:none;display:grid;place-items:center;font-size:14px;color:transparent}
.box svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.item.on .box{background:var(--herb);border-color:var(--herb);color:#fff}
@media (prefers-color-scheme:dark){.item.on .box{color:#00250C}}
.item.on .it-n{color:var(--ink-3)}
.it-n{flex:1;font-size:17px;line-height:1.3}
.it-q{font-size:15px;color:var(--ink-2);white-space:nowrap}
.item.on .it-q{color:var(--ink-3)}
.progress{height:6px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--herb);border-radius:99px;transition:width .25s}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
/* 92vh misst am Handy die Fläche OHNE die ein- und ausfahrende Browserleiste –
   das Blatt ragt dann unter den sichtbaren Rand und der Schließen-Knopf ist nicht
   erreichbar. dvh misst, was gerade wirklich zu sehen ist; vh bleibt als Rückfall
   für ältere Browser stehen. overscroll-behavior verhindert, dass ein Wisch am
   Ende des Blattes die Seite dahinter weiterschiebt. */
.sheet-in{background:var(--paper);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;border-radius:14px 14px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));animation:blattrein .28s cubic-bezier(.32,.72,0,1)}
@keyframes blattrein{from{transform:translateY(18px)}to{transform:none}}
.grab{width:36px;height:5px;border-radius:99px;background:var(--line-2);margin:0 auto 14px}
.toggle{display:flex;background:var(--fill);border-radius:99px;padding:2px;flex:none}
.toggle button{border:0;background:transparent;padding:7px 14px;font-size:14px;font-weight:600;color:var(--ink-2);border-radius:99px}
.toggle button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){.toggle button[aria-pressed="true"]{background:#636366;color:#fff}}
.zeilen{background:var(--card);border:0;border-radius:var(--r);overflow:hidden;box-shadow:var(--schatten)}
@media (prefers-color-scheme:dark){.zeilen{border:0.5px solid var(--line)}}
.zeile{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;border-bottom:0.5px solid var(--line);padding:13px 15px;text-align:left;font-size:17px;color:var(--ink);min-height:48px}
.zeile:last-child{border-bottom:0}
.zeile-n{flex:1;font-weight:400}
.zeile-w{color:var(--ink-3);font-size:16px}
.zeile-w.warn{color:var(--sun);font-weight:500}
.zeile-p{color:var(--line-2);font-size:20px;line-height:1;font-weight:600}
.meal{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:var(--r);padding:12px 15px;box-shadow:var(--schatten)}
@media (prefers-color-scheme:dark){.meal{border:0.5px solid var(--line)}}
.meal+.meal{margin-top:8px}
.meal-main{flex:1;min-width:0}
.meal-name{font-weight:500;font-size:17px;line-height:1.25}
.meal-sub{font-size:13px;color:var(--ink-3);margin-top:3px}
/* Nur der Rezepttitel, nicht die Abschnittsüberschriften darunter – die sind
   ebenfalls h2 und wurden sonst mitvergrößert. */
.det > h2{font-size:26px;line-height:1.15;letter-spacing:-.03em}
.det .steps{counter-reset:s;list-style:none;padding:0;margin:0}
.det .steps li{counter-increment:s;position:relative;padding-left:34px;margin-bottom:14px;font-size:17px;line-height:1.45}
.det .steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:99px;background:var(--fill);border:0;font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--ink-2)}
.ingline{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:0.5px solid var(--line);font-size:17px;align-items:center}
.ingline:last-child{border-bottom:0}
.ingline.ab span:first-child{color:var(--ink-3)}
.steps li.ab{color:var(--ink-3)}
.steps li{cursor:pointer}
.grid3{display:grid;grid-template-columns:auto repeat(3,1fr);gap:7px;align-items:center}
.grid3 button{border:0;background:var(--fill);border-radius:10px;padding:11px 4px;font-size:14px;min-height:44px}
.grid3 button.voll{color:var(--ink-3)}
.grid3 span{font-size:14px;color:var(--ink-2)}
.ingline .q{font-size:15px;color:var(--ink-2);white-space:nowrap}
.stepper{display:flex;align-items:center;gap:2px;background:var(--fill);border-radius:99px;padding:3px;flex:none}
.stepper button{width:32px;height:32px;border:0;background:transparent;border-radius:99px;font-size:19px;line-height:1;display:grid;place-items:center;color:var(--sea)}
.stepper b{font-size:15px;min-width:22px;text-align:center;font-weight:600}

/* Durchscheinende Leiste wie in den Systemapps */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 78%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-top:0.5px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:transparent;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-3);font-size:10px;font-weight:500}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--herb);font-weight:600}
.badge{position:absolute;transform:translate(16px,-11px);background:var(--gefahr);color:#fff;font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 5px}
.empty{text-align:center;padding:44px 24px;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px;font-weight:600}
.note{font-size:14px;color:var(--ink-3);line-height:1.45}
input[type=text],input[type=search],input[type=url],select{font-family:inherit;font-size:17px;width:100%;padding:12px 14px;border:0;border-radius:var(--r-s);background:var(--card);color:var(--ink);box-shadow:var(--schatten);min-height:44px}
@media (prefers-color-scheme:dark){input[type=text],input[type=search],input[type=url],select{background:var(--card-2)}}
label.fl{display:block;font-size:14px;color:var(--ink-3);margin:14px 0 6px;font-weight:400}
textarea{font-family:inherit;font-size:17px;width:100%;padding:12px 14px;border:0;border-radius:var(--r-s);background:var(--card);color:var(--ink);line-height:1.45;resize:vertical;box-shadow:var(--schatten)}
@media (prefers-color-scheme:dark){textarea{background:var(--card-2)}}
.pickrow{display:flex;gap:7px;flex-wrap:wrap}
.pickrow button{border:0;background:var(--fill);border-radius:99px;padding:10px 16px;font-size:15px;min-height:40px;color:var(--ink-2)}
.pickrow button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){.pickrow button[aria-pressed="true"]{background:#636366;color:#fff;box-shadow:none}}
.pruefz{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-bottom:0.5px solid var(--line)}
.pruefz:last-child{border-bottom:0}
.pruefz.aus .pt{color:var(--ink-3)}
.pruefz .pt{flex:1;font-size:16px;line-height:1.35;word-break:break-word}
.pruefz .pt i{display:block;font-style:italic;font-size:13px;color:var(--ink-3);margin-top:2px}
.pruefz .pw{display:flex;gap:5px;flex:none}
.pz{width:34px;height:34px;border:0;background:var(--fill);border-radius:10px;
  font-size:13px;font-weight:600;color:var(--ink-2);padding:0;line-height:1}
.pz.an{background:var(--sea);color:#fff}
.zline{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:8px 0;border-bottom:0.5px solid var(--line)}
.zline:last-child{border-bottom:0}
.zline em{font-style:normal;font-size:13px;color:var(--ink-3)}
code{font-family:var(--mono);font-size:13px;background:var(--fill);padding:2px 6px;border-radius:6px;word-break:break-all}
pre{font-family:var(--mono);font-size:12px;background:var(--card);border:0;border-radius:var(--r-s);padding:13px;overflow-x:auto;line-height:1.5;box-shadow:var(--schatten)}
@media (prefers-color-scheme:dark){pre{background:var(--card-2)}}
input:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Kurze Rückmeldung am unteren Rand, unabhängig vom Seiteninhalt */
/* Über allem, auch über einem offenen Blatt (z-index 50) – eine Rückmeldung,
   die hinter dem Blatt liegt, sieht aus, als sei nichts passiert. */
#meldung{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  z-index:60;display:flex;justify-content:center;padding:0 12px 10px;pointer-events:none}
.meldung{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);
  border-radius:14px;padding:13px 15px;font-size:15px;max-width:576px;width:100%;
  pointer-events:auto;box-shadow:0 8px 28px rgba(0,0,0,.22);animation:hochrein .22s ease}
.meldung span{flex:1}
.meldung button{border:0;background:transparent;color:var(--paper);font-weight:600;
  text-decoration:underline;padding:2px 4px}
@keyframes hochrein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Heute-Karte über dem Wochenplan */
.heutekarte{background:var(--card);border:0;border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--schatten)}
@media (prefers-color-scheme:dark){.heutekarte{border:0.5px solid var(--line)}}
.heutekarte .hk-kopf{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.hk-zeile{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:0.5px solid var(--line)}
.hk-zeile:first-of-type{border-top:0}
.hk-zeile .hk-m{font-size:12px;color:var(--ink-3);width:52px;flex:none;text-transform:uppercase;letter-spacing:.03em}
.hk-zeile .hk-n{flex:1;min-width:0;font-size:17px;font-weight:500;text-align:left;background:transparent;border:0;color:inherit;padding:0}
.hk-zeile .hk-leer{flex:1;color:var(--ink-3);font-size:16px;text-align:left;background:transparent;border:0;padding:0}

/* Herkunft eines Einkaufspostens */
.it-q{cursor:pointer}
.woher{display:flex;flex-direction:column;gap:2px;background:transparent;border:0;padding:12px 15px;
  font-size:15px;color:var(--ink-2);white-space:nowrap;flex:none;align-items:flex-end;justify-content:center}
.woher .fuerwen{font-size:11px;color:var(--ink-3);text-transform:none}
/* SCHNELLGERICHT */
.schnellbox{background:var(--card);border:0;border-radius:var(--r);margin-bottom:12px;box-shadow:var(--schatten);overflow:hidden}
@media (prefers-color-scheme:dark){.schnellbox{border:0.5px solid var(--line)}}
.schnellbox > summary{list-style:none;cursor:pointer;padding:13px 15px;font-size:16px;font-weight:500;color:var(--sea);min-height:44px}
.schnellbox > summary::-webkit-details-marker{display:none}
.schnellbox .leise{font-weight:400;color:var(--ink-3);font-size:13px;margin-left:6px}
.schnellbox[open] > summary{border-bottom:0.5px solid var(--line)}
.schnellinhalt{padding:6px 15px 15px}
.schnellinhalt input,.schnellinhalt textarea{width:100%}
</style>
</head>

<div id="app">
  <header>
    <div><div class="eyebrow" id="eyebrow">Woche</div><h1 id="title">Wochenplan</h1></div>

</div>

{id:"f3",n:"Kabeljau in Tomaten-Fenchel-Sud",k:"fisch",ma:["a"],m:[1,2,3,4,9,10,11,12],min:30,p:30,bl:0,nut:["omega3","jod","ballast"],

 s:["Fenchel in Streifen, Zwiebel würfeln. Beides in Öl 6 Minuten weich dünsten.","Knoblauch, Tomaten und Brühe zugeben, 10 Minuten köcheln lassen.","Fisch salzen, in den Sud legen, zugedeckt 8 Minuten gar ziehen lassen.","Mit Brot servieren."]},

{id:"f4",n:"Lachs-Spinat-Nudeln",k:"fisch",ma:["m","a"],m:ALL,min:25,p:32,bl:0,nut:["omega3","folat","calcium"],
 why:"Schnellster Fischtag der Woche. Spinat bringt Folat, der Frischkäse macht die Sauce ohne Sahne.",

 s:["Nudeln nach Packung kochen.","Zwiebel und Knoblauch andünsten, Spinat zugeben und auftauen lassen.","Frischkäse und einen Schöpfer Nudelwasser einrühren.","Lachs in Würfeln 4 Minuten mitgaren, Nudeln unterheben, mit Zitrone abschmecken."]},

{id:"f5",n:"Seelachs-Bowl mit Reis und Möhre",k:"fisch",ma:["m","a"],m:ALL,min:30,p:29,bl:0,nut:["jod","omega3","ballast"],

 s:["Reis kochen. Fisch auftauen lassen und trockentupfen.","Möhren in Scheiben mit wenig Wasser 8 Minuten dünsten, Erbsen zuletzt zugeben.","Fisch in Öl von jeder Seite 3–4 Minuten braten, salzen.","Joghurt mit Zitrone und Salz verrühren, alles in einer Schüssel anrichten."]},

{id:"f6",n:"Forelle mit Dillkartoffeln und Gurkensalat",k:"fisch",ma:["a"],m:SOMMER,min:35,p:31,bl:0,nut:["omega3","jod","b12"],
 why:"Forelle kommt aus deutscher Zucht und ist milder als Lachs. Gurke und Joghurt kühlen an heißen Tagen.",
 z:[["Forellenfilet",150,"g","ff"],["Kartoffeln",250,"g","og"],["Salatgurke",0.5,"Stk","og"],["Naturjoghurt",80,"g","kr"],["Dill",0.25,"Bund","og"],["Butter",1,"TL","kr"],["Zitrone",0.25,"Stk","og"]],
 s:["Kartoffeln in Salzwasser garen, mit Butter und Dill schwenken.","Gurke hobeln, mit Joghurt, Salz und Zitrone mischen.","Forelle salzen und in der Pfanne auf der Hautseite 4 Minuten, gewendet 2 Minuten braten."]},

/* ---------- FLEISCH (ohne Schwein) ---------- */
{id:"m1",n:"Hähnchen-Gemüsepfanne mit Zucchini",k:"fleisch",ma:["m","a"],m:SOMMER,min:25,p:35,bl:0,nut:["zink","b12"],

 s:["Reis aufsetzen.","Hähnchen in Streifen scharf anbraten, herausnehmen und salzen.","Zwiebel, Paprika und Zucchini 7 Minuten braten, Knoblauch und Paprikapulver zugeben.","Fleisch zurück in die Pfanne, mit Reis servieren."]},

{id:"m2",n:"Rindergeschnetzeltes mit Champignons",k:"fleisch",ma:["a"],m:ALL,min:30,p:34,bl:0,nut:["eisen","b12","zink"],
 why:"Rindfleisch ist die stärkste Eisenquelle im Plan – nach der Geburt der Nährstoff, der am längsten braucht, um sich zu erholen.",

 s:["Reis kochen.","Fleisch portionsweise scharf anbraten, herausnehmen und salzen.","Zwiebel und Champignons in derselben Pfanne braun braten, mit Brühe ablöschen.","Schmand einrühren, Fleisch zurückgeben, mit Petersilie bestreuen."]},

{id:"m3",n:"Hähnchenbrust mit Ofenkürbis und Hirse",k:"fleisch",ma:["a"],m:HERBST,min:40,p:36,bl:1,nut:["zink","b12","ballast"],
 why:"Hokkaido muss nicht geschält werden. Hirse ist glutenfrei und liegt leichter als Nudeln.",

{id:"m4",n:"Putenbrust mit Rosenkohl und Kartoffelpüree",k:"fleisch",ma:["a"],m:KALT,min:40,p:38,bl:2,nut:["eisen","zink","b12"],

{id:"m5",n:"Bolognese mit Möhre und Sellerie",k:"fleisch",ma:["m","a"],m:ALL,min:45,p:31,bl:0,nut:["eisen","b12","zink"],
 why:"Doppelte Menge kochen lohnt sich – die Sauce hält drei Tage und friert gut ein. Viel Gemüse, wenig Hack.",
 z:[["Rinderhackfleisch",100,"g","ff"],["Möhren",80,"g","og"],["Knollensellerie",60,"g","og"],["Zwiebel",0.5,"Stk","og"],["Passierte Tomaten",200,"g","tr"],["Tomatenmark",1,"EL","tr"],["Vollkornnudeln",100,"g","tr"],["Olivenöl",1,"EL","gw"]],

{id:"m6",n:"Hähnchen-Linsen-Eintopf",k:"fleisch",ma:["m","a"],m:WINTER,min:40,p:33,bl:2,nut:["eisen","ballast","zink"],

/* ---------- VEGETARISCH ---------- */

{id:"v5",n:"Kartoffel-Kohlrabi-Gratin",k:"veg",ma:["a"],m:[5,6,7,8,9,10],min:40,p:21,bl:1,nut:["calcium","folat"],

{id:"v9",n:"Grünkohl-Kartoffel-Pfanne mit Ei",k:"veg",ma:["m","a"],m:KALT,min:30,p:24,bl:2,nut:["eisen","folat","b12"],

const VAGE_RE=/^\s*(etwas|einige|ein paar|ein wenig|reichlich|nach belieben|nach bedarf|nach geschmack|je)\s+/i;
const HALB_RE=/^\s*(ein(e|en)?\s+halbe(r|s|n)?|halbe(r|s|n)?)\s+/i;
function mengeLesen(text){
  let rest=text, menge=0, gefunden=false;
  const weg=n=>{rest=rest.slice(n).replace(/^\s*/,"");};

  const vage=rest.match(VAGE_RE);

  if(halb){ menge=0.5; rest=rest.slice(halb[0].length); gefunden=true;

  const wort=rest.match(/^([A-Za-zÄÖÜäöüß]+)\s+/);
  if(wort&&WORTZAHL[wort[1].toLowerCase()]!==undefined){
    menge=WORTZAHL[wort[1].toLowerCase()]; rest=rest.slice(wort[0].length); gefunden=true;
    return {menge,rest,gefunden};
  }
  const m=rest.match(/^(\d+(?:[.,]\d+)?)/);
  if(m){
    const nach=rest.slice(m[0].length);
    const echterBruch=nach.match(/^\s*\/\s*(\d+)/);          /* 1/2 */
    if(echterBruch&&+echterBruch[1]){
      menge=parseFloat(m[1].replace(",","."))/(+echterBruch[1]);
      rest=nach.slice(echterBruch[0].length).replace(/^\s*/,"");
    }else{
      menge=parseFloat(m[1].replace(",","."));
      rest=nach.replace(/^\s*/,"");
      const gemischt=rest.match(/^(\d+)\s*\/\s*(\d+)/);      /* 1 1/2 */
      if(gemischt&&+gemischt[2]){ menge+=(+gemischt[1])/(+gemischt[2]); weg(gemischt[0].length); }
      else if(BRUCH[rest[0]]){ menge+=BRUCH[rest[0]]; weg(1); }   /* 1 ½ */

      if(bereich) weg(bereich[0].length);

    menge=BRUCH[rest[0]]; weg(1); gefunden=true;
  }
  if(gefunden) menge=Math.round(menge*1000)/1000;
  return {menge,rest,gefunden};

  if(mEinh){const k=mEinh[1].toLowerCase().replace(".","");if(EINH[k]){einheit=EINH[k];t=t.slice(mEinh[0].length);}}
  const name=t.trim().replace(/\s*,\s*$/,"");
  if(!name) return null;
  if(menge&&!einheit) einheit="Stk";
  return [name,menge,einheit,katFuer(name)];
}
const parseZutaten=txt=>String(txt||"").split("\n").map(parseZutat).filter(Boolean);
const parseSchritte=txt=>String(txt||"").split("\n").map(z=>z.trim().replace(/^\d+[.)]\s*/,"")).filter(Boolean);

/* ===== Rezept aus einem Link holen ===== */
async function ausLinkHolen(){
  nfLesen();
  const u=(nf.q||"").trim();
  if(!/^https?:\/\//.test(u)){alert("Trag zuerst die Adresse des Rezepts ein.");return;}
  if(!cfg.leser){
    alert("Dafür fehlt noch der Rezept-Leser. Trag ihn unter Mehr ein – oder nimm „Rezepttext einfügen“, das geht ohne.");
    return;
  }
  nf.status="Wird geholt …"; formZeigen(true);
  try{
    const res=await fetch(cfg.leser.replace(/\/$/,"")+"/?url="+encodeURIComponent(u));
    const d=await res.json();
    if(d.fehler){nf.status=d.fehler;formZeigen(true);return;}
    if(d.name&&!nf.n.trim()) nf.n=d.name;
    if(d.zutaten&&d.zutaten.length) nf.zText=d.zutaten.join("\n");
    if(d.schritte&&d.schritte.length) nf.sText=d.schritte.join("\n");
    if(d.minuten){ nf.min=Math.min(180,d.minuten); nf.minAuto=false; }   /* Angabe der Quelle schlägt die Schätzung */
    if(d.portionen>1) nf.port=d.portionen;
    if(d.rohtext&&!(d.zutaten||[]).length) nf.zText=d.rohtext;
    nf.status=d.hinweis||(d.zutaten.length?"Übernommen. Bitte einmal gegenlesen.":"Nichts Verwertbares gefunden.");
    if(nf.port>1){
      if(BACKWERK.test(nf.n||"")){
        nf.status="Übernommen. Die Mengen gelten für "+nf.port+" Portionen – bei Gebackenem lasse ich sie so, umrechnen kannst du unten.";
      }else{
        const vorher=nf.port;
        aufEinePortionStill();
        nf.status="Übernommen und von "+vorher+" auf 1 Portion heruntergerechnet. Bitte einmal gegenlesen.";
      }
    }
  }catch(e){ nf.status="Der Rezept-Leser war nicht erreichbar."; }
  formZeigen(true);
}
/* Kuchen, Brot und Aufläufe backt man selten in Einzelportionen */
const BACKWERK=/kuchen|torte|brot|br(ö|oe)tchen|muffin|keks|pl(ä|ae)tzchen|blech|auflauf|gratin|waffel|pfannkuchen|pancake|strudel|tarte|quiche/i;
function aufEinePortionStill(){
  const n=nf.port||1; if(n<=1) return;
  nf.zText=parseZutaten(nf.zText).map(([name,q,e])=>{
    if(!q) return name;
    let v=q/n; v=v<1?Math.round(v*100)/100:Math.round(v*10)/10;
    return String(v).replace(".",",")+" "+(e?e+" ":"")+name;
  }).join("\n");
  nf.port=1;
}
/* Mengen von N Portionen auf eine herunterrechnen */
function aufEinePortion(){
  nfLesen();
  const n=nf.port||1; if(n<=1) return;
  nf.zText=parseZutaten(nf.zText).map(([name,q,e])=>{
    if(!q) return name;

    return String(v).replace(".",",")+" "+(e?e+" ":"")+name;
  }).join("\n");
  nf.port=1; nf.status="Auf eine Portion umgerechnet.";

}

   Der übliche Weg führt über Link oder Foto. Beide setzen voraus, dass die

/* Bleibt als Einstieg erhalten, führt jetzt aber über das Prüfblatt */
function textAufteilen(){

function textAufteilenAlt(){
  const roh=document.getElementById("roh").value;
  const zeilen=roh.split("\n").map(z=>z.trim().replace(/^[-–•*]\s*/,"")).filter(Boolean);
  const zut=[],schr=[];
  let modus=null;   /* Überschriften im Text sind das verlässlichste Signal */
  const einheiten="g|kg|ml|l|el|tl|stk|st|stück|dose|dosen|bund|zehe|zehen|prise|blatt|packung|pck|scheibe|scheiben|tasse|glas|kopf|stange|stangen|becher|zweig|zweige|handvoll|msp";
  zeilen.forEach(z=>{
    if(/^(zutaten|ingredients|einkaufsliste)\b/i.test(z)){modus="z";return;}
    if(/^(zubereitung|anleitung|schritte|so geht|zubereiten|instructions|und so)\b/i.test(z)){modus="s";return;}
    if(/^(tipp|hinweis|notiz|quelle|n(ä|ae)hrwerte)\b/i.test(z)) return;
    if(/^f(ü|ue)r (die|den|das)\b/i.test(z)&&z.length<40) return;   /* Zwischenüberschrift wie "Für die Sauce" */

    const nummeriert=/^\d+[.)]\s+\S/.test(z);
    if(nummeriert){schr.push(z.replace(/^\d+[.)]\s*/,""));return;}
    if(modus==="z"){zut.push(z);return;}
    if(modus==="s"){schr.push(z);return;}

    const mitMenge=new RegExp("^\\d+([.,]\\d+)?\\s*("+einheiten+")?\\.?\\s+\\S","i").test(z);
    const satzende=/[.!?:]\s*$/.test(z);
    const woerter=z.split(/\s+/).length;
    if(mitMenge&&!satzende&&z.length<70) zut.push(z);
    else if(!satzende&&woerter<=6&&z.length<45) zut.push(z);
    else schr.push(z);
  });
  nf.zText=zut.join("\n"); nf.sText=schr.join("\n");
  nf.status=zut.length+" Zutaten und "+schr.length+" Schritte erkannt. Bitte gegenlesen.";
  formZeigen();
}


/* ===== Rezepttext auswerten: säubern, einordnen, prüfen lassen =====
   Texterkennung liefert nie sauberen Text. Deshalb wird hier zuerst repariert,
   dann jede Zeile eingeordnet – und nichts ohne Kontrolle übernommen. */

/* Zeilen, die in keinem Rezept etwas verloren haben. Reihenfolge zählt:
   Der erste Treffer liefert die Begründung, die im Prüfblatt angezeigt wird. */
const MUELL=[
  [/^\s*(seite\s*)?\d{1,3}\s*$/i,                                   "Seitenzahl"],
  [/^[^a-zA-ZÄÖÜäöüß]+$/,                                           "kein Text"],
  [/(kcal|kj\b|n(ä|ae)hrwert|pro 100\s*g|brennwert|eiwei(ß|ss)\s*:|fett\s*:|kohlenhydrate\s*:|ballaststoffe\s*:)/i, "Nährwertangabe"],
  [/(www\.|https?:\/\/|@[a-z0-9_.]+|instagram|facebook|pinterest|tiktok|youtube)/i, "Netzadresse oder Konto"],
  [/(©|\ball rights\b|isbn|foto\s*:|fotos\s*:|bild\s*:|rezept von|abbildung)/i,     "Bildnachweis oder Impressum"],
  [/^(guten appetit|viel spa(ß|ss)|lass es dir schmecken|bon app)/i, "Grußformel"],
  [/^(werbung|anzeige|gesponsert)/i,                                 "Werbung"],
  [/^(drucken|speichern|teilen|merken|kommentare?|bewertung|jetzt bewerten|zum rezept springen)\b/i, "Knopfbeschriftung der Webseite"],
  /* Was aus sozialen Netzen mitkommt: Hashtag-Zeilen, Aufrufe, Umrechner-Knöpfe */
  [/^\s*#[\wÄÖÜäöüß]/,                                               "Hashtags"],
  [/^\s*(1\s*x\s*)?2\s*x\s*3\s*x\s*$/i,                             "Mengen-Umrechner der Webseite"],
  [/^\s*(speichern|abonnier|folgt|folge|like|kommentier|teil(t|e) das|swipe|link in bio)/i, "Aufruf aus dem sozialen Netz"],
  [/^\s*\d+([.,]\d+)?\s*(von|\/)\s*\d+\s*(bewertung|sterne|rezension)/i, "Bewertung"],
  [/^\s*(startseite|home|rezepte)\s*[»›>|]/i,                        "Brotkrumen-Navigation"],
  [/[»›]\s*\w+\s*[»›]/,                                             "Brotkrumen-Navigation"]
];
/* Angaben, die wir auswerten und danach nicht mehr brauchen */
const KOPFDATEN=[
  [/(zubereitungs|vorbereitungs|arbeits|gesamt|koch|back|gar|ruhe|wart)zeit/i, "Zeitangabe"],
  [/^\s*(schwierigkeit|niveau|level)\b/i,                        "Schwierigkeitsgrad"],
  [/^\s*f(ü|ue)r\s+\d+\s*(personen|portionen|st(ü|ue)ck)/i,      "Portionsangabe"],
  [/^\s*\d+\s*(personen|portionen)\b/i,                          "Portionsangabe"],
  /* Blogs schreiben die Zahl gern hinter das Wort: „Portionen 4 Portionen" */
  [/^\s*(portionen|personen|menge|ergibt)\b/i,                    "Portionsangabe"],
  [/^\s*(zutaten\s+f(ü|ue)r)\b/i,                                "Portionsangabe"]
];
/* Zeitangaben mitten im Text, wie sie in Videobeschreibungen stehen:
   „Dauert bei mir 15 Minuten", „in 20 Minuten fertig". Nur ohne Kochverb –
   „20 min köcheln lassen" ist ein Schritt und nicht die Gesamtdauer. */
const ZEIT_FREI=/(dauert|fertig in|geht in|in nur|braucht nur|ready in)\D{0,14}(\d{1,3})\s*(min|minuten)/i;
/* Wortstämme plus höchstens vier Buchstaben Endung. Ohne diese Grenze hielte
   die Erkennung „Kochkarussell“ oder „Backpapier“ für eine Handlungsanweisung. */
const KOCHVERB=/\b(schneid|hack|w(ü|ue)rfel|raspel|reib|sch(ä|ae)l|wasch|putz|erhitz|anbrat|brat|koch|gar|d(ü|ue)nst|schmor|back|r(ü|ue)hr|verr(ü|ue)hr|vermeng|vermisch|misch|untermeng|zugeb|hinzuf(ü|ue)g|abgie(ß|ss)|abtropf|w(ü|ue)rz|abschmeck|servier|anricht|garnier|bestreu|betr(ä|ae)ufel|einweich|marinier|knet|ausroll|beleg|(ü|ue)berback|p(ü|ue)rier|karamellisier|abl(ö|oe)sch|k(ö|oe)chel|simmer|halbier|viertel|entkern|anschwitz|glasier|wend|verteil)[a-zäöüß]{0,4}\b/i;
const EINHEIT_RE=/\b(g|gr|gramm|kg|ml|l|liter|el|essl(ö|oe)ffel|tl|teel(ö|oe)ffel|stk|st(ü|ue)ck|dose|dosen|bund|zehe|zehen|prise|prisen|blatt|bl(ä|ae)tter|packung|pck|scheibe|scheiben|tasse|glas|kopf|stange|stangen|becher|zweig|zweige|handvoll|msp|schale|w(ü|ue)rfel)\b/i;
const MENGE_RE=/^\s*(\d+[.,]?\d*|½|¼|¾|⅓|⅔|einige|etwas|je|ca\.?\s*\d+)/i;
/* Mengen in Worten zählen schwächer als Ziffern: „Eine Stunde ruhen lassen."
   fängt genauso an wie „Eine Zwiebel". Unterschieden wird über den Schlusspunkt
   – eine Zutatenzeile endet nicht wie ein Satz. */
const WORTMENGE_RE=/^\s*(ein(e|en|em|es)?|zwei|drei|vier|f(ü|ue)nf|sechs|sieben|acht|neun|zehn|elf|zw(ö|oe)lf|halbe(r|s|n)?|ein paar|ein wenig|reichlich)\s+\S/i;
const MENGE_ODER_WORT=z=>MENGE_RE.test(z)||WORTMENGE_RE.test(z);

/* Häufige Verwechslungen der Texterkennung, nur dort angewandt, wo sie eindeutig sind */
/* Bildzeichen tragen nie Information, die ins Rezept gehört – und sie
   verfälschen jede Längenmessung. Deshalb fliegen sie überall raus. */
const EMOJI=/[\u{1F000}-\u{1FAFF}\u{2190}-\u{21FF}\u{2300}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{20E3}]/gu;
function ocrReparieren(z){
  return z
    .replace(EMOJI,"")
    .replace(/[|¦]/g," ")
    .replace(/(\d)\s*[9q]\b/g,"$1 g")            /* "250 9" ist fast immer "250 g" */
    .replace(/\b([EJ])[lI1]\b/g,"EL").replace(/\bT[lI1]\b/g,"TL")
    .replace(/\bm[lI1]\b/gi,"ml")
    .replace(/(\d)[,.](\d)\s*kg\b/gi,"$1,$2 kg")
    .replace(/\s{2,}/g," ")
    .replace(/^[\s\-–—•*·°«»~>»]+/,"")
    .replace(/[\s.,;]+$/,m=>/[.!?]$/.test(m)?".":"")
    .trim();
}
/* Umbrüche mitten im Satz wieder zusammenziehen. Zwei Signale:
   die Folgezeile beginnt klein, oder die Vorzeile endet auf einem Wort,
   nach dem kein Satz aufhört – „… anbraten. Dann mit / Kokosmilch ablöschen“. */
const HAENGT=/\s(mit|und|oder|in|im|am|auf|aus|bei|für|zu|zum|zur|von|vom|der|die|das|den|dem|des|einen|einem|eine|ein|etwas|dann|danach|bis|über|unter|nach|vor|ohne|je)$/i;
function zeilenBinden(zeilen){
  const raus=[];
  zeilen.forEach(z=>{
    const letzte=raus[raus.length-1];
    const offen=letzte&&letzte.length>25&&!/[.!?:]$/.test(letzte);
    const passt=offen&&(/^[a-zäöüß(]/.test(z)||HAENGT.test(letzte));
    /* Ohne die Wortmengen hielt die Bindung „ein Schuss Olivenöl" für die
       Fortsetzung der Zeile davor und klebte zwei Zutaten zusammen. */
    const neueZutat=MENGE_ODER_WORT(z)||/^\d+[.)]\s/.test(z);
    if(passt&&!neueZutat) raus[raus.length-1]=letzte+" "+z; else raus.push(z);
  });
  return raus;
}
/* Wie stark spricht die Zeile für Zutat, wie stark für Zubereitungsschritt */
function zeilenUrteil(z){
  const woerter=z.split(/\s+/).length;
  const satzende=/[.!?]$/.test(z);
  const bekannt=(()=>{ const idx=KAT_INDEX(); const t=slug(z);
    return Object.keys(idx).some(k=>k.length>4&&t.includes(k)); })();
  let zut=0, schr=0;
  if(MENGE_RE.test(z)) zut+=3;
  if(!satzende&&WORTMENGE_RE.test(z)) zut+=2;
  if(EINHEIT_RE.test(z.slice(0,18))) zut+=2;
  if(woerter<=6) zut+=1;
  if(!satzende) zut+=1;
  if(bekannt) zut+=2;
  if(/,\s*(gew(ü|ue)rfelt|gehackt|in scheiben|fein|klein|geschnitten|gerieben)/i.test(z)) zut+=1;
  if(KOCHVERB.test(z)) schr+=3;
  if(satzende) schr+=2;
  if(woerter>=9) schr+=2;
  if(/^\d+[.)]\s+\S/.test(z)) schr+=4;
  if(z.length>90) schr+=2;
  return {zut,schr};
}
/* Ergebnis: eine Liste aus {t, art, grund}. art ist "zutat", "schritt" oder "weg". */
/* Die Überschriften, an denen sich alles ausrichtet. Videobeschreibungen
   schreiben selten „Zutaten" – dort steht „Ihr braucht" oder „Das brauchst du".
   Fehlte die Formulierung, landeten sämtliche Zutaten im Kopfbereich und damit
   im Müll. Genau daran ist der TikTok-Fall gescheitert. */
const ZUTAT_UEBER_RE=/^\s*(zutaten(liste)?|ingredients|einkaufsliste|(das |was )?(du |ihr |man )?(braucht|brauchst|ben(ö|oe)tigst|ben(ö|oe)tigt)( ihr| du| man)?|man nehme|daf(ü|ue)r brauchst du)\b\s*:?\s*$/i;
const SCHRITT_UEBER_RE=/^\s*(zubereitung|anleitung|schritte|zubereiten|ablauf|los geht.?s|(und )?so geht.?s|so wird.?s|so geht|so wird|und so|schritt f(ü|ue)r schritt|instructions|method|directions)\b\s*:?\s*$/i;
const UEBERSCHRIFT_RE=new RegExp(ZUTAT_UEBER_RE.source+"|"+SCHRITT_UEBER_RE.source,"i");
/* Der Titel darf Bildzeichen und angehängte Aufrufe verlieren, ohne dass die
   ganze Zeile deshalb im Müll landet: „CREAMY GNOCCHI speichern nicht
   vergessen!!" soll „CREAMY GNOCCHI" ergeben. */
function titelSaeubern(z){
  return String(z||"")
    .replace(/\s*[|·–—-]?\s*(speichern nicht vergessen|unbedingt speichern|rezept speichern|link in bio|folgt? mir\b.*|abonniert\b.*)\s*[!.]*\s*$/i,"")
    /* Und das nackte „speichern!!" am Ende, das in Kurzvideos überall steht.
       Nur wenn davor noch etwas übrig bleibt – sonst hieße das Rezept nichts. */
    .replace(/\s+(speichern|merken|abspeichern)\s*[!.]*\s*$/i,(m,w,i,ganz)=>i>2?"":m)
    .replace(/[!?]{2,}\s*$/,"")
    .replace(/^[\s\-–—•*·:]+|[\s\-–—•*·:]+$/g,"")
    .replace(/\s{2,}/g," ")
    .trim();
}
/* Steht alles in einem Fließtext, gibt es keine Zeile, die für sich eine Zutat
   wäre. Dann hilft nur der Anlauf: „… brauchst du 300 g Spaghetti, 150 g
   Pancetta, 3 Eier und Pfeffer." Ab dem Auslöser wird an Kommas und „und"
   getrennt. Nur wenn mindestens zwei Teile eine Menge tragen – sonst zerlegt
   die Regel jeden beliebigen Satz. */
const BRAUCHT_RE=/(brauchst du|braucht ihr|brauchen wir|ben(ö|oe)tigst du|ben(ö|oe)tigt ihr|ihr braucht|du brauchst|man braucht|zutaten\s*:)/i;
function fliesstextZerlegen(liste){
  if(liste.some(x=>x.art==="zutat")) return liste;
  const raus=[];
  liste.forEach(x=>{
    if(x.art!=="schritt"||!BRAUCHT_RE.test(x.t)){ raus.push(x); return; }
    const saetze=x.t.match(/[^.!?]+[.!?]*/g)||[x.t];
    const rest=[], gefunden=[];
    saetze.forEach(satz=>{
      const pos=satz.search(BRAUCHT_RE);
      if(pos<0){ rest.push(satz.trim()); return; }
      const nach=satz.slice(pos).replace(BRAUCHT_RE,"").replace(/^[\s:]+/,"").replace(/[.!?]\s*$/,"");
      const teile=nach.split(/\s*,\s*|\s+und\s+|\s+sowie\s+/i).map(t=>t.trim()).filter(Boolean);
      const mitMenge=teile.filter(t=>MENGE_RE.test(t)).length;
      if(mitMenge>=2&&teile.every(t=>t.split(/\s+/).length<=6)){
        teile.forEach(t=>gefunden.push(t));
        const vor=satz.slice(0,pos).trim();
        if(vor.length>18) rest.push(vor);
      } else rest.push(satz.trim());
    });
    gefunden.forEach(t=>raus.push({t,art:"zutat",grund:""}));
    const uebrig=rest.filter(Boolean).join(" ").trim();
    /* Im Fließtext steckt die Zubereitung als Satzfolge in einer einzigen Zeile.
       Hier – und nur hier, wo die Vorlage ohnehin keine Zeilen hatte – wird je
       Satz ein Schritt daraus. */
    if(uebrig){
      const saetze=(uebrig.match(/[^.!?]+[.!?]*/g)||[uebrig]).map(t=>t.trim()).filter(t=>t.length>12);
      if(gefunden.length&&saetze.length>1) saetze.forEach(t=>raus.push({...x,t}));
      else raus.push({...x,t:uebrig});
    }
  });
  return raus;
}

/* „Salz Pfeffer Muskat" ist eine Zeile und drei Zutaten. Trennen ist heikel:
   „Kartoffeln festkochend" und „Petersilie, gehackt" dürfen gerade nicht
   auseinanderfallen. Der Prüfstein ist die Abteilung – `katFuer` liefert für
   echte Zutaten ein Fach und für Zusätze wie „festkochend" oder „gehackt" nur
   den Sammelposten. Getrennt wird nur, wenn jeder Teil ein eigenes Fach hat.
   Ohne Trennzeichen, also allein an Leerzeichen, braucht es zusätzlich drei
   Teile – sonst zerfiele „Feta Käse" in zwei Zutaten. */
function zutatZeileTeilen(z){
  const roh=String(z||"").trim();
  if(roh.length<5) return null;
  if(mengeLesen(roh).gefunden) return null;          /* mit Menge bleibt es eine Zutat */
  const trenner=/\s*[,;&\/]\s*|\s+und\s+|\s+sowie\s+/i;
  let teile=roh.split(trenner).map(t=>t.trim()).filter(Boolean);
  let mindest=2;
  if(teile.length<2){ teile=roh.split(/\s+/); mindest=3; }
  if(teile.length<mindest) return null;
  const eigen=teile.every(t=>{
    if(t.split(/\s+/).length>2) return false;
    if(mengeLesen(t).gefunden) return false;
    return katFuer(t)!=="so"||KAT_INDEX()[slug(t)]!==undefined;
  });
  return eigen?teile:null;
}

function textEinordnen(roh){
  let zeilen=String(roh||"").split(/\r?\n/).map(ocrReparieren).filter(Boolean);
  zeilen=zeilenBinden(zeilen);
  /* Zwei gleiche Zeilen hintereinander entstehen bei Spaltensatz regelmäßig */
  zeilen=zeilen.filter((z,i)=>i===0||slug(z)!==slug(zeilen[i-1]));

  const funde={portionen:0,minuten:0,titel:""};
  /* Zeiten werden gesammelt statt beim ersten Treffer festgeschrieben: Eine
     Gesamtzeit schlägt alles, sonst zählt die Summe aus Vorbereitung und
     Kochen, und erst wenn beides fehlt, gilt die einzelne Angabe. */
  const zeit={gesamt:0,teile:[],einzeln:0};

  /* Eine Zeile, die für sich schon eine Zutat ist: kurze Zeile mit Menge und
     ohne Kochverb. Sie beendet den Kopfbereich – auch ohne Überschrift. */
  const istZutatZeile=z=>MENGE_ODER_WORT(z)&&z.split(/\s+/).length<=9&&!KOCHVERB.test(z)&&!/[.!?]$/.test(z);
  /* Der Kopfbereich endet an der ersten Überschrift ODER an der ersten Zutat.
     Vorher wurde alles bis zur ersten Überschrift verworfen – bei Texten, deren
     Zutaten vor der Zubereitungs-Überschrift stehen, war damit die halbe
     Zutatenliste weg. */
  let kopfEnde=zeilen.findIndex(z=>UEBERSCHRIFT_RE.test(z)||istZutatZeile(z));
  const hatAbschnitte=kopfEnde>=0;
  let titelIdx=-1;
  if(hatAbschnitte){
    let best=-1;
    zeilen.slice(0,Math.min(kopfEnde,8)).forEach((z,i)=>{
      if(MENGE_RE.test(z)||KOCHVERB.test(z)) return;
      if(MUELL.some(([re])=>re.test(z))||KOPFDATEN.some(([re])=>re.test(z))) return;
      const sauber=titelSaeubern(z);
      if(sauber.length<5||sauber.length>70) return;
      if(/:$/.test(z)) return;
      /* Je näher an den Zutaten, desto eher ist es der Titel und nicht der
         Name des Blogs – deshalb zählt die Nähe mehr als die Länge. */
      const wert=i*10+Math.min(sauber.length,40)/10+(/-/.test(sauber)?2:0);
      if(wert>best){best=wert;titelIdx=i;}
    });
  }
  const liste=[];
  let modus=null;
  zeilen.forEach((z,i)=>{
    /* Abschnittsüberschriften sind das verlässlichste Signal im ganzen Text */
    if(ZUTAT_UEBER_RE.test(z)){modus="zutat";liste.push({t:z,art:"weg",grund:"Überschrift"});return;}
    if(SCHRITT_UEBER_RE.test(z)){modus="schritt";liste.push({t:z,art:"weg",grund:"Überschrift"});return;}
    if(/^(tipp|hinweis|variante|notiz|quelle|aufbewahrung|meal prep|n(ä|ae)hrwerte)\b/i.test(z)){modus="weg";liste.push({t:z,art:"weg",grund:"Überschrift"});return;}
    if(/^f(ü|ue)r (die|den|das)\b/i.test(z)&&z.length<45){modus="zutat";liste.push({t:z,art:"weg",grund:"Zwischenüberschrift"});return;}

    for(const [re,grund] of KOPFDATEN){
      if(re.test(z)){
        const mp=z.match(/(\d+)\s*(personen|portionen|st(ü|ue)ck)/i)||z.match(/(?:portionen|personen)\D{0,3}(\d+)/i);
        if(mp&&!funde.portionen) funde.portionen=+mp[1];
        const mz=z.match(/(\d+)\s*(min|minuten)/i);
        const ms=z.match(/(\d+)\s*(std|stunden?|h)\b/i);
        const minuten=mz?+mz[1]:(ms?+ms[1]*60:0);
        if(minuten){
          if(/gesamtzeit/i.test(z)) zeit.gesamt=minuten;
          else if(/(zubereitungs|vorbereitungs|arbeits|koch|back|gar)zeit/i.test(z)) zeit.teile.push(minuten);
          else if(!zeit.einzeln) zeit.einzeln=minuten;
        }
        liste.push({t:z,art:"weg",grund}); return;
      }
    }
    /* „Dauert bei mir 15 Minuten" – die Angabe aus Videobeschreibungen */
    const zf=!KOCHVERB.test(z)&&z.length<60&&z.match(ZEIT_FREI);
    if(zf){ if(!zeit.einzeln) zeit.einzeln=+zf[2]; liste.push({t:z,art:"weg",grund:"Zeitangabe"}); return; }

    let raus=null;
    for(const [re,grund] of MUELL) if(re.test(z)){raus=grund;break;}
    /* Sehr kurze Bruchstücke ohne Menge sind fast immer Erkennungsfehler */
    if(!raus&&z.length<3) raus="zu kurz";
    if(!raus&&(z.replace(/[^a-zA-ZÄÖÜäöüß]/g,"").length/z.length)<0.45&&!MENGE_RE.test(z)) raus="unlesbar";
    if(raus){liste.push({t:z,art:"weg",grund:raus});return;}

    if(hatAbschnitte&&i<kopfEnde){
      if(i===titelIdx){ funde.titel=titelSaeubern(z); liste.push({t:z,art:"weg",grund:"Titel"}); return; }
      liste.push({t:z,art:"weg",grund:"Kopfzeile"}); return;
    }
    /* Ohne Überschriften: die erste Zeile ist der Titel, wenn direkt danach eine Menge folgt */
    if(!hatAbschnitte&&i===0&&!MENGE_RE.test(z)&&!KOCHVERB.test(z)&&z.length<60&&MENGE_RE.test(zeilen[1]||"")){
      funde.titel=titelSaeubern(z); liste.push({t:z,art:"weg",grund:"Titel"}); return;
    }
    if(modus==="weg"){liste.push({t:z,art:"weg",grund:"steht unter Tipps"});return;}
    if(modus==="zutat"&&!/^\d+[.)]\s/.test(z)){liste.push({t:z,art:"zutat",grund:""});return;}
    if(modus==="schritt"){liste.push({t:z,art:"schritt",grund:""});return;}

    const u=zeilenUrteil(z);
    liste.push({t:z,art:u.schr>u.zut?"schritt":"zutat",grund:""});
  });
  funde.minuten=zeit.gesamt||zeit.teile.reduce((a,b)=>a+b,0)||zeit.einzeln;
  /* Zum Schluss die Sammelzeilen auftrennen. Im Prüfblatt steht der Grund
     daneben, damit sichtbar bleibt, dass hier etwas geschehen ist. */
  const fertig=[];
  fliesstextZerlegen(liste).forEach(x=>{
    const teile=x.art==="zutat"?zutatZeileTeilen(x.t):null;
    if(teile) teile.forEach(t=>fertig.push({t,art:"zutat",grund:"aus einer Zeile getrennt"}));
    else fertig.push(x);
  });
  return {liste:fertig,funde};
}

/* ===== Prüfblatt: nichts wird ungesehen übernommen ===== */
let pruef=null;
function pruefStart(roh){
  const {liste,funde}=textEinordnen(roh);
  pruef={zeilen:liste,funde,zeigeWeg:false};
  pruefBlatt();
}
function pruefSetzen(i,art){ if(!pruef)return; pruef.zeilen[i].art=art; pruef.zeilen[i].grund=""; pruefBlatt(); }
function pruefAlle(art,von){ if(!pruef)return; pruef.zeilen.forEach(z=>{if(z.art===von)z.art=art;}); pruefBlatt(); }
function pruefWegZeigen(){ if(!pruef)return; pruef.zeigeWeg=!pruef.zeigeWeg; pruefBlatt(); }
function pruefBlatt(){
  const z=pruef.zeilen;
  const anzahl=a=>z.filter(x=>x.art===a).length;
  const knopf=(i,art,zeichen,titel)=>`<button class="pz${z[i].art===art?" an":""}" onclick="pruefSetzen(${i},'${art}')" aria-label="${titel}" title="${titel}">${zeichen}</button>`;
  const zeile=(x,i)=>`<div class="pruefz${x.art==="weg"?" aus":""}">
      <span class="pt">${esc(x.t)}${x.grund?`<i>${esc(x.grund)}</i>`:""}</span>
      <span class="pw">${knopf(i,"zutat","Z","Als Zutat")}${knopf(i,"schritt","S","Als Schritt")}${knopf(i,"weg","✕","Nicht übernehmen")}</span>
    </div>`;
  const teil=(art,titel,hinweis)=>{
    const eintraege=z.map((x,i)=>[x,i]).filter(([x])=>x.art===art);
    if(!eintraege.length) return `<div class="sect"><h2>${titel}</h2><span class="zahl">0</span></div>
      <p class="note" style="margin-bottom:10px">${hinweis}</p>`;
    return `<div class="sect"><h2>${titel}</h2><span class="zahl">${eintraege.length}</span></div>
      <div class="card" style="padding:4px 0;margin-bottom:12px">${eintraege.map(([x,i])=>zeile(x,i)).join("")}</div>`;
  };
  /* „1 Schritte" liest sich wie ein Fehler und ist einer */
  const mz=(n,ein,viele)=>n+" "+(n===1?ein:viele);
  const f=pruef.funde;
  const gefunden=[f.titel?`Titel „${f.titel}“`:"",f.portionen?`${f.portionen} Portionen`:"",f.minuten?`${f.minuten} Minuten`:""].filter(Boolean);
  openSheet(`<div class="grab"></div><h2 style="font-size:20px">Erkannten Text prüfen</h2>
    <p class="note" style="margin:8px 0 10px">Jede Zeile ist vorsortiert. Mit <b>Z</b>, <b>S</b> und <b>✕</b> änderst du die Einordnung, bevor etwas ins Rezept wandert.${gefunden.length?" Nebenbei erkannt: "+esc(gefunden.join(", "))+".":""}</p>
    ${teil("zutat","Zutaten","Noch nichts als Zutat eingeordnet.")}
    ${teil("schritt","Zubereitung","Noch nichts als Schritt eingeordnet.")}
    <button class="btn btn-s" onclick="pruefWegZeigen()">${pruef.zeigeWeg?"Aussortiertes ausblenden":`Aussortiertes anzeigen (${anzahl("weg")})`}</button>
    ${pruef.zeigeWeg?`<p class="note" style="margin:10px 0 6px">Diese Zeilen bleiben draußen. Kursiv steht der Grund.</p>
      <div class="card" style="padding:4px 0;margin-bottom:12px">${z.map((x,i)=>[x,i]).filter(([x])=>x.art==="weg").map(([x,i])=>zeile(x,i)).join("")}</div>`:""}
    <button class="btn btn-primary btn-wide" style="margin-top:12px" onclick="pruefUebernehmen()">${mz(anzahl("zutat"),"Zutat","Zutaten")} und ${mz(anzahl("schritt"),"Schritt","Schritte")} übernehmen</button>
    <button class="btn btn-wide" style="margin-top:6px" onclick="pruefRohtext()">Text von Hand nachbessern</button>
    <button class="btn btn-wide btn-ghost" style="margin-top:6px" onclick="formZeigen()">Abbrechen</button>`, true);
}
function pruefRohtext(){
  const t=pruef.zeilen.map(x=>x.t).join("\n");
  openSheet(`<div class="grab"></div><h2 style="font-size:20px">Text nachbessern</h2>
    <p class="note" style="margin:8px 0 12px">Korrigier Erkennungsfehler hier. Danach wird der Text neu eingeordnet.</p>
    <textarea id="roh" rows="14">${esc(t)}</textarea>
    <button class="btn btn-primary btn-wide" style="margin-top:10px" onclick="pruefStart(document.getElementById('roh').value)">Neu einordnen</button>
    <button class="btn btn-wide btn-ghost" style="margin-top:6px" onclick="pruefBlatt()">Zurück</button>`);
}
function pruefUebernehmen(){
  if(!pruef) return;
  if(!nf) neuesRezept();
  const zut=pruef.zeilen.filter(x=>x.art==="zutat").map(x=>x.t);
  const schr=pruef.zeilen.filter(x=>x.art==="schritt").map(x=>x.t);
  const f=pruef.funde;
  nf.zText=zut.join("\n"); nf.sText=schr.join("\n");
  if(f.titel&&!nf.n) nf.n=f.titel;
  /* Steht die Zeit in der Vorlage, gilt sie – die Schätzung darf sie nicht überschreiben */
  if(f.minuten){ nf.min=f.minuten; nf.minAuto=false; }
  if(f.portionen>1) nf.port=f.portionen;
  const unklar=parseZutaten(nf.zText).filter(x=>x[3]==="so").length;
  nf.status=zut.length+(zut.length===1?" Zutat":" Zutaten")+" und "+schr.length+(schr.length===1?" Schritt":" Schritte")+" übernommen."
    +(f.portionen>1?" Die Mengen gelten laut Vorlage für "+f.portionen+" Portionen – der Knopf oben rechnet sie auf eine herunter.":"")
    +(unklar?" "+unklar+" Zutat"+(unklar>1?"en":"")+" ohne Abteilung, bitte prüfen.":"");
  pruef=null;
  formZeigen();
}


/* ===== Grobe Schätzung von Protein und Aufwand =====
   Nur ein Anhaltspunkt, damit ein neues Rezept nicht mit 20 g und 30 Minuten
   dasteht und den Wochenschnitt verfälscht. Sobald du ein Feld anfasst,
   bleibt dein Wert stehen. */

/* Gramm Protein je 100 g. Reihenfolge zählt: der erste Treffer gewinnt,
   deshalb stehen die genauen Begriffe vor den allgemeinen. */
const PROT100=[
  [/proteinpulver|eiwei(ß|ss)pulver/i,80],
  [/parmesan|pecorino|bergk(ä|ae)se|grana/i,32],
  [/k(ü|ue)rbiskern/i,30],
  [/seitan/i,25],
  [/erdnussmus|erdnussbutter|mandelmus/i,25],
  [/sonnenblumenkern|sesam|leinsam|hanfsam|pinienkern/i,22],
  [/thunfisch|garnele|shrimp/i,24],
  [/h(ä|ae)hnchen|h(ü|ue)hner|puten|pute\b|geflügel/i,23],
  [/rinder|rind\b|hackfleisch|steak|gulasch/i,21],
  [/mandel|walnuss|hasel|cashew|pistazie|n(ü|ue)sse|nuss/i,20],
  [/lachs|forelle|kabeljau|dorsch|seelachs|makrele|hering/i,20],
  [/tempeh/i,19],
  [/fisch/i,18],
  [/chia|leinsaat/i,17],
  [/feta|hirtenk(ä|ae)se|halloumi/i,17],
  [/mozzarella|gouda|edamer|emmentaler|cheddar|k(ä|ae)se/i,25],
  [/linsen|kichererbsen|bohnen|kidney|erbsen.*getrocknet/i,24],
  [/quinoa/i,14],
  [/haferflocken|hafer\b/i,13],
  [/tofu/i,12],
  [/magerquark|quark|skyr|h(ü|ue)ttenk(ä|ae)se/i,12],
  [/nudel|pasta|spaghetti|penne|couscous|bulgur|dinkel|vollkornmehl/i,12],
  [/\bei\b|\beier\b/i,13],
  [/griechischer joghurt|sojajoghurt/i,9],
  [/brot|br(ö|oe)tchen|toast|fladen|wrap|tortilla/i,8],
  [/reis\b|hirse|polenta|mehl/i,7],
  [/frischk(ä|ae)se|schmand|cr(è|e)me fra(î|i)che/i,7],
  [/erbse|edamame/i,5],
  [/joghurt|kefir|buttermilch/i,4],
  [/milch|hafermilch|sojamilch|sahne|kokosmilch/i,3],
  [/brokkoli|spinat|gr(ü|ue)nkohl|rosenkohl|pilz|champignon|mais/i,3],
  [/kartoffel|s(ü|ue)(ß|ss)kartoffel/i,2],
  [/(ö|oe)l|butter|essig|zucker|honig|sirup|salz|pfeffer|gew(ü|ue)rz|kr(ä|ae)uter/i,0]
];
/* Übliche Gewichte, damit „1 Zwiebel“ oder „1 Dose“ in Gramm umgerechnet werden kann */
const STUECK={ei:60,eier:60,zwiebel:100,schalotte:40,knoblauch:5,zehe:5,paprika:150,tomate:80,
  kartoffel:100,moehre:80,karotte:80,zucchini:250,aubergine:300,gurke:300,avocado:150,
  zitrone:100,limette:60,apfel:150,banane:120,orange:180,mango:300,fenchel:250,
  lauch:200,brokkoli:400,blumenkohl:700,kuerbis:1000,suesskartoffel:200,
  brot:50,broetchen:60,scheibe:25,wrap:60,tortilla:60,huehnerbrust:150,filet:150};

const STUECK_STD=100;
const EINHEIT_G={g:1,kg:1000,ml:1,l:1000,EL:15,TL:5,Msp:1,Prise:1,Dose:250,Packung:250,
  Bund:30,Blatt:4,Scheibe:25,Becher:200,Glas:200,Tasse:150,Handvoll:30,Kopf:400,
  Stange:80,Zweig:4,Schale:250,"Würfel":10,Stk:0,Zehe:5};
function zutatGramm(name,menge,einheit){
  if(!menge) return 0;
  if(einheit==="Stk"||!einheit){
    const t=slug(name);
    for(const [k,g] of Object.entries(STUECK)) if(t.includes(k)) return menge*g;
    return menge*STUECK_STD;
  }
  const f=EINHEIT_G[einheit];
  return f?menge*f:menge*STUECK_STD;
}
function proteinJe100(name){
  for(const [re,g] of PROT100) if(re.test(name)) return g;
  return 1.5;   /* Gemüse und alles Unbekannte: sehr wenig, aber nicht null */
}
/* Erwartet Zutaten für EINE Portion, so wie sie in der App überall stehen */
function proteinSchaetzen(zut){
  if(!zut||!zut.length) return 0;
  let g=0;
  zut.forEach(([n,m,e])=>{ g+=zutatGramm(n,m,e)*proteinJe100(n)/100; });
  return Math.max(0,Math.round(g));
}
/* Aufwand aus Zutatenzahl und den Garverfahren, die im Text vorkommen */
const AUFWAND=[
  [/(ü|ue)ber nacht|(ü|ue)ber ?nacht|quellen lassen|einweichen|marinieren|gehen lassen|ruhen lassen/i,20],
  [/backofen|backen|(ü|ue)berbacken|auflauf|gratin|r(ö|oe)sten im ofen/i,25],
  [/schmoren|k(ö|oe)cheln|simmern|einkochen/i,18],
  [/kochen|garen|d(ü|ue)nsten/i,10],
  [/braten|anbraten|scharf anbraten/i,8],
  [/p(ü|ue)rieren|mixen|kneten|ausrollen/i,6]
];
function dauerSchaetzen(zut,schritte){
  const n=(zut||[]).length;
  if(!n&&!(schritte||[]).length) return 0;
  let min=6+Math.min(18,n*1.5);                 /* Vorbereitung wächst mit der Zutatenzahl */
  const text=(schritte||[]).join(" ");
  AUFWAND.forEach(([re,z])=>{ if(re.test(text)) min+=z; });
  min+=Math.min(10,(schritte||[]).length*1.5);
  return Math.max(5,Math.min(120,Math.round(min/5)*5));
}
/* Setzt die geschätzten Werte, solange die Felder nicht von Hand geändert wurden */
function schaetzungAuffrischen(){
  if(!nf) return;
  const zut=parseZutaten(nf.zText), schr=parseSchritte(nf.sText);
  if(nf.pAuto!==false){ const p=proteinSchaetzen(zut); if(p) nf.p=p; }
  if(nf.minAuto!==false){ const m=dauerSchaetzen(zut,schr); if(m) nf.min=m; }
}

/* ===== Formular ===== */
let nf=null;
function neuesRezept(vorgabe){
  nf={id:null,n:"",q:"",k:"veg",typ:"haupt",ma:["a"],min:30,p:20,zText:"",sText:"",why:"",port:1,status:"",roh:"",
      pAuto:true,minAuto:true,...(vorgabe||{})};
  formZeigen();
}
function rezeptBearbeiten(id){
  const r=R(id); if(!r) return;
  nf={id,n:r.n,q:r.q||"",k:r.k,kFest:!!r.kFest,typ:typVon(r),ma:[...(r.ma||[])],min:r.min,p:r.p,why:r.why||"",
      zText:r.z.map(([n,q,e])=>(q?(Number.isInteger(q)?q:String(q).replace(".",","))+" "+(e?e+" ":""):"")+n).join("\n"),
      sText:(r.s||[]).join("\n"),port:1,status:"",roh:"",pAuto:false,minAuto:false};
  formZeigen();
}
function nfLesen(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:"";};
  const feld=id=>!!document.getElementById(id);
  nf.n=g("nfn"); nf.q=g("nfq");
  /* Weicht der Wert von der Schätzung ab, hat jemand ihn getippt – ab dann gilt er */
  if(feld("nfmin")){ const m=+g("nfmin")||0; if(m&&m!==nf.min) nf.minAuto=false; if(m) nf.min=m; }
  if(feld("nfp")){ const p=+g("nfp"); if(p!==nf.p&&g("nfp")!=="") nf.pAuto=false; if(g("nfp")!=="") nf.p=p; }
  nf.zText=g("nfz"); nf.sText=g("nfs");
  if(document.getElementById("nfroh")) nf.roh=g("nfroh");
  schaetzungAuffrischen();
}
function nfSet(feld,wert){
  nfLesen();
  if(feld==="ma"){nf.ma=nf.ma.includes(wert)?nf.ma.filter(x=>x!==wert):[...nf.ma,wert];if(!nf.ma.length)nf.ma=[wert];}
  else nf[feld]=wert;
  if(feld==="k") nf.kFest=true;   /* ab jetzt hat die Automatik hier nichts mehr zu suchen */
  formZeigen(true);
}
function nfPruefen(){nfLesen();formZeigen(true);}
function formZeigen(behalten){
  schaetzungAuffrischen();
  const zut=parseZutaten(nf.zText), unklar=zut.filter(z=>z[3]==="so").length;
  openSheet(`<div class="grab"></div>
    <h2 style="font-size:20px">${nf.id?"Rezept bearbeiten":"Eigenes Rezept"}</h2>
    ${einwurfFeld()}
    <label class="fl" for="nfn">Name</label>
    <input type="text" id="nfn" value="${esc(nf.n)}" placeholder="Auberginen-Pasta">
    <label class="fl" for="nfq">Link zum Originalrezept (optional)</label>
    <input type="text" id="nfq" value="${esc(nf.q)}" placeholder="https://...">
    <div class="row-btns" style="margin-top:8px">
      <button class="btn btn-s${cfg.leser?" btn-primary":""}" onclick="ausLinkHolen()">Aus Link holen</button>

const KH={nudeln:"Nudeln",reis:"Reis",kartoffeln:"Kartoffeln",getreide:"Getreide",brot:"Brot",huelsen:"Hülsenfrüchte",ohne:"Ohne Beilage"};
/* Reihenfolge entscheidet: Dal mit Reis zählt als Reis, Linsensalat als Hülsenfrucht */
const KH_REGELN=[
 ["nudeln",/nudel|pasta|spaghetti|lasagne|udon|reisnudel|gnocchi|tortellini/i],
 ["reis",/^reis$|risottoreis|langkornreis|vollkornreis|basmati/i],
 ["kartoffeln",/kartoffel|s(ü|ue)(ß|ss)kartoffel/i],
 ["getreide",/couscous|hirse|quinoa|grie(ß|ss)|haferflocken|bulgur|polenta|mehl|paniermehl/i],
 ["brot",/brot|br(ö|oe)tchen|tortilla|bagel|baguette|ciabatta|fladen|toast|reispapier|wrap/i],
 ["huelsen",/linsen|bohnen|kichererbsen|erbsen/i]
];
const _khCache={};
function khVon(r){
  if(!r) return "ohne";
  if(_khCache[r.id]!==undefined&&r.src!=="eigen") return _khCache[r.id];
  let treffer="ohne";
  for(const [k,re] of KH_REGELN){ if(r.z.some(z=>re.test(z[0]))){treffer=k;break;} }
  if(r.src!=="eigen") _khCache[r.id]=treffer;
  return treffer;
}
/* Welche Beilagen kommen in der gewählten Woche schon vor? */
function khInWoche(w,ausser){
  const z={};
  slots(w).forEach(k=>{ if(k===ausser) return;
    const e=S.plan[k]; if(!e) return; const r=R(e.r); if(!r) return;
    const b=khVon(r); z[b]=(z[b]||0)+1; });
  return z;
}
function khOffen(w,ausser){
  const da=khInWoche(w,ausser);
  return ["nudeln","reis","kartoffeln","getreide","huelsen","brot"].filter(k=>!da[k]);
}

/* ===== Angebote: mehrere Prospekte mit eigenem Zeitraum ===== */
/* S.angebote = { p_2026-08-15: {von, bis, items:[], quelle, geholt} } */
const angeboteListe=()=>Object.entries(S.angebote||{})
  .filter(([,p])=>p&&Array.isArray(p.items))
  .map(([id,p])=>({id,...p}))
  .sort((a,b)=>String(a.bis).localeCompare(String(b.bis)));

/* toISOString() rechnet nach UTC um. Östlich von UTC+12 fällt die Ortszeit 12 Uhr
   dort auf den Vortag, und die Wochenspanne begann am Sonntag statt am Montag.
   Der Kalendertag muss aus den örtlichen Feldern kommen. */
const isoTag=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const isoHeute=()=>isoTag(new Date());
/* Montag und Sonntag der Planwoche, damit Angebote zur richtigen Woche passen */
function wochenSpanne(w){
  const d=new Date(); d.setHours(12,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7)+w*7);
  const mo=new Date(d), so=new Date(d.getTime()+6*86400000);
  return [isoTag(mo), isoTag(so)];
}
/* Ein Prospekt zählt für eine Woche, wenn sich die Zeiträume überschneiden */
const deckt=(p,von,bis)=>(!p.bis||p.bis>=von)&&(!p.von||p.von<=bis);
function angeboteFuerWoche(w){
  const [von,bis]=wochenSpanne(w);
  const treffer=angeboteListe().filter(p=>deckt(p,von,bis));
  return [...new Set(treffer.flatMap(p=>p.items))];
}
function angeboteAktiv(w){
  if(w===undefined) w=(typeof planWoche==="number"?planWoche:0);
  const aus=angeboteFuerWoche(w);
  if(aus.length) return aus;
  /* Kein Prospekt für diese Woche: nichts hervorheben, statt Falsches zu zeigen */
  return [];
}
const angebotBis=()=>{const l=angeboteListe();return l.length?l[l.length-1].bis:"";};
const zeitraumText=p=>{
  const f=d=>d?new Date(d).toLocaleDateString("de-DE",{day:"numeric",month:"numeric"}):"";
  return p.von&&p.bis?f(p.von)+" bis "+f(p.bis):(p.bis?"bis "+f(p.bis):"ohne Zeitraum");
};
const wocheHatAngebote=w=>angeboteFuerWoche(w).length>0;

/* Produktnamen bei Aldi tragen Marken und Größen mit sich. Deshalb wird
   wortweise verglichen: "Meine Metzgerei Puten-Geschnetzeltes" trifft "Putenschnitzel". */
/* Vier Buchstaben genügen, sonst fielen Feta, Reis und Eier durchs Raster.
   Damit dabei keine Markennamen treffen, ist die Sperrliste entsprechend länger. */
/* ---------- Bio ----------
   Wir kaufen möglichst Bio. Steht ein Angebot in Bio da, ist das die Nachricht –
   deshalb bekommt es überall eine eigene Kennzeichnung, nicht nur die übliche
   Angebotspille. Erkannt wird am Wortanfang: „Biomilch" und „Bio-Möhren" zählen,
   „Biskuit" nicht, weil dort kein Wort mit „bio" beginnt. */
const BIO=/(^|[^a-zäöüß])(bio|öko|oeko)|demeter|naturland/i;
const istBio=t=>BIO.test(String(t||""));
/* Alle Bio-Posten des Prospekts einer Woche */
const bioAngebote=(w)=>angeboteAktiv(w).filter(istBio);

const ANG_STOPP=new Set(["meine","aldi","aktion","gramm","packung","frisch","deutscher","deutsche","marken",
 "artikel","produkt","stueck","sorten","verschiedene","classic","original","family","gutbio","bio","tiefgekuehlt",
 "gekuehlt","angebot","kracher","aktionspreis","preis","stueckpreis","ursprung","klasse","preise",
 "gold","neue","gute","fein","feine","natur","haus","land","alpen","best","beste","extra","pack","stk",
 "gross","klein","mini","maxi","hell","dunkel","zart","mild","edel","pure","plus","auch","ohne","voll"]);
/* Im Prospekt steht „frische Möhren“, in der Sperrliste steht „frisch“. Jede
   Beugungsform von Hand nachzupflegen geht auf Dauer schief – deshalb wird die
   Adjektivendung vor dem Vergleich abgeschnitten. */
const angebotStamm=w=>w.replace(/(e|em|en|er|es)$/,"");
function angebotWorte(o){
  return slug(o).split("_").filter(t=>t.length>=4&&!ANG_STOPP.has(t)&&!ANG_STOPP.has(angebotStamm(t)));
}
/* Nur eine Richtung: die Zutat darf das Angebotswort enthalten, nicht umgekehrt.
   Sonst trifft "Gartenschlauch" die Zutat "Lauch". Dazu ein Wortstamm-Vergleich
   ab sechs Buchstaben, damit "Hähnchenbrustfilet" auch "Hähnchenschenkel" findet. */
const angebotPasst=(w,z)=>z.includes(w)||(w.length>=6&&z.length>=6&&w.slice(0,6)===z.slice(0,6));
function zutatImAngebot(name,w){
  const off=angeboteAktiv(w); if(!off.length) return "";
  const a=slug(name); if(a.length<4) return "";
  const teile=new Set([a]); a.split("_").forEach(t=>{if(t.length>=4)teile.add(t);});
  for(const o of off){
    const worte=angebotWorte(o);
    if(worte.some(x=>[...teile].some(z=>angebotPasst(x,z)))) return o;
  }
  return "";
}
function imAngebot(r,w){
  const off=angeboteAktiv(w); if(!off.length||!r) return [];
  const zut=new Set();
  r.z.forEach(z=>{const a=slug(z[0]);if(a.length>=4)zut.add(a);a.split("_").forEach(t=>{if(t.length>=4)zut.add(t);});});
  const treffer=[];
  off.forEach(o=>{
    const worte=angebotWorte(o); if(!worte.length) return;
    if(worte.some(x=>[...zut].some(z=>angebotPasst(x,z)))) treffer.push(o);
  });
  return [...new Set(treffer)];
}
function angebotWeg(id){ mut("angebote/"+id,null); }
function abgelaufeneWeg(){
  const h=isoHeute();
  const alt=angeboteListe().filter(p=>p.bis&&p.bis<h);

function angeboteZerlegen(roh){

  return String(roh||"")

/* Bildschirm wachhalten – beim Einkaufen und beim Kochen der größte Gewinn.
   Nicht jedes Gerät kann das, deshalb still scheitern. */
let wachSchloss=null, wachAn=false;
async function wachHalten(an){
  wachAn=an;

/* ===== Prospekt als PDF einlesen ===== */
const PDFJS_URL="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let pdfLaden=null;

function pdfBibliothek(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfLaden) return pdfLaden;
  pdfLaden=new Promise((ok,fehler)=>{
    const s=document.createElement("script");
    s.src=PDFJS_URL;
    s.onload=()=>{
      if(!window.pdfjsLib){ fehler(new Error("nicht geladen")); return; }
      /* Ein Arbeiter von fremder Herkunft wird vom Browser abgelehnt. Der Umweg über
         eine kleine lokale Datei, die den fremden Code nachlädt, ist erlaubt. */
      try{
        const brueckenCode='importScripts("'+PDFJS_WORKER+'");';
        window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([brueckenCode],{type:"application/javascript"}));
      }catch(e){ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; }
      ok(window.pdfjsLib);
    };
    s.onerror=()=>fehler(new Error("nicht erreichbar"));
    document.head.appendChild(s);
  });
  return pdfLaden;
}

/* Zeilen aus den Textbausteinen einer Seite bilden – pdf.js liefert Schnipsel mit Koordinaten */
function pdfZeilen(inhalt){
  const zeilen=new Map();
  inhalt.items.forEach(i=>{
    const y=Math.round((i.transform&&i.transform[5])||0);
    const schluessel=Math.round(y/4);
    if(!zeilen.has(schluessel)) zeilen.set(schluessel,[]);
    zeilen.get(schluessel).push({x:(i.transform&&i.transform[4])||0,t:i.str});
  });
  return [...zeilen.entries()].sort((a,b)=>b[0]-a[0])
    .map(([,teile])=>teile.sort((a,b)=>a.x-b.x).map(t=>t.t).join(" ").replace(/\s+/g," ").trim())
    .filter(Boolean);
}
/* Werbezeilen, Preise und Datumsangaben aussortieren */
const PROSPEKT_RAUS=/^(bis zu|sparen|aktion|tiefpreis|deine|marken|zum|aldi preis|jederzeit|neu|nur|solange|angebot|im innenteil|mo\.|di\.|mi\.|do\.|fr\.|sa\.|so\.|ab |gültig|zzgl|versch|je |kg-preis|l-preis|stück-preis|preis je|www|seite|\*)/i;
function prospektZeilen(zeilen){
  const raus=[];
  zeilen.forEach(z0=>{
    const z=z0.replace(/\s{2,}/g," ").trim().replace(/^[*\s]+|[*\s]+$/g,"");
    if(z.length<4||z.length>52) return;
    if(!/[A-Za-zÄÖÜäöüß]{3}/.test(z)) return;
    if(/^[\d.,%\-–\s€*]+$/.test(z)) return;
    if(PROSPEKT_RAUS.test(z)) return;
    if(/\d{1,2}\.\d{1,2}\./.test(z)) return;
    if(z===z.toUpperCase()&&z.split(" ").length>4) return;
    if(!raus.includes(z)) raus.push(z);
  });
  return raus;
}

function prospektWaehlen(){ const f=document.getElementById("pdfwahl"); if(f&&f.click){f.value="";f.click();} }

/* "Gültig von Mo. 10.8. – Sa. 15.8." → Anfang und Ende */
function prospektSpanne(text){
  const m=text.match(/Gültig\s+von[^0-9]{0,12}(\d{1,2})\.(\d{1,2})\.?\s*[–-]\s*[^0-9]{0,12}(\d{1,2})\.(\d{1,2})\.?/i)
       || text.match(/(\d{1,2})\.(\d{1,2})\.\s*[–-]\s*(\d{1,2})\.(\d{1,2})\./);
  if(!m) return {von:"",bis:""};
  return {von:datumBauen(+m[1],+m[2]), bis:datumBauen(+m[3],+m[4])};
}
/* Prospekte nennen nur Tag und Monat – das Jahr wird aus der Nähe zu heute erschlossen */
function datumBauen(tag,monat){
  if(!tag||!monat||monat>12||tag>31) return "";
  const heute=new Date(); heute.setHours(12,0,0,0);
  let best="", abstand=1e15;
  [-1,0,1].forEach(v=>{
    const d=new Date(heute.getFullYear()+v,monat-1,tag,12);
    const a=Math.abs(d-heute);
    if(a<abstand){abstand=a;best=isoTag(d);}
  });
  return best;
}

async function prospektLesen(dateien){
  /* Robust gegen beides: FileList oder eine einzelne Datei */
  const roh=!dateien?[]:(dateien.length!==undefined&&typeof dateien!=="string"?[...dateien]:[dateien]);
  const liste=roh.filter(f=>/\.pdf$/i.test(f.name)||f.type==="application/pdf");
  const stand=document.getElementById("pdfstand");
  const melde=t=>{ if(stand)stand.textContent=t; };
  if(!liste.length){ melde("Darunter war keine PDF-Datei."); return; }
  melde("Programmteil zum Lesen von PDFs wird geladen …");
  let pdfjs;
  try{ pdfjs=await pdfBibliothek(); }
  catch(e){ melde("Der PDF-Leser ließ sich nicht laden ("+((e&&e.message)||"unbekannt")+"). Dafür braucht es einmalig eine Internetverbindung."); return; }

  const bericht=[];
  for(let n=0;n<liste.length;n++){
    const datei=liste[n];
    try{
      const puffer=await datei.arrayBuffer();
      /* Auf dem Handy ist Arbeitsspeicher knapp: Schriften und Bilder werden nicht gebraucht */
      const dok=await pdfjs.getDocument({data:new Uint8Array(puffer),disableFontFace:true,
        isEvalSupported:false,useSystemFonts:false}).promise;
      let zeilen=[], roh="";
      for(let s=1;s<=dok.numPages;s++){
        melde("Datei "+(n+1)+" von "+liste.length+", Seite "+s+" von "+dok.numPages+" …");
        const inhalt=await (await dok.getPage(s)).getTextContent();
        const z=pdfZeilen(inhalt);
        roh+=z.join("\n")+"\n"; zeilen=zeilen.concat(z);
      }
      const produkte=prospektZeilen(zeilen);
      const {von,bis}=prospektSpanne(roh);
      if(!produkte.length){ bericht.push(datei.name+": nichts gefunden"); continue; }
      const id="p"+(bis||von||("x"+n));
      mut("angebote/"+id,{von,bis,items:produkte,quelle:datei.name.slice(0,60),geholt:Date.now()},false);
      bericht.push((von&&bis?new Date(von).toLocaleDateString("de-DE")+"–"+new Date(bis).toLocaleDateString("de-DE"):"ohne Zeitraum")+": "+produkte.length+" Einträge");
    }catch(e){ bericht.push(datei.name.slice(0,28)+": nicht lesbar ("+((e&&e.message)||"unbekannt").slice(0,60)+")"); }
  }
  melde(bericht.join(" · "));
  render();
  setTimeout(()=>{ closeSheet(); hinweisProspekt(bericht); },400);
}
