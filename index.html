<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1214" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Marco's brain</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* Schriften liegen im Ordner „fonts" und werden mit ausgeliefert – so sieht die
   App auf jedem Gerät gleich aus und funktioniert ohne Netz. Beide stehen unter
   der SIL Open Font License 1.1, siehe fonts/LIZENZ.txt */
@font-face{font-family:"Inter";font-style:normal;font-weight:400 700;font-display:swap;
  src:url("fonts/inter-latin.woff2") format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:"Inter";font-style:normal;font-weight:400 700;font-display:swap;
  src:url("fonts/inter-latin-ext.woff2") format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
@font-face{font-family:"Instrument Serif";font-style:normal;font-weight:400;font-display:swap;
  src:url("fonts/instrumentserif-latin.woff2") format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:"Instrument Serif";font-style:normal;font-weight:400;font-display:swap;
  src:url("fonts/instrumentserif-latin-ext.woff2") format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}

/* Schiefer und Petrol: kühle, ruhige Fläche, genau ein Akzent.
   Farbe trägt hier Bedeutung – Petrol ist bedienbar, Moos ist erledigt,
   Bernstein wartet, Ziegel ist endgültig. Alles andere bleibt neutral. */
:root{
  --paper:#F4F6F7; --card:#FFFFFF; --card-2:#EDF1F2; --karte-hoch:#FFFFFF;
  --ink:#14181B; --ink-2:#4C555B; --ink-3:#79848A;
  --line:#E3E7E9; --line-2:#CFD6D9;
  --akz:#0E6E68; --akz-bg:#E1F0EE; --akz-hell:#3E9B93; --auf-akz:#FFFFFF;
  --gold:#A0640B; --gold-bg:#FAEEDB;
  --erf:#2C7A4C; --erf-bg:#E2F0E7;
  --rot:#B3382C; --rot-bg:#FAE8E5;
  --schatten:0 1px 2px rgba(16,26,30,.05);
  --schatten-hoch:0 10px 30px rgba(16,26,30,.14);
  --r:16px; --r-s:12px; --r-xs:9px;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --serif:"Instrument Serif","Iowan Old Style",Palatino,Georgia,serif;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0E1214; --card:#171C1F; --card-2:#1F262A; --karte-hoch:#1C2226;
  --ink:#E9EDEE; --ink-2:#A3AEB3; --ink-3:#77848A;
  --line:#252D31; --line-2:#364247;
  --akz:#4FC7BC; --akz-bg:#12302E; --akz-hell:#6FD8CE; --auf-akz:#04211F;
  --gold:#E0A54E; --gold-bg:#32250F;
  --erf:#5CBE85; --erf-bg:#12291C;
  --rot:#E4857A; --rot-bg:#331B18;
  --schatten:0 1px 2px rgba(0,0,0,.4);
  --schatten-hoch:0 12px 34px rgba(0,0,0,.55);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-optical-sizing:auto;
  overscroll-behavior-y:none;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
#app{max-width:600px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.014em}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Zahlen sollen in Spalten stehen, nicht wackeln */
.zahl,.anz,.mini,.sync,.badge,.bogen-kopf span,.tagblock-h span{font-variant-numeric:tabular-nums}

header{padding:22px 0 10px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--akz);margin-bottom:3px}
header h1{font-family:var(--serif);font-size:34px;font-weight:400;letter-spacing:-.012em;line-height:1.08}
.hd-zeile{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sync{font-size:11px;font-weight:500;color:var(--ink-3);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 9px}
.sync i{width:7px;height:7px;border-radius:99px;background:var(--ink-3)}
.sync.on i{background:var(--erf)} .sync.off i{background:var(--gold)}

/* Tagesbogen: der Fortschritt des Tages als durchgehende Linie */
.bogen{margin:14px 0 4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--schatten)}
.bogen-kopf{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px}
.bogen-kopf b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.bogen-kopf span{font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.balken{height:6px;border-radius:99px;background:var(--card-2);overflow:hidden;display:flex}
.balken i{display:block;height:100%;background:var(--erf);border-radius:99px;transition:width .45s cubic-bezier(.3,1.2,.5,1)}
.bogen.voll{border-color:color-mix(in srgb,var(--erf) 40%,var(--line));background:var(--erf-bg)}
.bogen.voll .bogen-kopf b{color:var(--erf)}

.sect{margin:24px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sect h2{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.sect .zahl{font-size:11.5px;color:var(--ink-3);font-weight:500}

/* Aufgabenzeile */
.auf{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);
  padding:12px 13px;margin-bottom:7px;box-shadow:var(--schatten);transition:border-color .15s,background .15s}
.auf.fertig{background:transparent;border-color:transparent;box-shadow:none;padding-top:7px;padding-bottom:7px}
.auf.ueber{border-left:3px solid var(--rot)}
.hak{width:26px;height:26px;flex:none;border-radius:50%;border:1.8px solid var(--line-2);background:transparent;display:grid;place-items:center;padding:0;position:relative;transition:background .18s,border-color .18s}
/* Der Kreis bleibt klein, die Trefferfläche wächst auf gut 44px – sonst trifft man ihn unterwegs nicht */
.hak::before{content:"";position:absolute;inset:-9px;border-radius:50%}
.hak svg{width:15px;height:15px;stroke:var(--card);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:22;stroke-dashoffset:22}
.auf.fertig .hak{background:var(--erf);border-color:var(--erf)}
.auf.fertig .hak svg{stroke-dashoffset:0;transition:stroke-dashoffset .28s ease .06s}
.auf-txt{flex:1;min-width:0;font-size:15.5px;line-height:1.38;letter-spacing:-.006em;word-break:break-word}
.auf.fertig .auf-txt{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.auf-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px}
.auf-akt{display:flex;align-items:center;gap:2px;flex:none;align-self:center}
.auf-akt button{border:0;background:transparent;color:var(--ink-3);padding:11px 8px;line-height:1;display:grid;place-items:center;min-height:44px}
.auf-akt svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.auf-akt button.weg:active{color:var(--rot)}
.auf-notiz{margin-top:5px;font-size:12.5px;color:var(--ink-3);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  border-left:2px solid var(--line-2);padding-left:8px}
.griff{flex:none;align-self:center;border:0;background:transparent;color:var(--ink-3);padding:8px 5px;touch-action:none;cursor:grab;display:grid;place-items:center;border-radius:8px}
.griff svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-linecap:round}
.griff:active{cursor:grabbing;background:var(--card-2);color:var(--akz)}
.punkt{width:8px;height:8px;border-radius:99px;flex:none;display:inline-block}
.mini{font-size:11.5px;color:var(--ink-3);font-weight:450}
.mini.spaet{color:var(--rot);font-weight:600}

@keyframes puls{0%{transform:scale(1);opacity:.55}70%{transform:scale(2.1);opacity:0}100%{opacity:0}}
@keyframes hupf{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.hak.feier{animation:hupf .34s ease}
.hak.feier::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--erf);animation:puls .55s ease-out}
@keyframes rein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.auf{animation:rein .18s ease}

/* Schnelleingabe */
.schnell{display:flex;gap:8px;margin-bottom:6px}
.schnell input{flex:1}
.filterzeile{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.filterknopf{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);
  border-radius:var(--r-s);padding:11px 13px;font-size:14.5px;text-align:left;min-width:0;box-shadow:var(--schatten)}
.filterknopf b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filterknopf .pfeil{margin-left:auto;color:var(--ink-3);font-size:12px}
.filterknopf .anz{font-size:11.5px;color:var(--ink-3)}
.wahlzeile{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;
  border:0;border-bottom:1px solid var(--line);padding:13px 4px;font-size:15.5px}
.wahlzeile:last-child{border-bottom:0}
.wahlzeile[aria-pressed="true"]{color:var(--akz);font-weight:600}
.wahlzeile .anz{margin-left:auto;font-size:12px;color:var(--ink-3)}
.gruppe{font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  margin:20px 0 9px;display:flex;align-items:center;gap:10px}
.gruppe::after{content:"";flex:1;height:1px;background:var(--line)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line-2);background:var(--card);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:500;
  white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .14s,color .14s,border-color .14s}
.chip[aria-pressed="true"]{background:var(--akz);color:var(--auf-akz);border-color:var(--akz)}
.chip[aria-pressed="true"] .punkt{box-shadow:0 0 0 1.5px var(--auf-akz)}

.btn{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-s);padding:11px 14px;font-weight:550;
  letter-spacing:-.005em;transition:transform .1s,background .14s,border-color .14s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--akz);border-color:var(--akz);color:var(--auf-akz);box-shadow:0 1px 2px color-mix(in srgb,var(--akz) 30%,transparent)}
.btn-wide{width:100%;display:block;text-align:center;padding:14px;font-size:16px}
.btn-s{padding:7px 11px;font-size:14px;border-radius:8px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-3)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
/* Aktionsleiste in Blättern: Symbol plus Wort, damit die Knöpfe unterscheidbar sind */
.aktionen{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px;margin-top:14px}
.aktionen button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  min-height:60px;padding:9px 4px;border:1px solid var(--line-2);border-radius:12px;background:var(--card);
  color:var(--ink-2);font-size:12px;line-height:1.15;text-align:center}
.aktionen button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.aktionen button:active{transform:scale(.97)}
.aktionen .ak-akz{color:var(--akz);border-color:color-mix(in srgb,var(--akz) 32%,var(--line-2))}
.aktionen .ak-gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 32%,var(--line-2))}
.aktionen .ak-rot{color:var(--rot);border-color:color-mix(in srgb,var(--rot) 32%,var(--line-2))}
.aktionen .ak-an{background:color-mix(in srgb,var(--akz) 12%,var(--card));color:var(--akz);border-color:var(--akz)}
.fertig-knopf{margin-top:14px}
.btn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* ---------- Ziehen und Ablegen ----------
   Die gezogene Zeile hebt ab, die anderen weichen aus. Beides läuft über
   transform, damit nichts umbricht und der Finger nicht springt. */
.dnd-laeuft{cursor:grabbing;-webkit-user-select:none;user-select:none}
.dnd-weicht{transition:transform .16s cubic-bezier(.2,.8,.3,1)}
.zieht{pointer-events:none;position:relative;z-index:30;cursor:grabbing;
  box-shadow:var(--schatten-hoch);border-color:var(--akz)!important;
  background:var(--karte-hoch);border-radius:var(--r-s);
  transition:box-shadow .16s ease,transform 0s}
[data-drop].drop-an{outline:2px dashed var(--akz);outline-offset:3px;border-radius:var(--r-s);background:color-mix(in srgb,var(--akz) 8%,transparent)}
.morgenzone{min-height:52px;border:1px dashed var(--line-2);border-radius:var(--r-s);padding:6px;margin-bottom:10px;transition:border-color .15s,background .15s}
.morgenzone .leer{padding:12px 8px;text-align:center}
.notizspur{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.nspur{flex:0 0 auto;width:170px;text-align:left;background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--line-2);border-radius:var(--r-s);padding:11px 12px;min-height:64px;box-shadow:var(--schatten)}
.nspur b{display:block;font-size:14px;font-weight:600;margin-bottom:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nspur span{font-size:12px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:550;letter-spacing:.01em;padding:3px 9px;border-radius:7px;background:var(--card-2);color:var(--ink-2);white-space:nowrap}
.tag-akz{background:var(--akz-bg);color:var(--akz)}
.tag-gold{background:var(--gold-bg);color:var(--gold)}
.tag-erf{background:var(--erf-bg);color:var(--erf)}

/* Wochenspalten */
.tagblock{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;overflow:hidden;box-shadow:var(--schatten)}
.tagblock.heute{border-color:var(--akz)}
.tagblock-h{display:flex;align-items:baseline;justify-content:space-between;padding:11px 14px;background:var(--card-2)}
.tagblock.heute .tagblock-h{background:var(--akz-bg)}
.tagblock-h b{font-size:14.5px;font-weight:600}
.tagblock.heute .tagblock-h b{color:var(--akz)}
.tagblock-h span{font-size:10.5px;font-weight:500;color:var(--ink-3);letter-spacing:.06em}
.tagblock .auf{border:0;border-radius:0;margin:0;border-top:1px solid var(--line);background:transparent}
.tagblock .leer{padding:11px 13px;font-size:13.5px;color:var(--ink-3);border-top:1px solid var(--line)}

/* Notizen */
.notizreihe{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);
  border-left-width:4px;border-radius:var(--r);margin-bottom:8px;overflow:hidden;box-shadow:var(--schatten)}
.notiz{background:transparent;border:0;padding:13px 14px;flex:1;min-width:0;text-align:left;display:block}
.notiz-akt{display:flex;flex-direction:column;justify-content:center;gap:2px;padding-right:6px}
.notiz-akt button{border:0;background:transparent;color:var(--ink-3);padding:10px 8px;display:grid;place-items:center;min-height:40px}
.notiz-akt svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.notiz b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.008em;line-height:1.3;margin-bottom:4px}
.notiz p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notiz .nm{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.notiz mark{background:var(--gold-bg);color:var(--gold);padding:0 2px;border-radius:3px}
.werkzeug{display:flex;gap:4px;flex-wrap:wrap;padding:8px 0;position:sticky;top:0;background:var(--paper);z-index:2;border-bottom:1px solid var(--line)}
.werkzeug button{border:1px solid var(--line-2);background:var(--card);border-radius:8px;min-width:38px;height:36px;padding:0 9px;font-size:14px;font-weight:500}
.werkzeug button b{font-weight:700}
.werkzeug button s{text-decoration:line-through}
.editor{min-height:46vh;padding:14px 2px;font-size:16.5px;line-height:1.65;outline:none;
  font-family:var(--sans);letter-spacing:-.006em;color:var(--ink)}
.editor p{margin:0 0 10px}
.editor:empty::before{content:attr(data-leer);color:var(--ink-3)}
.editor h3{font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--ink);margin:24px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.editor h3:first-child{margin-top:4px}
.editor b,.editor strong{font-weight:650}
.editor ul,.editor ol{padding-left:22px;margin:8px 0}
.editor li{margin:3px 0}
.editor img{max-width:100%;border-radius:10px;margin:10px 0;display:block}
.editor hr{border:0;border-top:1px solid var(--line-2);margin:18px 0}
.editor a{color:var(--akz)}

nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:transparent;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:10.5px;font-weight:500;letter-spacing:.01em}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--akz);font-weight:600}
.badge{position:absolute;transform:translate(15px,-11px);background:var(--akz);color:var(--auf-akz);font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}

.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:rein .16s ease}

  border:1px solid var(--line);padding:18px 16px 20px;box-shadow:var(--schatten-hoch)}
@media (max-height:560px){.sheet{align-items:flex-end;padding:0}.sheet-in{max-height:96vh;border-radius:20px 20px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line-2);margin:0 auto 14px}
.sheet-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}

.hinweis{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:var(--r-s);
  padding:12px 14px;margin-bottom:12px;font-size:14px;box-shadow:var(--schatten);animation:rein .2s ease}
.hinweis span{flex:1}

.leerzustand{text-align:center;padding:40px 20px;color:var(--ink-3)}
.leerzustand b{display:block;font-family:var(--serif);font-weight:400;color:var(--ink);font-size:22px;margin-bottom:6px}
.note{font-size:13px;color:var(--ink-3);line-height:1.55}
input[type=text],input[type=search],input[type=url],input[type=date],select,textarea{
  font-family:inherit;font-size:16px;width:100%;padding:12px 13px;border:1px solid var(--line-2);
  border-radius:var(--r-s);background:var(--card);color:var(--ink);transition:border-color .14s,box-shadow .14s}
input[type=text]:focus,input[type=search]:focus,input[type=url]:focus,textarea:focus{
  border-color:var(--akz);box-shadow:0 0 0 3px color-mix(in srgb,var(--akz) 14%,transparent);outline:none}
label.fl{display:block;font-size:12.5px;color:var(--ink-2);margin:14px 0 5px;font-weight:600;letter-spacing:.01em}
.liste-zeile{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 13px;margin-bottom:7px;box-shadow:var(--schatten)}
.liste-zeile b{font-size:15px;font-weight:600}
pre{font-family:var(--mono);font-size:12px;background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-s);padding:11px;overflow-x:auto;line-height:1.5}

input:focus-visible,button:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--akz);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Zeilenknöpfe: der kurze Weg in den Tag, ohne die Zeile zu überladen */

  width:54px;height:54px;border-radius:18px;border:0;background:var(--akz);color:var(--auf-akz);
  font-size:26px;font-weight:400;line-height:1;display:grid;place-items:center;z-index:41;
  box-shadow:0 6px 20px color-mix(in srgb,var(--akz) 40%,transparent),0 2px 6px rgba(16,26,30,.18)}

/* Wochentopf und Rückblick */

  border-radius:var(--r-s);padding:11px 13px;margin-bottom:7px;font-size:14.5px}

  text-transform:uppercase;color:var(--ink-3)}

<body>
<div id="app">
  <header>
    <div class="hd-zeile">
      <div><div class="eyebrow" id="eyebrow">Heute</div><h1 id="titel">Marco's brain</h1></div>
      <div id="hdside"></div>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav id="nav"></nav>
<div id="sheet"></div>
<button class="daumen" id="daumen" onclick="daumenKnopf()" aria-label="Neu eintragen">+</button>
<input type="file" id="bildwahl" accept="image/*" style="display:none">
<input type="file" id="keepwahl" accept=".json,.html,application/json,text/html" multiple style="display:none">
<script>
/* ===== Marco's brain: Aufgaben und Notizen ===== */
const KEY="tagwerk.v1";
const APP_NAME="Marco's brain";
const VERSION="2.1";
const TAG_MS=86400000;
const TAGE=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const TAGE_K=["Mo","Di","Mi","Do","Fr","Sa","So"];
const MONATE=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
/* Listenfarben aus derselben Familie wie das übrige Bild: gedeckt, gleich hell,
   damit acht Punkte nebeneinander nicht schreien. */
const FARBEN=["#0E6E68","#2C6E9B","#5A57A8","#8A4C74","#A0640B","#2C7A4C","#B3382C","#5B6770"];
/* Wer die App vor der Auffrischung genutzt hat, hat noch die alten Vorgabefarben
   in den Listen stehen. Genau diese – und nur diese – werden einmalig ersetzt. */
const FARBEN_ALT={"#4A2D6E":"#0E6E68","#136B54":"#2C7A4C","#9A6512":"#A0640B","#9B3327":"#B3382C",
  "#2A6478":"#2C6E9B","#7A3B62":"#8A4C74","#4C6B18":"#5A57A8","#5C5850":"#5B6770"};

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* Der Zähler macht die Kennung auch dann eindeutig, wenn hunderte Einträge in
   derselben Millisekunde entstehen – beim Import aus Google Notizen ist genau
   das der Fall, und zwei gleiche Kennungen hätten eine Notiz überschrieben. */
let idZaehler=0;
const id6=()=>Date.now().toString(36)+(idZaehler++).toString(36)+Math.random().toString(36).slice(2,5);
/* Streng aufsteigend, ohne Ausnahme. Ein Zähler modulo 100 sprang beim Überlauf
   zurück – die eigene Reihenfolge war danach durcheinander. */
let posLetzte=0;
function naechstePos(){
  const p=Math.max(Date.now()*100,posLetzte+1);
  posLetzte=p;
  return p;
}
/* normText für Suche über ganze Texte, slug für kurze Schlüssel */
const normText=s=>String(s==null?"":s).toLowerCase()
  .replace(/[äÄ]/g,"ae").replace(/[öÖ]/g,"oe").replace(/[üÜ]/g,"ue").replace(/ß/g,"ss")
  .replace(/[^a-z0-9]+/g,"_");
const slug=s=>normText(s).replace(/^_|_$/g,"").slice(0,60);

/* ---------- Datum ---------- */
const iso=d=>{const x=new Date(d);x.setHours(12,0,0,0);return x.toISOString().slice(0,10);};
const heute=()=>iso(new Date());
const morgen=()=>iso(new Date(Date.now()+TAG_MS));
const ausIso=s=>{const [j,m,t]=s.split("-").map(Number);return new Date(j,m-1,t,12);};
const wochentag=s=>(ausIso(s).getDay()+6)%7;
function wochenStart(versatz=0){
  const d=new Date(); d.setHours(12,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7)+versatz*7);
  return d;
}
const wochenTage=(versatz=0)=>{const a=wochenStart(versatz);return [...Array(7)].map((_,i)=>iso(new Date(a.getTime()+i*TAG_MS)));};
function kw(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const j=new Date(Date.UTC(t.getUTCFullYear(),0,1));return "KW "+Math.ceil(((t-j)/86400000+1)/7);}
function datumText(s){
  if(s===heute())return "Heute";
  if(s===morgen())return "Morgen";
  if(s===iso(new Date(Date.now()-TAG_MS)))return "Gestern";
  const d=ausIso(s), diff=Math.round((d-ausIso(heute()))/TAG_MS);
  if(diff>0&&diff<7)return TAGE[wochentag(s)];
  return TAGE_K[wochentag(s)]+", "+d.getDate()+". "+MONATE[d.getMonth()].slice(0,3);
}
const istHeuteFertig=a=>a.fertig&&iso(new Date(a.fertig))===heute();

/* ---------- Zustand ---------- */
const STARTKAT=()=>({
  k_all:{n:"Allgemein",f:"#5B6770",art:"beides",pos:0},
  k_geb:{n:"Geburt",f:"#8A4C74",art:"beides",pos:1},
  k_arb:{n:"Arbeit",f:"#2C6E9B",art:"beides",pos:2},
  k_idee:{n:"Ideen",f:"#A0640B",art:"beides",pos:3}
});
const leer=()=>({aufgaben:{},notizen:{},kategorien:STARTKAT(),einst:{},tot:{},version:VERSION});
let S=leer();
let cfg={db:"",hid:"",name:""};
let tab="heute", es=null, syncState="lokal", queue=[];
const SYNCTEXT={lokal:"nur auf diesem Gerät",verbindet:"verbindet …",live:"live verbunden",wartet:"wartet auf Verbindung",getrennt:"getrennt, versucht erneut",verweigert:"Zugriff verweigert",fehlt:"Datenbank nicht gefunden"};
const SYNC_FEHLER={
  verweigert:"Die Datenbank verweigert den Zugriff. Prüft die Sicherheitsregeln in Firebase und ob der Code mindestens 20 Zeichen hat.",
  fehlt:"Unter dieser Datenbank-URL antwortet niemand. Prüft die URL aus der Firebase-Konsole."};
let katFilter="alle", notizSuche="", notizFilter="aktiv", wochenVersatz=0, offenAuf=null;
let sortAn=false, aufSuche="", hinweisDaten=null, hinweisTimer=null, wocheFertig=true;
const WDH={taeglich:"Täglich",zweitaeglich:"Alle 2 Tage",woechentlich:"Wöchentlich",monatlich:"Monatlich"};
/* Bei „wöchentlich" darf der Wochentag festliegen, statt sich aus dem Abhaktag zu ergeben. */
const WDH_SCHRITT={taeglich:1,zweitaeglich:2,woechentlich:7};
/* Ab so vielen Tagen ohne Termin meldet sich eine gesammelte Aufgabe leise */
const LIEGT_AB=14;

/* Kurze Rückmeldung mit optionaler Rücknahme, statt Bestätigungsdialoge */
function hinweis(text,aktionText,aktion){
  clearTimeout(hinweisTimer);
  hinweisDaten={text,aktionText,aktion};
  hinweisTimer=setTimeout(()=>{hinweisDaten=null;render();},7000);
  render();
}
function hinweisLeiste(){
  if(!hinweisDaten) return "";
  return `<div class="hinweis"><span>${esc(hinweisDaten.text)}</span>
    ${hinweisDaten.aktionText?`<button onclick="hinweisAktion()">${esc(hinweisDaten.aktionText)}</button>`:""}
    <button onclick="hinweisWeg()" aria-label="Schließen">✕</button></div>`;
}
function hinweisAktion(){ const h=hinweisDaten; hinweisDaten=null; clearTimeout(hinweisTimer); if(h&&h.aktion)h.aktion(); else render(); }
function hinweisWeg(){ hinweisDaten=null; clearTimeout(hinweisTimer); render(); }

/* ---------- Speicher und Synchronisierung ---------- */
function lesenLokal(){
  try{const v=localStorage.getItem(KEY); if(v)S={...leer(),...JSON.parse(v)};}catch(e){}
  try{const c=localStorage.getItem(KEY+".cfg"); if(c)cfg={...cfg,...JSON.parse(c)};}catch(e){}
  try{const q=localStorage.getItem(KEY+".q"); if(q)queue=JSON.parse(q);}catch(e){}
  ["aufgaben","notizen","kategorien","einst","tot"].forEach(f=>{if(!S[f]||typeof S[f]!=="object")S[f]={};});
  if(!Object.keys(S.kategorien).length)S.kategorien=STARTKAT();
  farbenAuffrischen();
  totAufraeumen();
}
/* Beim Umstieg auf das neue Farbbild: Listen, die noch eine alte Vorgabefarbe
   tragen, bekommen deren Entsprechung. Selbst gewählte Farben bleiben, wie sie
   sind. Die Zuordnung ist in sich geschlossen – ein zweiter Durchlauf ändert
   nichts mehr –, deshalb darf sie auch nach jedem Abgleich wieder laufen. */
function farbenAuffrischen(){
  Object.entries(S.kategorien||{}).forEach(([id,k])=>{
    const neu=k&&FARBEN_ALT[String(k.f||"").toUpperCase()];
    if(neu) S.kategorien[id]={...k,f:neu};
  });
}
function schreibenLokal(){
  try{
    localStorage.setItem(KEY,JSON.stringify(S));
    localStorage.setItem(KEY+".cfg",JSON.stringify(cfg));
    localStorage.setItem(KEY+".q",JSON.stringify(queue));
  }catch(e){ if(String(e).match(/quota|Quota/)) alert("Der Speicher des Browsers ist voll. Meist liegt das an Bildern in Notizen – ältere Notizen archivieren und löschen schafft Platz."); }
}
const basis=()=>cfg.db&&cfg.hid?cfg.db.replace(/\/$/,"")+"/haushalte/"+cfg.hid:null;
function setPfad(o,pfad,daten){
  const p=pfad.split("/").filter(Boolean);
  if(!p.length){S=daten?{...leer(),...daten}:leer();return;}
  let z=o;
  for(let i=0;i<p.length-1;i++){if(typeof z[p[i]]!=="object"||z[p[i]]===null)z[p[i]]={};z=z[p[i]];}
  if(daten===null)delete z[p[p.length-1]]; else z[p[p.length-1]]=daten;
}
/* Wurzel und Unterpfad brauchen unterschiedliche Adressen */
const adresse=pfad=>{const b=basis();return pfad?b+"/"+pfad+".json":b+".json";};

/* Bei diesen beiden Zuständen hilft kein erneuter Versuch – weiterzusenden würde
   den Fehler nur verschleiern, statt ihn zu zeigen. */
const dauerfehler=()=>syncState==="verweigert"||syncState==="fehlt";
function zustandSetzen(neu){ if(syncState===neu)return; syncState=neu; nav(); }
/* Jede Änderung geht durch die Warteschlange. Dadurch bleibt die Reihenfolge
   erhalten, ein Abbruch mittendrin verliert nichts, und je Pfad wartet nur der
   jüngste Stand – sonst stauen sich beim Tippen hunderte überholte Fassungen. */
function einreihen(pfad,wert){
  if(!pfad){ queue=[{pfad:"",wert}]; return; }   /* Gesamtstand ersetzt alles Wartende */
  const i=queue.findIndex(q=>q.pfad===pfad);
  if(i>=0)queue.splice(i,1);
  queue.push({pfad,wert});
  if(queue.length>800)queue.splice(0,queue.length-800);
}
async function schicken(pfad,wert){
  const res=await fetch(adresse(pfad),{method:wert===null?"DELETE":"PUT",
    headers:{"Content-Type":"application/json"},body:wert===null?undefined:JSON.stringify(wert)});
  if(res.status===401||res.status===403){const e=new Error("verweigert");e.dauerhaft="verweigert";throw e;}
  if(res.status===404){const e=new Error("fehlt");e.dauerhaft="fehlt";throw e;}
  if(!res.ok) throw new Error("HTTP "+res.status);
  return true;
}
let flussLaeuft=false;
async function flush(){
  if(!basis()||flussLaeuft||!queue.length||dauerfehler()) return;
  flussLaeuft=true;
  try{
    while(queue.length){
      const eintrag=queue[0];
      try{
        await schicken(eintrag.pfad,eintrag.wert);
      }catch(e){
        if(e&&e.dauerhaft){ zustandSetzen(e.dauerhaft); break; }
        if(syncState==="live") zustandSetzen("wartet");
        break;                                   /* Eintrag bleibt vorn liegen */
      }
      queue.shift();                             /* erst nach bestätigtem Erfolg entfernen */
      schreibenLokal();
      if(syncState!=="live"&&syncState!=="verbindet") zustandSetzen("live");
    }
  } finally { flussLaeuft=false; schreibenLokal(); nav(); }
}
function senden(pfad,wert){
  if(!basis()) return false;
  einreihen(pfad,wert); schreibenLokal(); flush();
  return true;
}
/* ---------- Grabsteine: gelöscht bleibt gelöscht ----------
   Eine Löschung ist auf beiden Geräten nur eine Abwesenheit. Beim
   Zusammenführen gewinnt aber jeder Eintrag, den es irgendwo noch gibt – eine
   Abwesenheit kann gegen ihn nichts ausrichten. Genau daran ist eine gelöschte
   Notiz vom anderen Gerät zurückgekommen. Deshalb hinterlässt jedes Löschen
   jetzt eine Notiz über sich selbst: Kennung und Zeitpunkt. Wer den Eintrag
   später wieder sieht, weiß, dass er älter ist als seine Löschung, und lässt
   ihn liegen. Wird derselbe Eintrag danach wirklich wieder angelegt – etwa über
   „Rückgängig" –, trägt er einen neueren Stempel und der Grabstein fällt. */
const TOT_HALTEN=90*TAG_MS;
const EINTRAGSPFAD=/^(aufgaben|notizen|kategorien)\/([^/]+)$/;
const totSchluessel=pfad=>pfad.replace("/",":");
const totZeit=pfad=>+(S.tot||{})[totSchluessel(pfad)]||0;
/* Gilt der Eintrag als gelöscht? Nur wenn es überhaupt einen Grabstein gibt –
   Einträge aus alten Fassungen tragen gar keinen Zeitstempel, und ohne diese
   Bedingung wäre jeder von ihnen gelöscht. Die Löschung muss außerdem echt
   jünger sein als die letzte Änderung: bei Gleichstand – zwei Vorgänge in
   derselben Millisekunde – bleibt der Eintrag. Etwas fälschlich zu behalten ist
   der harmlosere der beiden Irrtümer. */
const istTot=(pfad,eintrag)=>{const t=totZeit(pfad); return t>0&&t>stempel(eintrag);};
function grabstein(pfad,wert,verschicken=true){
  const m=EINTRAGSPFAD.exec(pfad); if(!m) return;
  const k=totSchluessel(pfad);
  if(!S.tot||typeof S.tot!=="object") S.tot={};
  if(wert===null){
    const t=Date.now(); S.tot[k]=t;
    if(verschicken) senden("tot/"+k,t);
  } else if(S.tot[k]!=null){
    delete S.tot[k];
    if(verschicken) senden("tot/"+k,null);
  }
}
/* Nach drei Monaten hat jedes Gerät die Löschung gesehen – dann darf der
   Grabstein selbst verschwinden, sonst wächst er ewig mit. */
function totAufraeumen(){
  const grenze=Date.now()-TOT_HALTEN;
  Object.entries(S.tot||{}).forEach(([k,t])=>{
    if(+t<grenze){ delete S.tot[k]; if(basis()) senden("tot/"+k,null); }
  });
}
function mut(pfad,wert,neuZeichnen=true){
  setPfad(S,pfad,wert); grabstein(pfad,wert); schreibenLokal(); senden(pfad,wert);
  if(neuZeichnen) render();
}
/* Jede Änderung an einem Eintrag muss einen Zeitstempel mitführen: beim
   Zusammenführen entscheidet er, welche Fassung gewinnt. Ohne ihn machte ein
   Gerät mit altem Stand das Abhaken, Anheften oder Verschieben wieder rückgängig,
   weil die alte Fassung durch ihr „fertig" den jüngeren Stempel trug.
   `ts` ist reiner Abgleichsstempel – `geaendert` bleibt dem Inhalt vorbehalten,
   damit die Sortierung „zuletzt geändert" weiter stimmt. */
function eintragAendern(feld,id,felder,neuZeichnen=true){
  const alt=(S[feld]||{})[id]; if(!alt) return;
  mut(feld+"/"+id,{...alt,...felder,ts:Date.now()},neuZeichnen);
}
const aufAendern=(id,felder,neuZeichnen=true)=>eintragAendern("aufgaben",id,felder,neuZeichnen);
const notizAendern=(id,felder,neuZeichnen=true)=>eintragAendern("notizen",id,felder,neuZeichnen);

/* ---------- Zusammenführen statt Überschreiben ----------
   Beim Verbinden treffen zwei Stände aufeinander. Pro Eintrag gewinnt der
   jüngere Zeitstempel, Einträge die es nur auf einer Seite gibt bleiben erhalten. */
/* Der jüngste aller Zeitstempel zählt – nicht der erstbeste. Sonst gewinnt eine
   Fassung mit altem „fertig" gegen eine neuere ohne. `pos` trägt den Zeitpunkt
   mal hundert in sich und wird dafür zurückgerechnet. */
const stempel=v=>{
  if(!v||typeof v!=="object") return 0;
  return Math.max(+v.ts||0,+v.geaendert||0,+v.fertig||0,+v.erstellt||0,Math.floor((+v.pos||0)/100));
};
function zusammenfuehren(fern){
  const vorher=JSON.stringify(S);
  const neu={...leer()};
  /* Zuerst die Grabsteine beider Seiten: sie entscheiden mit, was überhaupt
     zurückkommen darf. Je Kennung zählt der jüngste Löschzeitpunkt. */
  const tot={...((fern&&fern.tot)||{})};
  Object.entries(S.tot||{}).forEach(([k,t])=>{ if(+t>+(tot[k]||0)) tot[k]=+t; });
  neu.tot=tot;
  S.tot=tot;                                   /* damit istTot gleich den vollen Stand sieht */
  ["aufgaben","notizen","kategorien"].forEach(f=>{
    const lokal=S[f]||{}, entfernt=(fern&&fern[f])||{};
    const raus={};
    new Set([...Object.keys(entfernt),...Object.keys(lokal)]).forEach(k=>{
      const v=lokal[k], r=entfernt[k];
      const sieger=(v&&(!r||stempel(v)>stempel(r)))?v:r;
      if(!sieger) return;
      if(istTot(f+"/"+k,sieger)) return;       /* seit der Löschung nicht angefasst – bleibt fort */
      raus[k]=sieger;
    });
    neu[f]=raus;
  });
  neu.einst={...((fern&&fern.einst)||{}),...(S.einst||{})};
  S=neu; farbenAuffrischen(); schreibenLokal();
  /* Alles, was die Gegenseite noch nicht kennt, hochschieben – dazu gehören
     ausdrücklich auch die Grabsteine und die dadurch entfernten Einträge. */
  const auszug=z=>JSON.stringify({aufgaben:(z&&z.aufgaben)||{},notizen:(z&&z.notizen)||{},
    kategorien:(z&&z.kategorien)||{},tot:(z&&z.tot)||{}});
  if(auszug(fern)!==auszug(neu)) senden("",S);
  if(vorher!==JSON.stringify(S)) render();
}

/* Was von außen hereinkommt, geht durch dieselbe Prüfung wie ein Abgleich:
   Ein Eintrag, der hier längst gelöscht ist und seither nicht angefasst wurde,
   wird nicht wieder aufgenommen – stattdessen bekommt die Gegenseite die
   Löschung noch einmal geschickt, denn offenbar kennt sie sie nicht. */
function fernSetzen(pfad,daten){
  const rein=String(pfad||"").replace(/^\//,"");
  if(EINTRAGSPFAD.test(rein)){
    if(daten===null){ grabstein(rein,null,false); setPfad(S,rein,null); return; }
    if(istTot(rein,daten)){ senden(rein,null); return; }
    grabstein(rein,daten);
  }
  setPfad(S,rein,daten);
}

/* ---------- Verbindung mit Selbstheilung ---------- */
let erstesPut=true, wiederTimer=null, versuche=0;
function verbinden(){
  if(es){try{es.close();}catch(e){} es=null;}
  clearTimeout(wiederTimer);
  if(!basis()){zustandSetzen("lokal");return;}
  zustandSetzen("verbindet"); erstesPut=true;
  try{
    es=new EventSource(adresse(""));
    es.addEventListener("put",e=>{
      let d; try{ d=JSON.parse(e.data); }catch(err){ return; }
      if(!d||typeof d!=="object") return;
      /* Jedes vollständige Update wird zusammengeführt, nie blind übernommen.
         Stimmen beide Stände überein, entsteht dabei kein weiterer Schreibvorgang. */
      if(d.path==="/"||d.path===""){ erstesPut=false; zusammenfuehren(d.data); return; }
      fernSetzen(d.path,d.data); schreibenLokal(); render();
    });
    es.addEventListener("patch",e=>{
      let d; try{ d=JSON.parse(e.data); }catch(err){ return; }
      if(!d||typeof d!=="object") return;
      Object.entries(d.data||{}).forEach(([k,v])=>fernSetzen((d.path==="/"?"":d.path)+"/"+k,v));
      schreibenLokal(); render();
    });
    es.addEventListener("keep-alive",()=>zustandSetzen("live"));
    /* Firebase meldet abgelehnte Regeln über eigene Ereignisse, nicht über einen Fehler */
    es.addEventListener("cancel",()=>{zustandSetzen("verweigert");try{es.close();}catch(err){}es=null;});
    es.addEventListener("auth_revoked",()=>{zustandSetzen("verweigert");try{es.close();}catch(err){}es=null;});
    es.onopen=()=>{ versuche=0; zustandSetzen("live"); flush(); };
    es.onerror=()=>{ if(dauerfehler())return; zustandSetzen("getrennt"); neuVerbinden(); };
  }catch(e){ zustandSetzen("getrennt"); neuVerbinden(); }
}
/* Nach einem Abbruch mit wachsendem Abstand erneut versuchen, höchstens alle 30 Sekunden */
function neuVerbinden(){
  clearTimeout(wiederTimer);
  if(dauerfehler()) return;   /* gegen abgelehnte Regeln hilft kein Wiederholen */
  const wartezeit=Math.min(30000,1000*Math.pow(2,Math.min(versuche++,5)));
  wiederTimer=setTimeout(()=>{ if(basis()&&syncState!=="live") verbinden(); },wartezeit);
}
/* Kommt das Gerät aus dem Ruhezustand, ist die Verbindung meist tot */
function syncPruefen(){
  if(!basis()||dauerfehler()) return;
  flush();
  if(syncState!=="live"&&syncState!=="verbindet"){ versuche=0; verbinden(); }
}
if(typeof addEventListener!=="undefined"){
  addEventListener("online",()=>{versuche=0;syncPruefen();});
  addEventListener("offline",()=>{if(syncState==="live"){syncState="getrennt";nav();}});
}

/* ---------- Aufgaben ---------- */
const kat=k=>S.kategorien[k]||{n:"Ohne Liste",f:"#8E8981"};
const aufListe=()=>Object.entries(S.aufgaben||{}).map(([id,a])=>({id,...a}));
const offen=a=>!a.fertig;
const sortiert=arr=>arr.sort((a,b)=>(a.pos||0)-(b.pos||0)||(a.erstellt||0)-(b.erstellt||0));

/* Schnelleingabe versteht "morgen", Wochentage und #liste */
function eingabeDeuten(text){
  let t=" "+text.trim()+" ", katId=null, wann=null;
  const km=t.match(/\s#(\S+)/);
  if(km){
    const gesucht=slug(km[1]);
    const treffer=Object.entries(S.kategorien).find(([id,k])=>slug(k.n).startsWith(gesucht)||id===km[1]);
    if(treffer){katId=treffer[0];t=t.replace(km[0]," ");}
  }
  const worte=[["heute",()=>heute()],["morgen",()=>morgen()],["übermorgen",()=>iso(new Date(Date.now()+2*TAG_MS))],
    ["uebermorgen",()=>iso(new Date(Date.now()+2*TAG_MS))],["woche",()=>"woche"],["danach",()=>"danach"],["irgendwann",()=>"danach"]];
  for(const [w,f] of worte){
    const re=new RegExp("\\s"+w+"\\s","i");
    if(re.test(t)){wann=f();t=t.replace(re," ");break;}
  }
  if(!wann){
    for(let i=0;i<7;i++){
      const re=new RegExp("\\s(?:am\\s)?"+TAGE[i]+"\\s|\\s"+TAGE_K[i]+"\\s","i");
      if(re.test(t)){
        const heuteIdx=(new Date().getDay()+6)%7;
        let diff=i-heuteIdx; if(diff<=0)diff+=7;
        wann=iso(new Date(Date.now()+diff*TAG_MS)); t=t.replace(re," "); break;
      }
    }
  }
  const dm=t.match(/\s(\d{1,2})\.(\d{1,2})\.?\s/);
  if(!wann&&dm){
    const j=new Date().getFullYear();
    let d=new Date(j,+dm[2]-1,+dm[1],12);
    if(d<ausIso(heute()))d=new Date(j+1,+dm[2]-1,+dm[1],12);
    wann=iso(d); t=t.replace(dm[0]," ");
  }
  return {text:t.replace(/\s+/g," ").trim(),katId,wann};
}
function aufgabeAnlegen(rohtext,vorgabeWann,vorgabeKat){
  const d=eingabeDeuten(rohtext);
  if(!d.text) return null;
  const id="a"+id6();
  const a={t:d.text,wann:d.wann||vorgabeWann||null,kat:d.katId||vorgabeKat||null,
           fertig:null,erstellt:Date.now(),pos:naechstePos()};
  const doppelt=aufListe().find(x=>!x.fertig&&normText(x.t)===normText(a.t));
  mut("aufgaben/"+id,a,!doppelt);
  if(doppelt){
    const wo=doppelt.wann?(/^\d{4}-/.test(doppelt.wann)?datumText(doppelt.wann):(doppelt.wann==="woche"?"Diese Woche":"Danach")):(doppelt.kat?kat(doppelt.kat).n:"ohne Liste");
    hinweis("Steht schon offen unter "+wo,"Neue löschen",()=>aufgabeLoeschen(id));
  }
  return id;
}
function naechsterTermin(a){
  if(!a.wdh||(!WDH_SCHRITT[a.wdh]&&a.wdh!=="monatlich")) return null;
  const basis=/^\d{4}-/.test(a.wann||"")?ausIso(a.wann):ausIso(heute());
  const d=new Date(basis);
  const weiter=()=>{
    if(a.wdh==="monatlich"){
      /* Der 31. darf nicht in den übernächsten Monat rutschen: erst den Monatstag
         merken, dann auf den letzten gültigen Tag des Zielmonats begrenzen. */
      const tag=d.getDate();
      d.setDate(1); d.setMonth(d.getMonth()+1);
      const letzter=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      d.setDate(Math.min(tag,letzter));
    } else d.setDate(d.getDate()+WDH_SCHRITT[a.wdh]);
  };
  weiter();
  /* Fester Wochentag schlägt den Rhythmus, sofern einer gewählt wurde */
  if(a.wdh==="woechentlich"&&typeof a.wdhTag==="number"){
    const abstand=(a.wdhTag-((d.getDay()+6)%7)+7)%7;
    d.setDate(d.getDate()+abstand);
  }
  /* Läge der nächste Termin schon wieder in der Vergangenheit, weiterrücken */
  let schutz=0;
  while(iso(d)<heute()&&schutz++<400) weiter();
  return iso(d);
}
function haken(id){
  const a=S.aufgaben[id]; if(!a) return;
  if(a.fertig){ aufAendern(id,{fertig:null}); return; }
  if(a.wdh){
    const naechst=naechsterTermin(a);
    if(naechst) mut("aufgaben/a"+id6(),{...a,wann:naechst,fertig:null,erstellt:Date.now(),pos:naechstePos()},false);
  }
  /* Kurz die Feier zeigen, dann erst neu zeichnen */
  const el=document.getElementById("hak_"+id);
  if(el&&el.classList){ el.classList.add("feier"); }
  /* Wer abgehakt hat, wird nur festgehalten, wenn unter „Mehr" ein Name steht.
     Ohne Namen bleibt die App wie bisher anonym. */
  aufAendern(id,{fertig:Date.now(),von:(cfg.name||"").trim()||null},false);
  setTimeout(render,320);
}
function verschieben(id,wann){ aufAendern(id,{wann}); }
function umEinenTag(id){
  const a=S.aufgaben[id]; if(!a) return;
  const basis=/^\d{4}-/.test(a.wann||"")?ausIso(a.wann):ausIso(heute());
  basis.setDate(basis.getDate()+1);
  verschieben(id,iso(basis));
}
/* Reihenfolge: die Positionen zweier Nachbarn tauschen */
function posTausch(idA,idB){
  const a=S.aufgaben[idA], b=S.aufgaben[idB]; if(!a||!b) return;
  const pa=a.pos||a.erstellt||0, pb=b.pos||b.erstellt||0;
  aufAendern(idA,{pos:pb},false);
  aufAendern(idB,{pos:pa});
}
function aufgabeLoeschenFragen(id,ausDialog){
  const a=S.aufgaben[id]; if(!a) return;
  bestaetigen("Aufgabe löschen?","„"+a.t.slice(0,60)+(a.t.length>60?"…":"")+"“","Löschen",()=>aufgabeLoeschen(id));
}
function aufgabeLoeschen(id){
  const kopie=S.aufgaben[id]; if(!kopie) return;
  mut("aufgaben/"+id,null,false);
  /* Beim Zurückholen ein frischer Stempel: sonst wäre der wiederhergestellte
     Eintrag älter als sein eigener Grabstein und flöge gleich wieder hinaus. */
  hinweis("„"+kopie.t.slice(0,34)+(kopie.t.length>34?"…":"")+"“ gelöscht","Rückgängig",
    ()=>mut("aufgaben/"+id,{...kopie,ts:Date.now()}));
}

/* Was gehört in welchen Topf? */
function topfHeute(){
  const h=heute();
  const alle=aufListe();
  return {
    faellig: sortiert(alle.filter(a=>offen(a)&&a.wann===h)),
    ueberfaellig: sortiert(alle.filter(a=>offen(a)&&a.wann&&a.wann<h&&/^\d{4}-/.test(a.wann))),
    fertig: alle.filter(istHeuteFertig).sort((a,b)=>b.fertig-a.fertig)
  };
}

/* ===== Ziehen und Ablegen =====
   Vier Dinge haben das Ziehen bisher unberechenbar gemacht, alle vier sind hier
   behoben:
   1. Jede Berührung des Griffs war sofort ein Zug. Ein Antippen beim Scrollen
      hat dadurch die Reihenfolge verändert. Jetzt gilt erst als Zug, was sich
      auch bewegt – acht Pixel weit.
   2. Die Bewegung hing am Griff. Rutschte der Finger schneller als das Bild
      nachkam, ging der Zug verloren. Jetzt hört das Fenster mit.
   3. Ein Neuzeichnen mitten im Zug – etwa weil eine Meldung ausläuft oder das
      andere Gerät etwas schickt – hat die gezogene Zeile unter dem Finger
      ausgetauscht. Während eines Zugs wird nicht mehr gezeichnet, das
      Versäumte danach nachgeholt.
   4. Der Zielplatz wurde an der Fingerspitze gemessen. Wo man die Zeile
      angefasst hat, verschob damit das Ergebnis. Jetzt zählt die Mitte der
      gezogenen Zeile.
   Dazu neu: am Bildrand rollt die Liste mit, die Nachbarn machen sichtbar Platz,
   und Escape bricht ab. */
const DND_SCHWELLE=8;      /* so viele Pixel Weg, bevor aus Berühren ein Ziehen wird */
const DND_RAND=76;         /* ab diesem Abstand zum Bildrand rollt die Liste mit */
const DND_TEMPO=16;        /* höchstens so viele Pixel je Bild */
let dndZustand=null;       /* der laufende Zug, sonst null */
let dndSperre=false;       /* solange gezogen wird: nicht neu zeichnen */
let dndNachholen=false;    /* ein unterdrücktes Neuzeichnen wartet */
let dndKlickSperre=0;      /* der Klick unmittelbar nach dem Loslassen zählt nicht */

function dndGriff(ev,containerId,art){
  if(dndZustand) dndAufraeumen();                       /* ein hängengebliebener Zug endet hier */
  if(ev.button&&ev.button!==0) return;                  /* nur die linke Taste */
  const box=document.getElementById(containerId); if(!box) return;
  const zeile=elternMit(ev.currentTarget,"data-dnd"); if(!zeile) return;
  const kinder=[...box.children].filter(k=>k.getAttribute&&k.getAttribute("data-dnd"));
  const index=kinder.indexOf(zeile); if(index<0) return;
  if(ev.preventDefault) ev.preventDefault();
  dndZustand={art,box,zeile,kinder,index,ziel:index,aktiv:false,
    griff:ev.currentTarget, pid:ev.pointerId, rollen:0,
    startX:ev.clientX, startSeite:ev.clientY+versatzY(),
    zeigerX:ev.clientX, zeigerY:ev.clientY,
    rects:null, schritt:0, zone:null, dropWann:null};
  addEventListener("pointermove",dndBewegen,{passive:false});
  addEventListener("pointerup",dndLoslassen,true);
  addEventListener("pointercancel",dndAbbrechen,true);
  addEventListener("keydown",dndTaste,true);
}
const versatzY=()=>(typeof scrollY==="number"?scrollY:0);
/* Nach oben suchen, aber begrenzt – oberhalb des Körpers gibt es kein getAttribute mehr */
function elternMit(el,attr,tiefe=12){
  let n=el, i=0;
  while(n&&typeof n.getAttribute==="function"&&!n.getAttribute(attr)&&i++<tiefe) n=n.parentNode;
  return (n&&typeof n.getAttribute==="function"&&n.getAttribute(attr))?n:null;
}
function dropZoneAn(x,y){
  if(!document.elementFromPoint) return null;
  const el=document.elementFromPoint(x,y);
  return el?elternMit(el,"data-drop"):null;
}
/* Erst hier wird gemessen: bis zur Schwelle kann sich das Bild noch bewegen.
   Gemessen wird in Seitenkoordinaten, damit Mitrollen nichts verzerrt. */
function dndStarten(){
  const z=dndZustand; if(!z||z.aktiv) return;
  const oben=versatzY();
  z.rects=z.kinder.map(k=>{
    const r=k.getBoundingClientRect();
    return {top:r.top+oben, hoehe:r.height, mitte:r.top+oben+r.height/2};
  });
  const eigen=z.rects[z.index];
  /* Der Schritt ist die Höhe der Zeile samt Abstand zur nächsten – so weit
     rücken die Nachbarn, wenn sie Platz machen. */
  const luecke=z.rects.length>1?Math.max(0,z.rects[1].top-(z.rects[0].top+z.rects[0].hoehe)):0;
  z.schritt=eigen.hoehe+luecke;
  z.aktiv=true; dndSperre=true; dndNachholen=false;
  z.zeile.classList.add("zieht");
  z.kinder.forEach((k,i)=>{ if(i!==z.index) k.classList.add("dnd-weicht"); });
  if(document.body&&document.body.classList) document.body.classList.add("dnd-laeuft");
  try{ z.griff.setPointerCapture(z.pid); }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){}
  dndRollen();
}
function dndBewegen(ev){
  const z=dndZustand; if(!z) return;
  z.zeigerX=ev.clientX; z.zeigerY=ev.clientY;
  if(!z.aktiv){
    const weg=Math.max(Math.abs(ev.clientY+versatzY()-z.startSeite),Math.abs(ev.clientX-z.startX));
    if(weg<DND_SCHWELLE) return;
    dndStarten();
  }
  if(ev.cancelable&&ev.preventDefault) ev.preventDefault();
  dndZeichnen();
}
function dndZeichnen(){
  const z=dndZustand; if(!z||!z.aktiv) return;
  const dy=z.zeigerY+versatzY()-z.startSeite;
  z.zeile.style.transform="translateY("+dy+"px)";
  if(z.art==="aufgabe") dndZonePruefen();
  /* Zielplatz aus der Mitte der gezogenen Zeile: wo der Finger sie gepackt hat,
     darf das Ergebnis nicht verschieben.
     Verglichen wird mit den Mitten, die die Nachbarn während des Zugs
     tatsächlich haben – alles unterhalb der gezogenen Zeile ist um eine Zeile
     aufgerückt, weil deren Platz ja frei ist. Ohne diese Verrechnung landete
     eine nach unten gezogene Zeile stets eine Stelle zu früh. */
  const mitte=z.rects[z.index].mitte+dy;
  let ziel=0;
  z.kinder.forEach((k,i)=>{
    if(i===z.index) return;
    const m=i>z.index?z.rects[i].mitte-z.schritt:z.rects[i].mitte;
    if(m<mitte) ziel++;
  });
  if(ziel===z.ziel) return;
  z.ziel=ziel;
  dndLueckeZeigen();
}
/* Die Nachbarn zwischen alter und neuer Position rücken um eine Zeile weiter –
   die Lücke wandert sichtbar mit, statt nur als Strich zu erscheinen. */
function dndLueckeZeigen(){
  const z=dndZustand; if(!z) return;
  z.kinder.forEach((k,i)=>{
    if(i===z.index) return;
    let v=0;
    if(i>z.index&&i<=z.ziel) v=-z.schritt;
    else if(i<z.index&&i>=z.ziel) v=z.schritt;
    k.style.transform=v?"translateY("+v+"px)":"";
  });
}
function dndZonePruefen(){
  const z=dndZustand; if(!z) return;
  const zone=dropZoneAn(z.zeigerX,z.zeigerY);
  const eigen=S.aufgaben[z.zeile.getAttribute("data-dnd")];
  const wann=zone?zone.getAttribute("data-drop"):null;
  const fremd=!!(zone&&eigen&&wann!==(eigen.wann||""));
  const neu=fremd?zone:null;
  if(z.zone&&z.zone!==neu) z.zone.classList.remove("drop-an");
  if(neu&&neu!==z.zone) neu.classList.add("drop-an");
  z.zone=neu; z.dropWann=fremd?wann:null;
}
/* Am oberen und unteren Rand rollt die Liste mit, sonst kommt eine Aufgabe nie
   weiter als einen Bildschirm weit. */
function dndRollen(){
  const z=dndZustand; if(!z||!z.aktiv) return;
  if(typeof requestAnimationFrame!=="function") return;
  const hoehe=(typeof innerHeight==="number"?innerHeight:0)||600;
  let d=0;
  if(z.zeigerY<DND_RAND) d=-Math.ceil((DND_RAND-z.zeigerY)/DND_RAND*DND_TEMPO);
  else if(z.zeigerY>hoehe-DND_RAND) d=Math.ceil((z.zeigerY-(hoehe-DND_RAND))/DND_RAND*DND_TEMPO);
  if(d&&typeof scrollBy==="function"){ scrollBy(0,d); dndZeichnen(); }
  z.rollen=requestAnimationFrame(dndRollen);
}
function dndTaste(ev){ if(ev&&ev.key==="Escape") dndAbbrechen(); }
function dndAbbrechen(){
  const war=!!(dndZustand&&dndZustand.aktiv);
  dndAufraeumen();
  if(war) render();
}
/* Alles zurück auf Anfang – wird aus jedem Ende heraus aufgerufen, damit keine
   Klasse, kein Zuhörer und kein Bildlauf hängen bleibt. */
function dndAufraeumen(){
  const z=dndZustand; if(!z) return;
  dndZustand=null;
  removeEventListener("pointermove",dndBewegen);
  removeEventListener("pointerup",dndLoslassen,true);
  removeEventListener("pointercancel",dndAbbrechen,true);
  removeEventListener("keydown",dndTaste,true);
  if(z.rollen&&typeof cancelAnimationFrame==="function") cancelAnimationFrame(z.rollen);
  try{ z.griff.releasePointerCapture(z.pid); }catch(e){}
  z.zeile.style.transform="";
  z.zeile.classList.remove("zieht");
  z.kinder.forEach(k=>{ k.classList.remove("dnd-weicht"); k.style.transform=""; });
  if(z.zone) z.zone.classList.remove("drop-an");
  if(document.body&&document.body.classList) document.body.classList.remove("dnd-laeuft");
  dndSperre=false;
  if(dndNachholen){ dndNachholen=false; render(); }
}
function dndLoslassen(ev){
  const z=dndZustand; if(!z) return;
  if(!z.aktiv){ dndAufraeumen(); return; }          /* nur berührt, nicht gezogen */
  if(ev&&ev.cancelable&&ev.preventDefault) ev.preventDefault();
  const art=z.art, index=z.index, ziel=z.ziel, dropWann=z.dropWann;
  const id=z.zeile.getAttribute("data-dnd");
  const ids=z.kinder.map(k=>k.getAttribute("data-dnd"));
  dndKlickSperre=Date.now()+350;
  dndAufraeumen();
  /* In eine fremde Ablegezone gezogen: Termin ändern statt umsortieren */
  if(art==="aufgabe"&&dropWann!=null){
    const a=S.aufgaben[id];
    if(a){
      const vorher=a.wann;
      verschieben(id,dropWann||null);
      hinweis(a.t.slice(0,40)+" → "+(dropWann?datumText(dropWann):"ohne Termin"),
              "Rückgängig",()=>aufAendern(id,{wann:vorher}));
      return;
    }
  }
  if(index===ziel){ render(); return; }              /* wieder am selben Platz */
  const gezogen=ids.splice(index,1)[0];
  ids.splice(ziel,0,gezogen);
  dndUebernehmen(ids,art);
}
/* Ein Klick, der aus einem Zug hervorgeht, darf die Zeile nicht auch noch
   öffnen. Genau einer wird geschluckt, und nur direkt nach dem Loslassen. */
if(typeof addEventListener!=="undefined") addEventListener("click",ev=>{
  if(!dndKlickSperre) return;
  const frisch=Date.now()<dndKlickSperre;
  dndKlickSperre=0;
  if(!frisch) return;
  if(ev.stopPropagation) ev.stopPropagation();
  if(ev.preventDefault) ev.preventDefault();
},true);

/* Neue Reihenfolge festschreiben: gleichmäßige Abstände, damit später Platz zum Einschieben bleibt */
function dndUebernehmen(ids,art){
  const feld=art==="notiz"?"notizen":"aufgaben";
  const folge=art==="notiz"?notizFolgeGlobal(ids):ids;
  const jetzt=Date.now(), start=jetzt*100;
  const geaendert=[];
  folge.forEach((id,i)=>{
    const e=S[feld][id]; if(!e) return;
    const pos=start+i*10;
    if(e.pos===pos) return;
    setPfad(S,feld+"/"+id,{...e,pos,ts:jetzt});
    geaendert.push(id);
  });
  if(art==="notiz"&&(!S.einst||S.einst.notizSort!=="eigen")){
    setPfad(S,"einst/notizSort","eigen"); senden("einst/notizSort","eigen");
  }
  schreibenLokal();
  geaendert.forEach(id=>senden(feld+"/"+id,S[feld][id]));
  render();
}
/* Notizen stehen bei zeitlicher Sortierung in mehreren Kästen. Damit die neue
   Ordnung auch global stimmt, wird die sichtbare Gesamtreihenfolge genommen und
   nur der bewegte Abschnitt darin ersetzt – Platz für Platz. */
function notizFolgeGlobal(ids){
  if(!document.querySelectorAll) return ids;
  const alle=[...document.querySelectorAll(".notizreihe[data-dnd]")].map(k=>k.getAttribute("data-dnd"));
  if(!alle.length) return ids;
  const drin=new Set(ids);
  let i=0;
  return alle.map(x=>drin.has(x)?(i<ids.length?ids[i++]:x):x);
}

function aufZeile(a,opt={}){
  const k=a.kat?kat(a.kat):null;
  const h=heute();
  const spaet=!a.fertig&&a.wann&&/^\d{4}-/.test(a.wann)&&a.wann<h;
  const meta=[];
  if(k) meta.push(`<span class="mini"><i class="punkt" style="background:${k.f}"></i> ${esc(k.n)}</span>`);
  if(opt.datum&&a.wann){
    if(a.wann==="woche") meta.push(`<span class="mini">Diese Woche</span>`);
    else if(a.wann==="danach") meta.push(`<span class="mini">Danach</span>`);
    else meta.push(`<span class="mini ${spaet?"spaet":""}">${spaet?"seit ":""}${datumText(a.wann)}</span>`);
  }
  if(a.wdh) meta.push(`<span class="mini">${WDH[a.wdh]}</span>`);
  /* Was lange ohne Termin im Vorrat liegt, sagt das leise selbst –
     die ruhige Variante einer Erinnerung, ganz ohne Benachrichtigung. */
  if(!a.fertig&&!a.wann&&a.erstellt){
    const tage=Math.floor((Date.now()-a.erstellt)/TAG_MS);
    if(tage>=LIEGT_AB) meta.push(`<span class="mini liegt">liegt seit ${tage} Tagen</span>`);
  }
  if(a.fertig&&a.von) meta.push(`<span class="mini">✓ ${esc(a.von)}</span>`);
  /* Der Griff ist immer da – Ziehen soll ohne Umschalten funktionieren.
     Die ganze Zeile öffnet die Bearbeitung; Haken und Griff halten das Ereignis auf. */
  const griff=opt.sort?`<button class="griff" onpointerdown="dndGriff(event,'${opt.box}','aufgabe')" onclick="event.stopPropagation()" aria-label="Verschieben">${GRIFF}</button>`:"";
  /* Der häufigste Handgriff des Tages – aus dem Vorrat oder aus dem Überfälligen
     in den Tag – soll ein Tipp sein, nicht drei. */
  const schnellZiel=opt.schnell&&!a.fertig
    ? `<div class="zeilentakt">
         ${a.wann!==h?`<button class="ztakt" onclick="event.stopPropagation();verschieben('${a.id}','${h}')" aria-label="Auf heute">Heute</button>`:""}
         ${a.wann!==morgen()?`<button class="ztakt" onclick="event.stopPropagation();verschieben('${a.id}','${morgen()}')" aria-label="Auf morgen">Morgen</button>`:""}
       </div>`
    : "";
  return `<div class="auf ${a.fertig?"fertig":""} ${spaet&&!a.fertig?"ueber":""}" data-dnd="${a.id}" onclick="aufgabeOeffnen('${a.id}')">
    <button class="hak" id="hak_${a.id}" onclick="event.stopPropagation();haken('${a.id}')" aria-label="${a.fertig?"Wieder öffnen":"Erledigt"}">
      <svg viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9"/></svg></button>
    <div class="auf-txt">${esc(a.t)}
      ${meta.length?`<div class="auf-meta">${meta.join("")}</div>`:""}
      ${a.notiz?`<div class="auf-notiz">${esc(a.notiz)}</div>`:""}
      ${schnellZiel}</div>
    ${griff}
  </div>`;
}
/* Eine Liste mit optionalen Sortierpfeilen ausgeben */
let boxZaehler=0;
function aufListeHtml(liste,opt={}){
  const box="box"+(++boxZaehler);
  const zieh=liste.length>0;
  return `<div id="${box}">`+liste.map(a=>aufZeile(a,{...opt,sort:zieh,box})).join("")+`</div>`;
}

/* ---------- Schnelleingabe in Daumenreichweite ----------
   Dasselbe Feld wie oben auf „Heute", nur erreichbar ohne die Hand zu wechseln.
   Auf der Notizansicht legt derselbe Knopf eine Notiz an – das ist dort das,
   was man erwartet. Nach dem Anlegen bleibt das Fenster offen, damit mehrere
   Dinge am Stück hineingehen. */
let schnellWohin="heute";
const SCHNELL_ZIELE=[["heute","Heute"],["morgen","Morgen"],["woche","Diese Woche"],["sammeln","Nur sammeln"]];
function daumenKnopf(){
  if(tab==="notizen") return notizAnlegen();
  schnellOeffnen();
}
function schnellOeffnen(){
  const koerper=()=>`<div class="sheet-kopf"><h2>Schnell eintragen</h2>
      <button class="btn btn-ghost btn-s" onclick="closeSheet()" aria-label="Schließen">✕</button></div>

    <div class="chips" style="padding-bottom:4px">
      ${SCHNELL_ZIELE.map(([w,l])=>`<button class="chip" aria-pressed="${schnellWohin===w}"
        onclick="schnellWohin='${w}';schnellOeffnen()">${l}</button>`).join("")}</div>
    <p class="note" style="margin-top:10px">„morgen", „Freitag", „14.9." oder „#Geburt" mitschreiben – das schlägt die Auswahl hier.</p>`;

function schnellAnlegen(){

  const t=el.value; if(!t.trim()) return;
  el.value="";
  const wann=schnellWohin==="heute"?heute():schnellWohin==="morgen"?morgen():schnellWohin==="woche"?"woche":null;
  aufgabeAnlegen(t,wann,null);
  hinweis("Eingetragen.");
  const neu=document.getElementById("schnellfeld"); if(neu&&neu.focus)neu.focus();

/* ---------- Heute: schneller Zugriff auf Notizen ---------- */
function heuteNotizen(){
  const alle=Object.entries(S.notizen||{}).map(([id,n])=>({...n,id})).filter(n=>!n.archiv);
  if(!alle.length) return "";
  const zeit=n=>Math.max(n.geoeffnet||0,n.geaendert||0,n.erstellt||0);
  const oben=alle.filter(n=>n.oben).sort((a,b)=>zeit(b)-zeit(a));
  const rest=alle.filter(n=>!n.oben).sort((a,b)=>zeit(b)-zeit(a));
  const liste=oben.concat(rest).slice(0,5);
  return `<div class="sect"><h2>Notizen</h2><span class="zahl">${oben.length?oben.length+" angeheftet":"zuletzt genutzt"}</span>
      <button class="btn btn-s" onclick="go('notizen')">Alle</button></div>
    <div class="notizspur">${liste.map(n=>{
      const k=n.kat?kat(n.kat):null;
      return `<button class="nspur" onclick="notizOeffnen('${n.id}')" style="border-left-color:${k?k.f:"var(--line-2)"}">
        <b>${n.oben?'<span style="color:var(--akz)">▲ </span>':""}${esc(n.titel||"Ohne Titel")}</b>
        <span>${esc(textAus(n.html).slice(0,70)||"Leer")}</span></button>`;}).join("")}</div>`;
}

/* ---------- Heute: was diese Woche noch ansteht ----------
   Der Topf „Diese Woche, ohne festen Tag" lebte bisher nur in der Wochenansicht.
   Wer morgens auf „Heute" schaut, hat ihn dadurch nie gesehen. */
function wochenTopf(){
  const liste=sortiert(aufListe().filter(a=>!a.fertig&&a.wann==="woche"));
  if(!liste.length) return "";
  const zeigen=liste.slice(0,3), rest=liste.length-zeigen.length;
  return `<div class="sect"><h2>Diese Woche noch</h2><span class="zahl">${liste.length}</span>
      <button class="btn btn-s" onclick="go('woche')">Woche</button></div>
    ${zeigen.map(a=>{
      const k=a.kat?kat(a.kat):null;
      return `<div class="topfzeile" onclick="aufgabeOeffnen('${a.id}')">
        ${k?`<i class="punkt" style="background:${k.f}"></i>`:""}
        <span>${esc(a.t)}</span>
        <button class="ztakt rest" onclick="event.stopPropagation();verschieben('${a.id}','${heute()}')">Heute</button>
      </div>`;}).join("")}
    ${rest>0?`<p class="note" style="margin:2px 0 8px">und ${rest} weitere unter „Woche".</p>`:""}`;
}

/* ---------- Heute ---------- */
function vHeute(){
  const {faellig,ueberfaellig,fertig}=topfHeute();
  const ges=faellig.length+ueberfaellig.length+fertig.length;
  const anteil=ges?Math.round(fertig.length/ges*100):0;
  const bogen=`<div class="bogen ${ges&&fertig.length===ges?"voll":""}">
    <div class="bogen-kopf"><b>${ges?(fertig.length===ges?"Alles erledigt":fertig.length+" von "+ges+" erledigt"):"Noch nichts geplant"}</b>
      <span>${new Date().getDate()}. ${MONATE[new Date().getMonth()].toUpperCase()} · ${kw()}</span></div>
    <div class="balken"><i style="width:${anteil}%"></i></div></div>`;

  const nichts=!faellig.length&&!ueberfaellig.length&&!fertig.length
    ? `<div class="leerzustand"><b>Der Tag ist frei</b>Trag oben etwas ein oder hol dir unter Listen eine Aufgabe aus einem deiner Vorräte.
       <div style="margin-top:14px"><button class="btn" onclick="go('listen')">Zu den Listen</button></div></div>` : "";

  /* Überfälliges lässt sich dort aufräumen, wo es auftaucht – statt drei
     Ansichten weiter unter „Mehr". */
  const ueberKopf=ueberfaellig.length
    ? `<div class="sect"><h2>Überfällig</h2><span class="zahl">${ueberfaellig.length}</span>
         <button class="btn btn-s" onclick="ueberfaelligHolen()">Alle auf heute</button></div>
       ${aufListeHtml(ueberfaellig,{datum:true,schnell:true})}`
    : "";

  return hinweisLeiste() + bogen + `<div style="margin-top:14px"></div>` + schnellFeld(heute(),null)
    + ueberKopf
    + (faellig.length?`<div class="sect"><h2>Für heute</h2><span class="zahl">${faellig.length}</span></div>
        <div data-drop="${heute()}">${aufListeHtml(faellig)}</div>`:`<div data-drop="${heute()}"></div>`)
    + nichts
    + wochenTopf()
    + morgenBlock()
    + heuteNotizen()
    + (fertig.length?`<div class="sect"><h2>Heute geschafft</h2><span class="zahl">${fertig.length}</span></div>
       ${fertig.map(a=>aufZeile(a,{})).join("")}
       <p class="note" style="margin-top:6px">Verschwindet um Mitternacht von allein.</p>`:"");
}

/* ---------- Woche ---------- */
function vWoche(){
  const tage=wochenTage(wochenVersatz);
  const alle=aufListe();
  const inWoche=a=>a.wann&&tage.includes(a.wann);
  const kopf=`<div class="row-btns" style="margin-bottom:12px">
      <button class="btn btn-s" onclick="wochenVersatz--;render()">‹</button>

        ${wochenVersatz===0?"Diese Woche":wochenVersatz===1?"Nächste Woche":wochenVersatz===-1?"Letzte Woche":kw(wochenStart(wochenVersatz))}
        · ${kw(wochenStart(wochenVersatz))}</button>
      <button class="btn btn-s" onclick="wochenVersatz++;render()">›</button></div>`;

  const bloecke=tage.map(d=>{
    const offeneT=sortiert(alle.filter(a=>a.wann===d&&!a.fertig));
    const erledigtT=alle.filter(a=>a.wann===d&&a.fertig).sort((x,y)=>(y.fertig||0)-(x.fertig||0));
    const drin=wocheFertig?offeneT.concat(erledigtT):offeneT;
    const fertigT=erledigtT.length;
    return `<div class="tagblock ${d===heute()?"heute":""}">
      <div class="tagblock-h"><b>${TAGE[wochentag(d)]}${d===heute()?" · heute":""}</b>
        <span>${ausIso(d).getDate()}.${ausIso(d).getMonth()+1}.${offeneT.length?" · "+offeneT.length+" OFFEN":""}${fertigT?" · "+fertigT+" ERLEDIGT":""}</span></div>
      ${drin.length?aufListeHtml(drin):`<div class="leer">frei — <button class="btn btn-ghost btn-s" style="padding:0" onclick="schnellFuer('${d}')">etwas eintragen</button></div>`}
    </div>`;}).join("");

  const wocheOffen=sortiert(alle.filter(a=>!a.fertig&&a.wann==="woche"));
  const danach=sortiert(alle.filter(a=>!a.fertig&&a.wann==="danach"));

  return hinweisLeiste() + kopf

    + bloecke
    + `<div class="sect"><h2>Diese Woche, ohne festen Tag</h2><span class="zahl">${wocheOffen.length}</span></div>`

    + (danach.length?aufListeHtml(danach):`<p class="note">Nichts vorgemerkt.</p>`);
}

/* ---------- Listen (Vorräte ohne Datum) ---------- */
function vListen(){
  const alle=aufListe();
  const ohneDatum=a=>!a.fertig&&!a.wann;
  const katsSortiert=Object.entries(S.kategorien).sort((a,b)=>(a[1].pos||0)-(b[1].pos||0));
  const k=katFilter==="alle"?null:S.kategorien[katFilter];
  const offenZahl=id=>alle.filter(a=>ohneDatum(a)&&a.kat===id).length;
  const chips=`<div class="filterzeile">
    <button class="filterknopf" onclick="listenFilterWaehlen()">
      ${k?`<i class="punkt" style="background:${k.f}"></i>`:""}
      <b>${k?esc(k.n):"Alle Listen"}</b>
      <span class="anz">${k?offenZahl(katFilter):alle.filter(a=>ohneDatum(a)).length} offen</span>
      <span class="pfeil">▾</span></button></div>`;
  const zeigen=katsSortiert.filter(([id])=>katFilter==="alle"||katFilter===id);
  const bloecke=zeigen.map(([id,k])=>{
    const drin=sortiert(alle.filter(a=>ohneDatum(a)&&a.kat===id));

      <div class="schnell" style="margin-bottom:14px">
        <input type="text" id="neu_${id}" placeholder="In „${esc(k.n)}“ sammeln …"
          onkeydown="if(event.key==='Enter')sammeln('${id}')">
        <button class="btn" onclick="sammeln('${id}')">+</button></div>`;
  }).join("");

  const ohneListe=sortiert(alle.filter(a=>ohneDatum(a)&&!a.kat));
  if(aufSuche.trim()) return hinweisLeiste()+sucheFeld()+`<div id="suchtreffer">${sucheTreffer()}</div>`;
  return hinweisLeiste() + sucheFeld() + chips + bloecke

function listenFilterWaehlen(){

  openSheet(`<div class="sheet-kopf"><h2>Liste wählen</h2>

const NOTIZ_ARTEN_ENTFALLEN={
  frei:{n:"Leer",v:""},
  karte:{n:"Kartentext",v:"<p>Liebe/r …</p><p><br></p><p><br></p><p>Alles Liebe,<br>Marco</p>"},
  buch:{n:"Buch oder Podcast",v:"<h3>Quelle</h3><p>Titel, Autor, Folge</p><h3>Kernaussagen</h3><ul><li>&nbsp;</li></ul><h3>Zitate</h3><ul><li>&nbsp;</li></ul><h3>Was ich mitnehme</h3><p>&nbsp;</p>"},

  projekt:{n:"Sammlung zu einem Thema",v:"<h3>Worum es geht</h3><p>&nbsp;</p><h3>Offene Fragen</h3><ul><li>&nbsp;</li></ul><h3>Gefundenes</h3><ul><li>&nbsp;</li></ul>"}
};
let offeneNotiz=null, speicherTimer=null;

const textAus=h=>entziffern(String(h||"").replace(/<br\s*\/?>/gi," ").replace(/<\/(p|div|li|h\d)>/gi," ").replace(/<[^>]+>/g," "))
  .replace(/\u00a0/g," ").replace(/\s+/g," ").trim();
/* Notizen dürfen Auszeichnung enthalten, aber nichts Ausführbares. Der Inhalt kommt
   aus dem Editor, aus geteilten Seiten und aus dem Google-Import – überall kann
   fremdes HTML mitkommen, und es landet anschließend wieder in einem Element. */
const SCHEMA_ERLAUBT=/^(?:https?|mailto|tel):/i;
const BILD_ERLAUBT=/^data:image\/(?:png|jpe?g|gif|webp);base64,/i;
/* „java&#115;cript:" wäre erst im Browser wieder ein Schema – deshalb werden
   Entities und unsichtbare Zeichen vor der Prüfung aufgelöst. */
function adresseSicher(wert){
  const roh=String(wert)
    .replace(/&#x([0-9a-f]+);?/gi,(_,h)=>String.fromCharCode(parseInt(h,16)))
    .replace(/&#(\d+);?/g,(_,d)=>String.fromCharCode(+d))
    .replace(/[\s\u0000-\u001f\u007f]/g,"");
  if(!/^[a-z][a-z0-9+.-]*:/i.test(roh)) return true;            /* relative Adresse */
  return SCHEMA_ERLAUBT.test(roh)||BILD_ERLAUBT.test(roh);
}
const BOESE_TAGS="script|style|iframe|frame|frameset|object|embed|applet|link|meta|base|form|input|button|noscript";
const sauberHtml=h=>String(h||"")
  .replace(new RegExp("<\\s*("+BOESE_TAGS+")\\b[\\s\\S]*?<\\s*/\\s*\\1\\s*>","gi"),"")
  .replace(new RegExp("<\\s*/?\\s*(?:"+BOESE_TAGS+")\\b[^>]*>","gi"),"")
  /* Ereignis-Attribute – auch wenn sie mit / oder Umbruch statt Leerzeichen abgetrennt sind */
  .replace(/[\s/]on\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]*)/gi,"")
  /* Adressen, die Code ausführen könnten. Eingefügte Bilder als data: bleiben erlaubt. */
  .replace(/\s(href|src|xlink:href|action|formaction)\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/gi,
    (treffer,attr,a,b,c)=>adresseSicher(a!==undefined?a:(b!==undefined?b:(c||"")))?treffer:"");

/* ---------- Suche: Wortweise, gewichtet nach Fundort ---------- */
function notizenSuchen(q,modus){
  const worte=normText(q).split("_").filter(w=>w.length>1);
  let liste=Object.entries(S.notizen||{}).map(([id,n])=>({id,...n}));
  if(modus==="archiv") liste=liste.filter(n=>n.archiv);
  else if(modus!=="alle") liste=liste.filter(n=>!n.archiv);
  if(!worte.length) return liste.sort((a,b)=>(b.geaendert||0)-(a.geaendert||0));
  return liste.map(n=>{
    const t=normText(n.titel), k=normText(kat(n.kat).n), b=normText(textAus(n.html));
    let punkte=0, alle=true;
    worte.forEach(w=>{
      let p=0;
      if(t.includes(w))p+=6;
      if(k.includes(w))p+=3;
      if(b.includes(w))p+=1+Math.min(3,(b.split(w).length-1));
      if(!p)alle=false;
      punkte+=p;
    });
    return {...n,punkte,alle};
  }).filter(n=>n.alle).sort((a,b)=>b.punkte-a.punkte||(b.geaendert||0)-(a.geaendert||0));
}
/* Ausschnitt rund um den ersten Treffer, Fundstellen hervorgehoben */
function ausschnitt(n,q){
  const roh=textAus(n.html);
  const worte=q.trim().split(/\s+/).filter(w=>w.length>1);
  let start=0;
  if(worte.length){
    const i=roh.toLowerCase().indexOf(worte[0].toLowerCase());
    if(i>60) start=i-40;
  }
  let s=(start?"… ":"")+roh.slice(start,start+180)+(roh.length>start+180?" …":"");
  s=esc(s);
  worte.forEach(w=>{ s=s.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>"); });
  return s||"<i>Leer</i>";
}

const ICON_STIFT_N='<svg viewBox="0 0 24 24"><path d="M4 20h4l10-10a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M13.5 6.5l4 4"/></svg>';
const ICON_WEG_N='<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>';
const ICON_NADEL='<svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-3 4h10l-3-4V3M12 13v8"/></svg>';
const ICON_ARCHIV='<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/></svg>';

const SORTEN={erstellt:"Neueste zuerst",geoeffnet:"Zuletzt geöffnet",geaendert:"Zuletzt geändert",eigen:"Eigene Reihenfolge"};
const notizSortierung=()=>{const s=(S.einst&&S.einst.notizSort)||"erstellt";return SORTEN[s]?s:"erstellt";};
const notizPos=n=>n.pos||n.erstellt||0;
/* Für jede Sortierung der passende Zeitstempel. Werte vor dem Jahr 2000 stammen
   aus fehlerhaften Importen und werden übersprungen, sonst landet alles in „1970“. */
const zeitOk=t=>typeof t==="number"&&t>946684800000;
function sortWert(n,art){
  const kette=art==="geoeffnet"?[n.geoeffnet,n.geaendert,n.erstellt]
            :art==="geaendert"?[n.geaendert,n.erstellt,n.geoeffnet]
            :[n.erstellt,n.geaendert,n.geoeffnet];
  for(const t of kette) if(zeitOk(t)) return t;
  return 0;
}
function notizenGeordnet(liste){
  const art=notizSortierung();
  const kern=art==="eigen"
    ? (a,b)=>notizPos(a)-notizPos(b)
    : (a,b)=>sortWert(b,art)-sortWert(a,art);
  /* Angeheftetes steht immer oben, unabhängig von der gewählten Sortierung */
  return liste.slice().sort((a,b)=>(b.oben?1:0)-(a.oben?1:0)||kern(a,b));
}
/* Zeitliche Gliederung: was heute war, was diese Woche, was älter */
function zeitGruppe(n){
  if(n.oben) return "Angeheftet";
  const t=sortWert(n,notizSortierung()), d=iso(new Date(t));
  if(d===heute()) return "Heute";
  if(wochenTage(0).includes(d)) return "Diese Woche";
  const jetzt=new Date(), dat=new Date(t);
  if(dat.getFullYear()===jetzt.getFullYear()&&dat.getMonth()===jetzt.getMonth()) return "Diesen Monat";
  if(dat.getFullYear()===jetzt.getFullYear()) return MONATE[dat.getMonth()];
  return String(dat.getFullYear());
}

  const sortKurz={erstellt:"neueste",geoeffnet:"zuletzt geöffnet",geaendert:"zuletzt geändert",eigen:"eigene Ordnung"}[notizSortierung()];

function notizAuswahl(){
  const treffer=notizenSuchen(notizSuche,notizFilter);
  return katFilter==="alle"?treffer:treffer.filter(n=>n.kat===katFilter);
}
function notizTreffer(){
  const liste=notizSuche?notizAuswahl():notizenGeordnet(notizAuswahl());
  if(!liste.length) return `<div class="leerzustand"><b>${notizSuche?"Nichts gefunden":(notizFilter==="archiv"?"Archiv ist leer":"Noch keine Notiz")}</b>
    ${notizSuche?"Andere Begriffe probieren, oder oben auf „Überall“ stellen, um das Archiv einzubeziehen.":"Mit dem Plus oben rechts legst du eine an."}</div>`;
  /* Bei eigener Reihenfolge oder Suche keine Zeitgruppen, sonst würde die Ordnung zerfallen */
  const gruppieren=!notizSuche&&notizSortierung()!=="eigen";
  if(!gruppieren) return `<div id="nbox">`+liste.map(n=>notizKarte(n,"nbox")).join("")+`</div>`;
  let letzte="", raus="";
  liste.forEach(n=>{
    const g=zeitGruppe(n);
    if(g!==letzte){ raus+=(letzte?`</div>`:"")+`<div class="gruppe">${g}</div><div id="nbox_${slug(g)}">`; letzte=g; }
    raus+=notizKarte(n,"nbox_"+slug(g));
  });
  return raus+(letzte?`</div>`:"");
}
/* Der Kasten wird übergeben, nicht ein zweites Mal ausgerechnet. Vorher stand in
   der Karte immer „nbox_<Zeitgruppe>", auch wenn die Liste bei eigener
   Reihenfolge gar nicht gruppiert war und schlicht „nbox" hieß. Der Griff zeigte
   dann auf einen Kasten, den es nicht gab – und Ziehen tat nichts mehr, und zwar
   ab dem Augenblick, in dem man das erste Mal etwas gezogen hatte. */

      <p>${notizSuche?ausschnitt(n,notizSuche):esc(textAus(n.html).slice(0,150)||"Leer")}</p>
      <span class="nm">${k?`<span class="tag" style="background:${k.f}22;color:${k.f}">${esc(k.n)}</span>`:""}
        ${n.archiv?`<span class="tag tag-gold">Archiv</span>`:""}
