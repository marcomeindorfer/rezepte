/* Holt bei jeder aktiven Quelle den Feed und – einmal am Tag – zusätzlich das
   Archiv aus der Sitemap. Läuft still: Wer die Ansicht öffnet, sieht sofort den
   letzten Stand und bekommt den neuen nachgereicht. */
async function feedsHolen(still=false){
  if(!cfg.leser){ if(!still) alert("Dafür braucht es den Rezept-Leser unter Mehr."); return; }
  if(feedStand.laden) return;
  if(!quellen()) quellenStarten();
  feedStand={...feedStand,laden:true};
  if(!still) render();
  const aktive=Object.values(S.quellen||{}).filter(q=>q.an);
  const alle=[], fehler=[];
  await Promise.all(aktive.map(async q=>{
    try{
      const res=await fetch(cfg.leser.replace(/\/$/,"")+"/feed?archiv=1&url="+encodeURIComponent(q.u));
      const d=await res.json();
      if(d.eintraege&&d.eintraege.length){
        d.eintraege.forEach(e=>alle.push({...e,art:e.art||"neu",quelle:q.n}));
      } else fehler.push(q.n);
    }catch(e){ fehler.push(q.n); }
  }));
  /* Doppelte zusammenführen, zweifach: erst über die Adresse (dieselbe Seite mit
     und ohne Schrägstrich am Ende), dann über den Titel. Dasselbe Gericht steht
     durchaus bei zwei Blogs – für einen Vorschlag reicht es einmal, und fünf
     gleiche Karten untereinander sehen nach einem Fehler aus. */
  const gesehen=new Set(), titel=new Set(), sauber=[];
  alle.sort((a,b)=>(b.datum||0)-(a.datum||0)).forEach(e=>{
    const k=String(e.link||"").replace(/[?#].*$/,"").replace(/\/$/,"").toLowerCase();
    const tk=String(e.titel||"").toLowerCase().replace(/[^a-zäöüß0-9]/g,"");
    if(!k||gesehen.has(k)||(tk&&titel.has(tk))) return;
    gesehen.add(k); if(tk) titel.add(tk); sauber.push(e);
  });
  feedStand={laden:false,eintraege:sauber.slice(0,NETZ_MAX),fehler,geholt:Date.now()};
  netzSchreiben();
  render();
}
/* Beim Öffnen der Ansicht: liegt der letzte Abruf länger als zwölf Stunden
   zurück, wird im Hintergrund nachgeladen. Der alte Stand bleibt derweil stehen. */
function netzPruefen(){
  if(!cfg.leser||feedStand.laden||!netzAlt()) return;
  feedsHolen(true);
}
/* Aus dem Archiv werden nicht alle gezeigt, sondern eine Handvoll – jeden Tag
   eine andere. Der Tag ist der Zufallsschlüssel: Die Auswahl bleibt stabil,
   solange man in der App hin und her wechselt, und ist morgen eine neue. */
function archivAuswahl(n=6){
  const pool=feedStand.eintraege.filter(e=>e.art==="archiv"&&!feedSchonDa(e.link));
  if(!pool.length) return [];
  const tag=Math.floor(Date.now()/86400000)+archivVersatz;
  const bewertet=pool.map((e,i)=>({e,r:mischWert(tag,e.link||String(i))}));
  bewertet.sort((a,b)=>a.r-b.r);
  /* Zwei Blogs führen durchaus dasselbe Gericht. In einer Auswahl von sechs
     Karten sähe derselbe Titel zweimal nach einem Fehler aus. */
  const titel=new Set(), raus=[];
  for(const {e} of bewertet){
    const k=String(e.titel||"").toLowerCase().replace(/[^a-zäöüß0-9]/g,"");
    if(k&&titel.has(k)) continue;
    titel.add(k); raus.push(e);
    if(raus.length>=n) break;
  }
  return raus;
}
/* Kleiner, stabiler Streuwert aus Tag und Adresse – kein Zufall, der bei jedem
   Neuzeichnen andere Karten zeigt. */
function mischWert(tag,text){
  let h=tag*2654435761%4294967296;
  for(let i=0;i<text.length;i++){ h=(h^text.charCodeAt(i))*16777619%4294967296; }
  return h;
}
const netzNeu=()=>feedStand.eintraege.filter(e=>e.art!=="archiv");

const feedSchonDa=link=>RZ().some(r=>r.q&&r.q.replace(/\/$/,"")===String(link).replace(/\/$/,""));

/* ===== Rezept aus einem Foto ===== */
const TESS_URL="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js";
let tessLaden=null;
function tesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(tessLaden) return tessLaden;
  tessLaden=new Promise((ok,fehler)=>{
    const s=document.createElement("script");
    s.src=TESS_URL;
    s.onload=()=>window.Tesseract?ok(window.Tesseract):fehler(new Error("nicht geladen"));
    s.onerror=()=>fehler(new Error("nicht erreichbar"));
    document.head.appendChild(s);
  });
  return tessLaden;
}
/* Diese Funktion fehlte – dadurch brach die Texterkennung immer mit einem Fehler ab.
   Verkleinern beschleunigt tesseract erheblich und spart Arbeitsspeicher. */
function bildVerkleinern(datei,maxKante,guete){
  return new Promise((ok,fehler)=>{
    const leser=new FileReader();
    leser.onerror=()=>fehler(new Error("Datei nicht lesbar"));
    leser.onload=()=>{
      const bild=new Image();
      bild.onerror=()=>fehler(new Error("Bildformat nicht lesbar"));
      bild.onload=()=>{
        const gr=Math.max(bild.width,bild.height)||1;
        const f=Math.min(1,(maxKante||1800)/gr);
        const c=document.createElement("canvas");
        c.width=Math.round(bild.width*f); c.height=Math.round(bild.height*f);
        const ktx=c.getContext("2d");
        ktx.fillStyle="#fff"; ktx.fillRect(0,0,c.width,c.height);
        ktx.drawImage(bild,0,0,c.width,c.height);
        try{ ok(c.toDataURL("image/jpeg",guete||0.9)); }
        catch(e){ ok(leser.result); }
      };
      bild.src=leser.result;
    };
    leser.readAsDataURL(datei);
  });
}
/* Zwei Wege, weil capture="environment" die Dateiauswahl sperren würde:
   ein Eingabefeld für die Kamera, eines für Galerie und Dateien. */
function fotoAufnehmen(){ const f=document.getElementById("fotokamera"); if(f&&f.click){f.value="";f.click();} }
function fotoWaehlen(){ const f=document.getElementById("fotowahl"); if(f&&f.click){f.value="";f.click();} }
async function fotoLesen(datei){
  if(!datei) return;
  if(!nf||!nf.ma) nf={id:null,n:"",q:"",k:"veg",typ:"haupt",ma:["a"],min:30,p:20,zText:"",sText:"",why:"",port:1,status:"",pAuto:true,minAuto:true};
  nf.status="Texterkennung wird geladen …"; formZeigen(true);
  let T;
  try{ T=await tesseract(); }
  catch(e){ nf.status="Die Texterkennung ließ sich nicht laden. Dafür braucht es eine Internetverbindung."; formZeigen(true); return; }
  try{
    nf.status="Bild wird gelesen, das dauert einen Moment …"; formZeigen(true);
    /* Verkleinern beschleunigt die Erkennung deutlich, ohne ihr zu schaden */
    const bild=await bildVerkleinern(datei,1800,0.9);
    const {data}=await T.recognize(bild,"deu");
    const text=(data&&data.text||"").replace(/\u00a0/g," ").trim();
    if(!text||text.length<25){ nf.status="Auf dem Bild war kaum Text zu erkennen. Bei Kochbuchseiten hilft gerades Halten, viel Licht und ein Ausschnitt, der nur den Text zeigt."; formZeigen(true); return; }
    nf.status=""; nf.rohtext=text;
    fotoUebernehmen(text);
  }catch(e){
    nf.status="Das Bild ließ sich nicht auswerten: "+(e&&e.message?e.message:"unbekannt");
    formZeigen(true);
  }
}

   so lässt sich ein Grundrezept bearbeiten, ohne das Original zu verlieren.
   Gelöschtes wird über die Grabsteine ausgeblendet, auch wenn ein Abgleich es zurückbringt. */
/* Schnellgerichte sind technisch Rezepte – damit funktionieren Einkaufsliste,
   Kochmodus und Wochenabschluss unverändert. Aus der Sammlung bleiben sie aber
   heraus: sie sollen weder in der Rezeptliste noch im Vorschlag oder im

const istSchnell=r=>!!r&&r.src==="schnell";

  const tot=S.geloescht||{};
  const eig=Object.values(S.eigene||{}).map(rezeptNorm).filter(Boolean).filter(r=>!tot[r.id]);
  const ueber=new Set(eig.map(r=>r.id));
  return REZEPTE.filter(r=>!tot[r.id]&&!ueber.has(r.id)).concat(eig);
};
const RZ=()=>RZ_ALLE().filter(r=>!istSchnell(r));
const SCHNELL=()=>RZ_ALLE().filter(istSchnell)

/* Bringt Stände älterer Versionen auf das aktuelle Format, ohne etwas zu verlieren */
function migrieren(){
  let neu=false;
  ["spaeter","archiv","geprueft","eigene","quellen","extra","listen","ideenWeg"].forEach(f=>{if(!S[f]){S[f]={};neu=true;}});
  if(!S.angebote||Array.isArray(S.angebote)){S.angebote={};neu=true;}
  /* Alter Stand: eine flache Liste ohne Zeitraum wird zu einem Prospekt */
  if(S.angebote&&Array.isArray(S.angebote.items)){
    const alt=S.angebote;
    S.angebote={};
    if(alt.items.length) S.angebote["p"+(alt.bis||"alt")]={von:"",bis:alt.bis||"",items:alt.items,quelle:"früherer Stand",geholt:alt.geholt||Date.now()};
    neu=true;
  }
  if(S.abgelehnt&&Object.keys(S.abgelehnt).length){
    Object.keys(S.abgelehnt).forEach(id=>{if(!S.archiv[id])S.archiv[id]=Date.now();});
    delete S.abgelehnt; neu=true;
  }
  /* Sammlung: aus true wird ein Zeitstempel. Bestand wird zurückdatiert,
     damit der Aufräum-Stapel nicht erst in zwei Monaten anspringt. */
  /* Drei Altformate: "2-a" (bis 1.5), "0/2-a" und die daraus verschachtelte
     Form {"0":{"2-a":…}} (1.6). Alle werden zu "w0-2-a". */
  Object.entries(S.plan||{}).forEach(([k,v])=>{
    if(k.startsWith("w")&&k.split("-").length===3) return;
    if(v&&typeof v==="object"&&!v.r){
      Object.entries(v).forEach(([k2,v2])=>{if(v2&&v2.r)S.plan["w"+k+"-"+k2]=v2;});
      delete S.plan[k]; neu=true; return;
    }
    const rein=k.replace("/","-");
    S.plan[/^\d+-/.test(rein)&&rein.split("-").length===3?"w"+rein:"w0-"+rein]=v;
    delete S.plan[k]; neu=true;
  });
  Object.entries(S.sammlung||{}).forEach(([id,v])=>{
    if(v==null){delete S.sammlung[id];neu=true;return;}   /* nie wieder aus null einen Zeitstempel machen */
    if(typeof v!=="number"){S.sammlung[id]=Date.now()-FRIST.alt*TAG;neu=true;}
  });
  /* Fehlt eine Abteilung im Laufplan, fielen alle Posten daraus lautlos aus der
     Ansicht – mitgezählt wurden sie trotzdem, die Liste wurde also nie fertig. */
  if(!Array.isArray(S.route)||!S.route.length){S.route=[...ABT_STD];neu=true;}
  ABT_STD.forEach(k=>{ if(!S.route.includes(k)){S.route.push(k);neu=true;} });
  if(S.route.some(k=>!ABT[k])){S.route=S.route.filter(k=>ABT[k]);neu=true;}
  if(!S.geloescht){S.geloescht={};neu=true;}
  if(!S.weg||typeof S.weg!=="object"){S.weg={};neu=true;}
  if(grabsteineAufraeumen())neu=true;
  Object.keys(S.geloescht).forEach(id=>{ if(S.sammlung[id]){delete S.sammlung[id];neu=true;} });
  if(neu){schreibenLokal();if(basis()){senden("plan",S.plan);senden("sammlung",S.sammlung);senden("archiv",S.archiv);senden("spaeter",S.spaeter);senden("geprueft",S.geprueft);}}
}

/* Jede Änderung geht durch die Warteschlange. Dadurch bleibt die Reihenfolge
   erhalten, ein Abbruch mittendrin verliert nichts, und je Pfad wartet nur der
   jüngste Stand – sonst stauen sich beim Abhaken hunderte überholte Fassungen. */
function einreihen(pfad,wert){
  if(!pfad){ queue=[{pfad:"",wert}]; return; }   /* Gesamtstand ersetzt alles Wartende */
  const i=queue.findIndex(q=>q.pfad===pfad);
  if(i>=0)queue.splice(i,1);
  queue.push({pfad,wert});
  if(queue.length>800)queue.splice(0,queue.length-800);
}
async function schicken(pfad,wert){
  const res=await fetch(adresse(pfad),{method:wert===null?"DELETE":"PUT",
    headers:{"Content-Type":"application/json"},body:wert===null?undefined:JSON.stringify(wert)});
  if(res.status===401||res.status===403){const e=new Error("verweigert");e.dauerhaft="verweigert";throw e;}
  if(res.status===404){const e=new Error("fehlt");e.dauerhaft="fehlt";throw e;}
  if(!res.ok) throw new Error("HTTP "+res.status);
  return true;
}
let flussLaeuft=false;
async function flush(){
  if(!basis()||flussLaeuft||!queue.length||dauerfehler()) return;
  flussLaeuft=true;
  try{
    while(queue.length){
      const eintrag=queue[0];
      try{
        await schicken(eintrag.pfad,eintrag.wert);
      }catch(e){
        if(e&&e.dauerhaft){ zustandSetzen(e.dauerhaft); break; }
        if(syncState==="live") zustandSetzen("wartet");
        break;                                   /* Eintrag bleibt vorn liegen */
      }
      queue.shift();                             /* erst nach bestätigtem Erfolg entfernen */
      schreibenLokal();
      if(syncState!=="live"&&syncState!=="verbindet") zustandSetzen("live");
    }
  } finally { flussLaeuft=false; schreibenLokal(); nav(); }
}
function senden(pfad,wert){
  if(!basis()) return false;
  einreihen(pfad,wert); schreibenLokal(); flush();
  return true;
}
/* Liste und Plan bearbeiten beide Geräte gleichzeitig. Ohne Zeitstempel kann das
   Zusammenführen die zwei Stände nicht unterscheiden und nimmt immer den fernen –
   im Markt Abgehaktes stünde danach wieder offen da. */
const GESTEMPELT=new Set(["liste","plan","vorrat","extra","listen","quellen","angebote"]);
/* Rezepte haben ihre Grabsteine (S.geloescht) seit jeher. Alles andere hatte keine –
   und ohne sie macht das Zusammenführen jede Löschung der anderen Person rückgängig:
   Ein Eintrag, den nur noch diese Seite kennt, sieht genauso aus, ob ihn die eigene
   Seite gerade angelegt oder die andere Seite gerade gelöscht hat. Bisher wurde er
   immer behalten – und beim anschließenden Hochladen war die Löschung auch drüben weg. */
/* Kürzer als bei Rezepten: ein Grabstein muss nur überleben, bis das andere Gerät
   das nächste Mal online ist. Sonst wächst die Sammlung mit jedem Listen-Neubau. */
const WEG_FRIST=60;
const WEG_FELDER=new Set(["plan","liste","vorrat","listen","extra","angebote","quellen","archiv","spaeter","geprueft","sammlung","verlauf"]);
const wegSchluessel=(feld,id)=>feld+"__"+id;
function grabstein(feld,id){
  const k=wegSchluessel(feld,id);
  setPfad(S,"weg/"+k,Date.now()); senden("weg/"+k,S.weg[k]);
}
function grabsteinWeg(feld,id){
  const k=wegSchluessel(feld,id);
  if(!S.weg||S.weg[k]===undefined) return;
  setPfad(S,"weg/"+k,null); senden("weg/"+k,null);
}
/* Legt oder löst die Grabsteine zu einem Schreibvorgang */
function grabsteinePflegen(pfad,wert){
  const p=String(pfad).split("/").filter(Boolean);
  if(p.length===2&&WEG_FELDER.has(p[0])){
    if(wert===null) grabstein(p[0],p[1]); else grabsteinWeg(p[0],p[1]);
    return;
  }
  /* Ganze Sammlung ersetzt – etwa beim Neubau der Einkaufsliste oder beim Leeren
     der Woche. Was darin fehlt, ist gelöscht und muss auch drüben verschwinden. */
  if(p.length===1&&WEG_FELDER.has(p[0])&&wert&&typeof wert==="object"&&!Array.isArray(wert)){
    const alt=S[p[0]]||{};
    Object.keys(alt).forEach(k=>{ if(!(k in wert)) grabstein(p[0],k); });
    Object.keys(wert).forEach(k=>grabsteinWeg(p[0],k));
  }
}
function stempeln(pfad,wert){
  if(!wert||typeof wert!=="object"||Array.isArray(wert)) return wert;
  const p=String(pfad).split("/").filter(Boolean);
  return (p.length===2&&GESTEMPELT.has(p[0])) ? {...wert,ts:Date.now()} : wert;
}
function mut(pfad,wert,neuZeichnen=true){
  wert=stempeln(pfad,wert);
  grabsteinePflegen(pfad,wert);
  setPfad(S,pfad,wert); schreibenLokal(); senden(pfad,wert);
  if(neuZeichnen) render();
}
/* Zwei Stände treffen aufeinander: pro Eintrag gewinnt der jüngere,
   Einzelstücke bleiben auf beiden Seiten erhalten. */
const stempel=v=>{
  /* In sammlung, archiv, spaeter und geprueft ist der Wert selbst der Zeitpunkt */
  if(typeof v==="number")return v;
  if(!v||typeof v!=="object")return 0;
  return v.geaendert||v.ts||v.erstellt||0;
};
/* Alle Sammlungen werden eintragsweise gemischt. Die Liste wird aus leer()
   abgeleitet, damit ein neues Feld nie wieder vergessen wird. */
const SAMMELFELDER=()=>Object.entries(leer())
  .filter(([k,v])=>v&&typeof v==="object"&&!Array.isArray(v))
  .map(([k])=>k);
/* Was noch in der Warteschlange liegt, ist der jüngste Wille dieses Geräts –
   nur eben noch nicht angekommen. Ohne diesen Schritt löscht ein Fernstand, der
   während des Wiederverbindens eintrifft, genau die Änderungen, die offline
   entstanden sind: zwölf abgehakte Posten, und der Laufplan ist wieder voll. */
function wartendeAnwenden(ziel){
  queue.forEach(q=>{ if(q.pfad) setPfad(ziel,q.pfad,q.wert); });
  return queue.filter(q=>q.pfad).length;
}
function zusammenfuehren(fern){
  const vorher=JSON.stringify(S);
  const neu={...leer()};
  /* Grabsteine beider Seiten zuerst vereinigen – sie entscheiden gleich mit */
  const weg={...((fern&&fern.weg)||{}), ...(S.weg||{})};
  SAMMELFELDER().forEach(f=>{
    const lokal=S[f]||{}, entfernt=(fern&&fern[f])||{};
    const raus={...entfernt};
    const totSeit=k=>(f==="weg"?0:(weg[wegSchluessel(f,k)]||0));
    Object.entries(lokal).forEach(([k,v])=>{
      const r=entfernt[k];
      if(r===undefined){
        /* Nur noch hier: entweder gerade selbst angelegt oder von der anderen Seite
           gelöscht. Der Grabstein sagt, was von beidem – und was jünger ist. */
        if(totSeit(k)>=stempel(v)&&totSeit(k)>0) return;
        raus[k]=v; return;
      }
      if(v&&r&&typeof v==="object"&&typeof r==="object"&&stempel(v)>stempel(r))raus[k]=v;
    });
    /* Und andersherum: was diese Seite gelöscht hat, die andere aber noch kennt */
    Object.keys(raus).forEach(k=>{
      if(lokal[k]!==undefined) return;
      if(totSeit(k)>0&&totSeit(k)>=stempel(raus[k])) delete raus[k];
    });
    neu[f]=raus;
  });
  /* Ein Gerät mit altem Stand bringt Gelöschtes sonst zurück: Grabsteine räumen hinterher auf */
  const tot=neu.geloescht||{};
  Object.keys(tot).forEach(id=>{ delete neu.sammlung[id]; delete neu.eigene[id]; });
  /* Sammlung und Archiv schließen einander aus. Nach dem Mischen kann ein Rezept in
     beiden stehen – dann entscheidet der jüngere Eintrag, sonst taucht Entferntes wieder auf. */
  Object.keys(neu.archiv||{}).forEach(id=>{
    if(neu.sammlung[id]===undefined) return;
    if((+neu.archiv[id]||0)>=(+neu.sammlung[id]||0)) delete neu.sammlung[id];
    else delete neu.archiv[id];
  });
  neu.route=(fern&&fern.route)||S.route;
  neu.still=fern&&fern.still!==undefined?fern.still:S.still;
  neu.portionStd=(fern&&fern.portionStd)||S.portionStd||2;
  /* Rein örtliche Notizen zur Einkaufsliste – sie stehen nicht in leer() und wären
     nach jedem Zusammenführen verschwunden, samt dem Hinweis, was der Vorrat deckt. */
  neu.listeInfo=S.listeInfo;
  wartendeAnwenden(neu);
  S=neu; schreibenLokal();
  const kern=x=>JSON.stringify(SAMMELFELDER().map(f=>(x&&x[f])||{}));
  if(kern(fern)!==kern(neu)) senden("",S);
  if(vorher!==JSON.stringify(S)) render();
}
let erstesPut=true, wiederTimer=null, versuche=0;
function verbinden(){
  if(es){try{es.close();}catch(e){} es=null;}
  clearTimeout(wiederTimer);
  if(!basis()){zustandSetzen("lokal");return;}
  zustandSetzen("verbindet"); erstesPut=true;
  try{
    es=new EventSource(adresse(""));
    /* Was aus der Leitung kommt, ist nicht garantiert wohlgeformt – ein einziges
       kaputtes Ereignis darf die Verbindung nicht lahmlegen. */
    es.addEventListener("put",e=>{
      let d; try{ d=JSON.parse(e.data); }catch(err){ return; }
      if(!d||typeof d!=="object") return;
      if(d.path==="/"||d.path===""){erstesPut=false;zusammenfuehren(d.data);return;}
      setPfad(S,d.path,d.data);schreibenLokal();
      /* Einkauf zu zweit: hakt die andere Person etwas ab, soll man das merken,
         statt zweimal zum selben Regal zu laufen. */
      if(!erstesPut&&tab==="einkauf"&&/^\/?liste\//.test(d.path)&&d.data&&d.data.on) fremdAbgehakt(d.data.n);
      render();
    });
    es.addEventListener("patch",e=>{
      let d; try{ d=JSON.parse(e.data); }catch(err){ return; }
      if(!d||typeof d!=="object") return;
      Object.entries(d.data||{}).forEach(([k,v])=>setPfad(S,(d.path==="/"?"":d.path)+"/"+k,v));
      schreibenLokal();render();});
    es.addEventListener("keep-alive",()=>zustandSetzen("live"));
    /* Firebase meldet abgelehnte Regeln über eigene Ereignisse, nicht über einen Fehler */
    es.addEventListener("cancel",()=>{zustandSetzen("verweigert");try{es.close();}catch(err){}es=null;});
    es.addEventListener("auth_revoked",()=>{zustandSetzen("verweigert");try{es.close();}catch(err){}es=null;});
    es.onopen=()=>{versuche=0;zustandSetzen("live");flush();};
    es.onerror=()=>{if(dauerfehler())return;zustandSetzen("getrennt");neuVerbinden();};
  }catch(e){zustandSetzen("getrennt");neuVerbinden();}
}
function neuVerbinden(){
  clearTimeout(wiederTimer);
  if(dauerfehler())return;
  const wartezeit=Math.min(30000,1000*Math.pow(2,Math.min(versuche++,5)));
  wiederTimer=setTimeout(()=>{if(basis()&&syncState!=="live")verbinden();},wartezeit);
}
function syncPruefen(){
  if(!basis()||dauerfehler())return;
  flush();
  if(syncState!=="live"&&syncState!=="verbindet"){versuche=0;verbinden();}
}
addEventListener("online",()=>{versuche=0;syncPruefen();});
addEventListener("offline",()=>{if(syncState==="live"){syncState="getrennt";nav();}});
if(typeof document!=="undefined"&&document.addEventListener){
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncPruefen();});
  setInterval(syncPruefen,30000);
}

/* ============ Wochenplan ============ */
let planWoche=0, erledigtWeg=false, einkaufAnsicht="woche";   /* 0 = diese Woche, 1 = nächste, 2 = übernächste */
const slots=(w=planWoche)=>{const a=[];for(let d=0;d<7;d++)for(const mk of["f","m","a"])a.push("w"+w+"-"+d+"-"+mk);return a;};
const slotTag=k=>+k.split("-")[1];
const slotMahl=k=>k.split("-")[2];

function planStat(w=planWoche){

}
/* ---------- Was koche ich jetzt? ----------

/* ---------- Ein Tag im Plan ----------
   Die sieben Tageskarten standen bis 3.7 alle offen: 21 Zeilen mit Portionswahl

let tagOffen={};
function tagUmschalten(k){ tagOffen[k]=!tagOffen[k]; render(); }

/* Hinweise, aus denen sich etwas tun lässt. Alles Übrige steht unter „Weiteres“ –
   ein Absatz, der jede Woche gleich dasteht, ist keine Nachricht. */
function wochenHinweise(){
  const schnitt=proteinSchnitt(planWoche);
  const offen=khOffen(planWoche);
  const {belegt}=planStat();
  const raus=[];
  if(schnitt&&schnitt<PROTEINZIEL) raus.push({warn:true,t:`Ø ${schnitt} g Protein am Tag – Ziel sind ${PROTEINZIEL} g.`});
  if(belegt&&offen.length) raus.push({t:`Noch keine Beilage aus: ${offen.map(k=>KH[k]).join(", ")}.`});
  if(wocheHatAngebote(planWoche)){
    const bio=bioAngebote(planWoche).length;
    raus.push({t:`Angebote für ${kwPlus(planWoche)} liegen vor – passende Gerichte sind gekennzeichnet.`
      +(bio?` Davon ${bio} in Bio.`:"")});
  }
  return raus;
}
function vWoche(){
  const {z,belegt}=planStat();

  const knapp=schnitt&&schnitt<PROTEINZIEL;
  const ex=extraListe(planWoche);
  const hinweise=wochenHinweise();
  /* Der Wochenumschalter sitzt am Plan, nicht über der Seite: „Heute“ betrifft
     immer die laufende Woche und wandert sonst mit weg. */
  const wahl=`<div class="toggle" style="width:100%">
    ${[0,1,2].map(w=>`<button style="flex:1" aria-pressed="${planWoche===w}" onclick="planWoche=${w};render()">${["Diese","Nächste","Übernächste"][w]}<br><span style="font-family:var(--mono);font-size:10px;opacity:.75">${kwPlus(w)}</span></button>`).join("")}</div>`;

  const kopf=`<div class="card">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <b style="font-size:17px">${belegt} von 21 geplant</b>

    ${knapp?`<p class="note" style="color:var(--sun);margin-top:8px">Ø ${schnitt} g Protein am Tag – Ziel sind ${PROTEINZIEL} g.
      <button class="btn btn-s" style="margin-left:6px" onclick="proteinSnack()">Snack ergänzen</button></p>`:""}
    <div class="row-btns" style="margin-top:12px;border-top:0.5px solid var(--line);padding-top:12px">
      <button class="btn btn-s${belegt?"":" btn-primary"}" onclick="autoWoche()">Woche vorschlagen</button>
      ${belegt?`<button class="btn btn-s" onclick="wocheAbschliessen()">Abschließen</button>`:""}
      <button class="btn btn-s" onclick="wocheMehr()">Weiteres${hinweise.length-(knapp?1:0)>0?" · "+(hinweise.length-(knapp?1:0)):""} …</button>
    </div></div>`;

  return `${heuteKarte()}${kopf}
    <div class="sect"><h2>Plan</h2>${belegt?`<button class="btn btn-s" onclick="alleTage(${[0,1,2,3,4,5,6].every(d=>tagOffen["w"+planWoche+"-"+d])?false:true})">${[0,1,2,3,4,5,6].every(d=>tagOffen["w"+planWoche+"-"+d])?"Alle zuklappen":"Alle aufklappen"}</button>`:""}</div>
    ${wahl}
    <div style="margin-top:12px">${TAGE.map((tn,d)=>tagZeile(d)).join("")}</div>
    ${ex.length?`<div class="sect"><h2>Zusätzlich</h2><button class="btn btn-s" onclick="wocheMehr()">Ändern</button></div>
      <p class="note" style="padding:0 3px">${ex.map(e=>{const r=R(e.r);return r?esc(r.n):"";}).filter(Boolean).join(" · ")}</p>`:""}
    ${belegt||ex.length?`<button class="btn btn-primary btn-wide" style="margin-top:14px" onclick="vorratFrage()">Einkaufsliste für ${kwPlus(planWoche)} erstellen</button>
      <p class="note" style="margin-top:9px">Vorher fragt die App kurz ab, was vom Vorrat noch da ist.</p>`:""}`;
}

/* Wie beim Einkauf: was man selten braucht, steht nicht dauerhaft über dem Plan.
   Seit 3.8 nimmt das Blatt auch auf, was vorher unter dem Plan hing – Hinweise,
   zusätzliche Gerichte und der Rückblick. Auf der Seite selbst bleibt damit nur,

function wocheMehr(){ openSheet(wocheMehrKoerper()); }
function wocheMehrZeigen(){ openSheet(wocheMehrKoerper(),true); }
function wocheMehrKoerper(){
  const fruehstueckDa=[...Array(7)].some((_,d)=>{const e=S.plan["w"+planWoche+"-"+d+"-f"];return e&&R(e.r);});
  const {z,belegt}=planStat();

  const ex=extraListe(planWoche);
  const hist=Object.entries(S.verlauf||{}).sort((a,b)=>b[0]-a[0]).slice(0,8)
    .map(([,v])=>{const r=R(v.r);return r?`<div class="meal"><div class="meal-main" onclick="closeSheet();detail('${r.id}')"><div class="meal-name">${esc(r.n)}</div><div class="meal-sub">${v.kw} · ${KH[khVon(r)]}</div></div><button class="btn btn-s" onclick="closeSheet();einplanen('${r.id}')">Nochmal</button></div>`:"";}).join("");
  return `<div class="grab"></div>
    <h2 style="font-size:20px">${kwPlus(planWoche)}</h2>

    ${hinweise.length?`<div class="sect"><h2>Hinweise</h2></div>
      ${hinweise.map(h=>`<p class="note"${h.warn?' style="color:var(--sun)"':""}>${h.t}</p>`).join("")}`:""}
    <div class="sect"><h2>Zusätzlich</h2><button class="btn btn-s" onclick="closeSheet();extraWaehlen()">Hinzufügen</button></div>
    ${ex.length?ex.map(e=>{const r=R(e.r);if(!r)return "";
      return `<div class="slot" style="background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:7px">
        <span class="slot-l">${TYP[typVon(r)].slice(0,6)}</span>
        <button class="pick" onclick="closeSheet();detail('${r.id}')"><span class="slot-m"><span class="slot-n">${esc(r.n)}</span>
          <span class="slot-s">${e.p===0?"Reste, nichts einkaufen":`${r.p} g Protein je Portion`}</span></span></button>
        <span class="mini"><button onclick="extraPortion('${e.id}',-1);wocheMehrZeigen()">−</button><b>${e.p===0?"R":(e.p||2)}</b><button onclick="extraPortion('${e.id}',1);wocheMehrZeigen()">+</button></span>
        <button class="btn btn-ghost btn-s" onclick="mut('extra/${e.id}',null,false);wocheMehrZeigen()" aria-label="entfernen">${IKON.kreuz}</button></div>`;}).join("")
      :`<p class="note">Nichts zusätzlich geplant. Hier landen Dinge außerhalb des Wochenplans – zum Grillen mitbringen, Snacks, ein Kuchen.</p>`}
    ${fruehstueckDa?`<div class="sect"><h2>Abkürzung</h2></div>
      <button class="btn btn-wide" onclick="closeSheet();fruehstueckUebernehmen()">Frühstück für alle Tage übernehmen</button>
      <p class="note" style="margin-top:6px">Setzt das Frühstück des ersten belegten Tages auf alle sieben Tage.</p>`:""}
    ${hist?`<div class="sect"><h2>Zuletzt gekocht</h2></div>${hist}`:""}
    <div class="sect"><h2>Von vorn</h2></div>
    <button class="btn btn-wide" onclick="if(confirm('Den Plan dieser Woche leeren? Die Einkaufsliste bleibt stehen.')){closeSheet();leereWoche()}">Plan dieser Woche leeren</button>
    <button class="btn btn-wide btn-ghost" style="margin-top:14px" onclick="closeSheet()">Schließen</button>`;
}
function leereWoche(){const p={...S.plan};slots().forEach(k=>delete p[k]);mut("plan",p);}
/* 0 Portionen heißt: wird von Resten gegessen und taucht nicht auf der Einkaufsliste auf */
function port(k,d){const e=S.plan[k];if(!e)return;mut("plan/"+k,{...e,p:Math.max(0,(e.p===0?0:(e.p||2))+d)});}
/* Bis Version 3.1 wanderten beim Abschließen alle 21 Gerichte in den Verlauf –
   auch die Tage, an denen es dann doch Pizza gab. Der Verlauf steuert aber die
   Bewertung („kürzlich gekocht": −2) und die Liste „Zuletzt gekocht". Damit
   rechnete der Vorschlag mit Gerichten, die nie auf dem Tisch standen. */
let abschlussAus={};
function wocheAbschliessen(){
  abschlussAus={};
  /* Restetage sind keine Kochtage – die sind schon vorher abgehakt worden */
  slots().forEach(k=>{ const e=S.plan[k]; if(e&&e.p===0) abschlussAus[k]=true; });
  openSheet(abschlussKoerper());
}
function abschlussKoerper(){
  const eintraege=slots().map(k=>({k,e:S.plan[k],r:S.plan[k]&&R(S.plan[k].r)})).filter(x=>x.r);
  const an=eintraege.filter(x=>!abschlussAus[x.k]).length;
  return `<div class="grab"></div><h2 style="font-size:20px">Woche abschließen</h2>
    <p class="note" style="margin:7px 0 14px">Was habt ihr wirklich gekocht? Nur das Angehakte kommt in den Verlauf und beeinflusst künftige Vorschläge. Der Plan wird danach geleert.</p>
    <div class="items">${eintraege.map(({k,e,r})=>{
      const d=slotTag(k), mk=slotMahl(k);
      return `<div class="itemrow"><button class="item ${abschlussAus[k]?"":"on"}" onclick="abschlussTick('${k}')">
        <span class="box">${IKON.haken}</span>
        <span class="it-n"><b style="font-weight:600">${esc(r.n)}</b><br>
          <span class="mini">${TAGE[d].slice(0,2)} · ${MAHL[mk]}${e.p===0?" · Restetag":""}</span></span></button></div>`;}).join("")}</div>
    <div class="row-btns" style="margin-top:14px">
      <button class="btn btn-s" onclick="abschlussAlle(true)">Alle</button>
      <button class="btn btn-s" onclick="abschlussAlle(false)">Keins</button></div>
    <button class="btn btn-primary btn-wide" style="margin-top:10px" onclick="wocheAbschliessenJetzt()">${an} Gericht${an===1?"":"e"} eintragen und Plan leeren</button>
    <button class="btn btn-wide btn-ghost" style="margin-top:6px" onclick="closeSheet()">Abbrechen</button>`;
}
function abschlussTick(k){ abschlussAus[k]=!abschlussAus[k]; openSheet(abschlussKoerper(),true); }
function abschlussAlle(an){
  abschlussAus={};
  if(!an) slots().forEach(k=>{ if(S.plan[k]) abschlussAus[k]=true; });
  openSheet(abschlussKoerper(),true);
}
function wocheAbschliessenJetzt(){
  const w=kwPlus(planWoche),v={...S.verlauf},p={...S.plan};
  let n=0;
  slots().forEach((k,i)=>{
    if(!p[k]) return;
    if(!abschlussAus[k]){ v[Date.now()+i]={r:p[k].r,kw:w}; n++; }
    delete p[k];
  });
  const keys=Object.keys(v).sort((a,b)=>b-a).slice(0,80);
  mut("verlauf",Object.fromEntries(keys.map(k=>[k,v[k]])),false);
  mut("plan",p);
  closeSheet();
  schnellAufraeumen();
  const kandidat=schnellVorschlag();
  if(kandidat){
    meldung(`„${kandidat.n}" habt ihr schon ${malGekocht(kandidat.id)}× gekocht.`,
      "Als Rezept aufnehmen",()=>schnellAufnehmen(kandidat.id));
  } else {
    meldung(n?n+" Gericht"+(n===1?"":"e")+" im Verlauf vermerkt.":"Nichts vermerkt – der Plan ist geleert.");
  }
}
/* Der Eingabeblock für ein Schnellgericht – gleich im Platz-Wähler und bei

/* Aus dem Platz-Wähler heraus: anlegen und gleich in den Platz setzen */
function schnellInPlatz(k,mk){

/* Aus den Zusatzgerichten heraus */
function schnellAlsExtra(){

}

function waehle(k,mk){
  let q="";
  const treffer=()=>{
    const m=monat(), benutzt=new Set(slots().map(x=>S.plan[x]&&S.plan[x].r).filter(Boolean));
    const passt=r=>istTagesgericht(r)&&r.ma.includes(mk);
    let pool=RZ().filter(r=>passt(r)&&(S.sammlung[r.id]||false));
    if(pool.length<4)pool=RZ().filter(passt);
    if(q)pool=pool.filter(r=>r.n.toLowerCase().includes(q.toLowerCase()));
    const fehlt=new Set(khOffen(planWoche,k));
    /* Ganz oben steht, was der Woche noch fehlt, danach Angebote, dann Saison */
    const rang=r=>(fehlt.has(khVon(r))?0:1)*8 + (imAngebot(r).length?0:1)*4 + (benutzt.has(r.id)?2:0) + (r.m.includes(m)?0:1);
    pool=pool.slice().sort((a,b)=>rang(a)-rang(b)||a.n.localeCompare(b.n));
    if(!pool.length)return `<div class="empty"><b>Nichts gefunden</b>Andere Schreibweise probieren.</div>`;
    return pool.map(r=>{const [lbl,tag,,kk]=KIND[r.k];
      return `<div class="rec ${kk}" onclick="setSlot('${k}','${r.id}')"><div class="rec-b">
        <div class="rec-t">${esc(r.n)}</div>
        <div class="rec-m">${r.min} MIN${benutzt.has(r.id)?" · SCHON GEPLANT":""}</div>
        <div class="rec-tags"><span class="tag ${tag}">${lbl}</span><span class="pill">${r.p} g Protein</span></div>
      </div><span class="add-b">+</span></div>`;}).join("");
  };
  /* Wie bei der Suche: nur die Trefferliste tauschen, damit die Tastatur offen bleibt */
  window.wq=v=>{q=v;const el=document.getElementById("wtreffer");if(el)el.innerHTML=treffer();};
  window.__schnellHier=()=>schnellInPlatz(k,mk);
  openSheet(`<div class="grab"></div><h2 style="font-size:20px">${MAHL[mk]} · ${TAGE[slotTag(k)]}</h2>
    ${schnellFormular("__schnellHier()","Ohne Zutaten steht das Gericht nur im Plan und erzeugt keine Einkäufe.")}
    <input type="search" placeholder="Suchen" oninput="wq(this.value)" style="margin:12px 0">
    <div id="wtreffer">${treffer()}</div>
    <button class="btn btn-wide btn-ghost" style="margin-top:10px" onclick="closeSheet()">Abbrechen</button>`);
}
function setSlot(k,rid){
  mut("plan/"+k,{r:rid,p:S.portionStd||2});
  /* Schnellgerichte gehören nicht in die Sammlung – sonst stünden sie doch wieder
     unter „Aus eurer Liste". */
  if(!S.sammlung[rid]&&!istSchnell(R(rid))) mut("sammlung/"+rid,Date.now(),false);
  closeSheet();
}

/* ---------- Schnellgerichte ----------
   Für alles, wofür sich ein Rezept nicht lohnt: Name eintippen, Zutaten optional.
   Alles Weitere leitet die App ab – Art aus den Zutaten, Protein und Dauer aus
   den vorhandenen Schätzern. */
const SCHNELL_FRIST=60;   /* Tage, nach denen ein ungenutztes Schnellgericht verschwindet */
function schnellAnlegen(name,zutatenText,mahlzeit){
  const n=String(name||"").trim();
  if(!n) return null;
  const z=parseZutaten(zutatenText||"");
  const id="s"+neueId("");
  const rezept={
    id, n,
    k:artAusZutaten(z,"veg"),
    typ:"haupt",
    ma:[mahlzeit&&MAHL[mahlzeit]?mahlzeit:"a"],
    m:[...ALL],
    min:z.length?dauerSchaetzen(z,[]):10,
    p:proteinSchaetzen(z),
    bl:0, nut:[],
    why:"Schnell eingetragen, ohne vollständiges Rezept.",
    z, s:[],
    src:"schnell", erstellt:Date.now()
  };
  mut("eigene/"+id,rezept,false);
  return id;
}
/* Wie oft wurde ein Gericht laut Verlauf schon gekocht? */
function malGekocht(id){ return Object.values(S.verlauf||{}).filter(v=>v&&v.r===id).length; }
/* Steht es gerade irgendwo? Dann wird es nicht aufgeräumt. */
function schnellInBenutzung(id){
  if(Object.values(S.plan||{}).some(e=>e&&e.r===id)) return true;
  if(Object.values(S.extra||{}).some(e=>e&&e.r===id)) return true;
  if(malGekocht(id)) return true;
  return false;
}
function schnellAufraeumen(){
  const jetzt=Date.now(); let weg=0;
  SCHNELL().forEach(r=>{
    if(jetzt-(r.erstellt||0)<SCHNELL_FRIST*TAG) return;
    if(schnellInBenutzung(r.id)) return;
    grabsteinSetzen(r.id);
    mut("eigene/"+r.id,null,false);
    weg++;
  });
  return weg;
}
/* Was dreimal auf dem Tisch stand, ist offenbar keine Eintagsfliege */
const SCHNELL_SCHWELLE=3;
function schnellWeg(id){
  const r=S.eigene&&S.eigene[id]; if(!r) return;
  const geplant=Object.values(S.plan||{}).filter(e=>e&&e.r===id).length
              + Object.values(S.extra||{}).filter(e=>e&&e.r===id).length;
  const kopie={...r};
  grabsteinSetzen(id);
  mut("eigene/"+id,null);
  meldung(geplant?`„${kopie.n}" gelöscht – steht noch in ${geplant} Feld${geplant===1?"":"ern"}`:`„${kopie.n}" gelöscht`,
    "Rückgängig",()=>{ grabsteinLoesen(id); mut("eigene/"+id,kopie); });
}
function schnellVorschlag(){
  return SCHNELL().find(r=>malGekocht(r.id)>=SCHNELL_SCHWELLE)||null;
}
/* Aus einem Schnellgericht ein richtiges Rezept machen: Formular vorbefüllen */
function schnellAufnehmen(id){
  const r=R(id); if(!r) return;
  neuesRezept({
    n:r.n, k:r.k, typ:"haupt", ma:[...(r.ma||["a"])], min:r.min, p:r.p,
    zText:(r.z||[]).map(([n,q,e])=>(q?(Number.isInteger(q)?q:String(q).replace(".",","))+" "+(e?e+" ":""):"")+n).join("\n"),
    sText:"", why:"", pAuto:false, minAuto:false,
    status:"Aus einem Schnellgericht übernommen – ergänze Zubereitung und Kennzeichen."
  });
}

/* Wochenvorschlag: genau 1× Fisch, 1× Fleisch, Rest vegetarisch */
function autoWoche(){

  const m=monat();
  const kürzlich=new Set(Object.values(S.verlauf||{}).slice(-25).map(v=>v.r));
  const sam=r=>S.sammlung[r.id];
  const passt=(r,mk)=>istTagesgericht(r)&&r.ma.includes(mk);
  const poolVoll=mk=>RZ().filter(r=>passt(r,mk));
  /* Bevorzugt eure Sammlung. Sieben Plätze je Mahlzeit wollen aber gefüllt werden –
     reicht die Sammlung dafür nicht, wird aus dem Gesamtbestand aufgefüllt. */
  const pool=mk=>{const p=RZ().filter(r=>passt(r,mk)&&sam(r));return p.length>=7?p:poolVoll(mk);};
  const khZahl={};
  /* Was in den anderen geplanten Wochen schon steht, wird abgewertet */
  const eigene=new Set(slots());
  const andereWochen=new Set(Object.entries(S.plan||{}).filter(([k])=>!eigene.has(k)).map(([,e])=>e&&e.r));
  const punkte=r=>(r.m.includes(m)?3:0)
    +(andereWochen.has(r.id)?-2.5:0)
    +(kürzlich.has(r.id)?-2:0)
    +(S.still&&r.bl===2?-2:S.still&&r.bl===1?-0.5:0)
    +(imAngebot(r).length?4:0)                    /* was gerade im Prospekt steht */
    -1.8*(khZahl[khVon(r)]||0)                    /* je öfter eine Beilage schon vorkommt, desto unattraktiver */
    +Math.random()*2;
  /* Bereits Eingetragenes bleibt stehen – vorgeschlagen wird nur für freie Felder.
     Was von Hand geplant wurde, merken wir uns: auch das Protein-Auffüllen darf
     es später nicht austauschen, sonst verschwindet ein bewusst gesetztes Gericht. */
  const plan={}, festeFelder=new Set();
  slots().forEach(k=>{ if(S.plan[k]&&R(S.plan[k].r)){ plan[k]=S.plan[k]; festeFelder.add(k); } });
  const benutzt=new Set(Object.values(plan).map(e=>e.r));
  const blTag=[0,0,0,0,0,0,0];
  slots().forEach(k=>{const e=plan[k];const r=e&&R(e.r);if(r&&r.bl===2)blTag[slotTag(k)]++;});
  Object.values(plan).forEach(e=>{const r=R(e.r);if(r){const b=khVon(r);khZahl[b]=(khZahl[b]||0)+1;}});
  const schonFisch=Object.values(plan).filter(e=>(R(e.r)||{}).k==="fisch").length;
  const schonFleisch=Object.values(plan).filter(e=>(R(e.r)||{}).k==="fleisch").length;
  const nimm=(k,mk,arten)=>{
    const d=slotTag(k);
    const eigen=pool(mk).filter(r=>arten.includes(r.k));
    const alle=poolVoll(mk).filter(r=>arten.includes(r.k));
    const ok=r=>!S.still||!(r.bl===2&&blTag[d]>=1);
    /* Stufen: erst etwas Neues aus eurer Sammlung, dann etwas Neues aus dem
       Gesamtbestand – ein unbekanntes Gericht ist besser als dasselbe zweimal in
       einer Woche. Und erst wenn gar nichts übrig ist, lieber eine Wiederholung
       als ein Verstoß gegen die Stillzeit-Regel. */
    let c=eigen.filter(r=>!benutzt.has(r.id)&&ok(r));
    if(!c.length)c=alle.filter(r=>!benutzt.has(r.id)&&ok(r));
    if(!c.length)c=alle.filter(ok);
    if(!c.length)c=alle.filter(r=>!benutzt.has(r.id));
    if(!c.length)c=alle;
    if(!c.length)return;
    const r=c.sort((a,b)=>punkte(b)-punkte(a))[0];
    plan[k]={r:r.id,p:S.portionStd||2};benutzt.add(r.id);if(r.bl===2)blTag[d]++;
    const b=khVon(r); khZahl[b]=(khZahl[b]||0)+1;
  };
  const warm=[];for(let d=0;d<7;d++){warm.push("w"+planWoche+"-"+d+"-m");warm.push("w"+planWoche+"-"+d+"-a");}
  const freieWarm=warm.filter(k=>!plan[k]);
  const zufaellig=a=>a[Math.floor(Math.random()*a.length)];
  if(schonFisch<1&&freieWarm.length){ const k=zufaellig(freieWarm); nimm(k,slotMahl(k),["fisch"]); }
  const freieWarm2=warm.filter(k=>!plan[k]);
  if(schonFleisch<1&&freieWarm2.length){ const k=zufaellig(freieWarm2); nimm(k,slotMahl(k),["fleisch"]); }
  slots().forEach(k=>{if(plan[k])return;nimm(k,slotMahl(k),["veg"]);});
  /* Immer mindestens ein Gericht, das ihr noch nie gekocht habt */
  const gekocht=new Set(Object.values(S.verlauf||{}).map(v=>v.r));
  if(Object.values(plan).every(e=>gekocht.has(e.r))){
    const frei=warm.filter(k=>plan[k]&&R(plan[k].r)&&R(plan[k].r).k==="veg");
    const ziel=frei[Math.floor(Math.random()*frei.length)];
    if(ziel){
      const kand=pool(slotMahl(ziel)).filter(r=>r.k==="veg"&&!gekocht.has(r.id)&&!benutzt.has(r.id));
      if(kand.length)plan[ziel]={r:kand.sort((a,b)=>punkte(b)-punkte(a))[0].id,p:S.portionStd||2};
    }
  }
  proteinAuffuellen(plan,pool,punkte,benutzt,andereWochen,festeFelder,blTag);
  const ganz={...S.plan}; slots().forEach(k=>delete ganz[k]);
  mut("plan",{...ganz,...plan});   /* andere Wochen bleiben stehen */
}

/* ============ Rezepte ============ */
/* Ziel sind rund 80 g Protein je Person und Tag. Tage darunter bekommen
   ihr schwächstes Gericht gegen ein kräftigeres getauscht. */
const PROTEINZIEL=80;
/* Unter dieser Schwelle wird umgeplant. Näher an die 80 heranzuoptimieren würde
   jede Woche zu denselben proteinreichsten Gerichten führen – die Vielfalt wiegt schwerer,
   die Lücke schließt ein Snack. */
const PROTEIN_MINDEST=70;
function proteinAuffuellen(plan,pool,punkte,benutzt,andereWochen,festeFelder,blTag){
  const fest=festeFelder||new Set();
  const bl=blTag||[0,0,0,0,0,0,0];
  for(let d=0;d<7;d++){
    for(let runde=0;runde<4;runde++){
      const felder=["f","m","a"].map(mk=>"w"+planWoche+"-"+d+"-"+mk).filter(k=>plan[k]);
      if(!felder.length) break;
      const summe=felder.reduce((s,k)=>s+((R(plan[k].r)||{p:0}).p||0),0);
      if(summe>=PROTEIN_MINDEST) break;
      /* Fisch- und Fleischtage bleiben unangetastet, damit die Wochenregel hält.
         Von Hand gesetzte Felder ebenfalls – die sind eine Entscheidung, kein Vorschlag. */
      const tauschbar=felder.filter(k=>!fest.has(k)&&(R(plan[k].r)||{}).k==="veg")
        .sort((a,b)=>((R(plan[a].r)||{p:0}).p)-((R(plan[b].r)||{p:0}).p));
      let getauscht=false;
      for(const feld of tauschbar){
        const alt=R(plan[feld].r); if(!alt) continue;
        /* Auch beim Auffüllen gilt die Stillzeit-Regel: nie ein zweites stark
           blähendes Gericht an denselben Tag holen. */
        const starkFrei=r=>!S.still||r.bl!==2||(bl[d]-(alt.bl===2?1:0))<1;
        const frei=pool(slotMahl(feld)).filter(r=>r.k==="veg"&&!benutzt.has(r.id)&&r.p>alt.p&&starkFrei(r));
        /* Erst Gerichte, die in keiner anderen geplanten Woche stehen */
        const eigen=frei.filter(r=>!andereWochen||!andereWochen.has(r.id));
        const wahl=eigen.length?eigen:frei;
        /* Nicht das absolut proteinreichste nehmen, sondern eines der besseren –
           sonst sehen alle Wochen gleich aus */
        /* Grob nach Protein gruppieren, innerhalb der Gruppe zählt der übliche Punktestand –
   so bleiben Angebote und Saison auch beim Auffüllen wirksam */
        const besser=wahl.sort((x,y)=>(Math.round(y.p/5)-Math.round(x.p/5))||(punkte(y)-punkte(x)))[Math.floor(Math.random()*Math.min(2,wahl.length))];
        if(!besser) continue;
        benutzt.delete(alt.id); benutzt.add(besser.id);
        if(alt.bl===2) bl[d]--;
        if(besser.bl===2) bl[d]++;
        plan[feld]={r:besser.id,p:plan[feld].p};   /* eingestellte Portionen bleiben erhalten */
        getauscht=true; break;
      }
      if(!getauscht) break;
    }
  }
}
/* Protein je Tag, für den Hinweis im Wochenplan */
function proteinTag(w,d){
  return ["f","m","a"].reduce((s,mk)=>{const e=S.plan["w"+w+"-"+d+"-"+mk];const r=e&&R(e.r);return s+(r?r.p:0);},0);
}
function proteinSchnitt(w){
  const tage=[...Array(7)].map((_,d)=>proteinTag(w,d)).filter(x=>x>0);
  return tage.length?Math.round(tage.reduce((a,b)=>a+b,0)/tage.length):0;
}
/* Den proteinreichsten Snack als Zusatz einplanen */
/* Auswahl statt Automatik: welcher Snack und wie viele Portionen. */
let snackWahl={id:null,p:7};
function proteinSnack(){
  const snacks=RZ().filter(r=>typVon(r)==="snack").sort((a,b)=>b.p-a.p);
  if(!snacks.length){
    openSheet(`<div class="grab"></div><h2 style="font-size:20px">Kein Snack vorhanden</h2>

      <button class="btn btn-primary btn-wide" onclick="closeSheet();go('rezepte')">Zu den Rezepten</button>`);
    return;
  }
  if(!snackWahl.id||!snacks.some(r=>r.id===snackWahl.id)) snackWahl={id:snacks[0].id,p:7};
  snackBlatt();
}
function snackBlatt(){
  const snacks=RZ().filter(r=>typVon(r)==="snack").sort((a,b)=>b.p-a.p);
  const s=snacks.find(r=>r.id===snackWahl.id)||snacks[0];
  const luecke=Math.max(0,PROTEINZIEL-proteinSchnitt(planWoche));
  openSheet(`<div class="grab"></div><h2 style="font-size:20px">Protein-Snack ergänzen</h2>
    <p class="note" style="margin:8px 0 12px">${luecke?`Aktuell fehlen im Schnitt ${Math.round(luecke)} g pro Tag. `:""}Wähl den Snack und die Zahl der Portionen – sieben bedeutet einen für jeden Tag.</p>
    <label class="fl">Snack</label>
    <div class="pickrow" style="flex-wrap:wrap">${snacks.map(r=>
      `<button aria-pressed="${r.id===s.id}" onclick="snackWahl.id='${r.id}';snackBlatt()">${esc(r.n)} · ${r.p} g</button>`).join("")}</div>
    <label class="fl">Portionen</label>
    <div class="row-btns" style="align-items:center">
      <div class="stepper"><button onclick="snackWahl.p=Math.max(1,snackWahl.p-1);snackBlatt()">−</button>
        <b>${snackWahl.p}</b>
        <button onclick="snackWahl.p=Math.min(21,snackWahl.p+1);snackBlatt()">+</button></div>
      <span class="note" style="margin:0">macht ${s.p*snackWahl.p} g Protein, verteilt auf die Woche rund ${Math.round(s.p*snackWahl.p/7)} g pro Tag</span>
    </div>
    <button class="btn btn-primary btn-wide" style="margin-top:14px" onclick="snackEinplanen()">Unter „Zusätzlich“ eintragen</button>
    <button class="btn btn-wide btn-ghost" style="margin-top:6px" onclick="closeSheet()">Abbrechen</button>`, true);
}
function snackEinplanen(){
  const s=R(snackWahl.id); if(!s) return;

function trefferHtml(){
  const m=monat();
  /* Schnellgerichte haben ihren eigenen Filter – sonst bleiben sie außen vor */
  let list=filter==="schnell"?SCHNELL()
    :filter==="alles"?RZ().filter(r=>!S.archiv[r.id])
    :RZ().filter(r=>S.sammlung[r.id]);
  if(["fisch","fleisch","veg"].includes(filter))list=list.filter(r=>r.k===filter);
  if(["f","m","a"].includes(filter))list=list.filter(r=>r.ma.includes(filter));
  if(filter==="saison")list=list.filter(r=>r.m.includes(m));
  if(filter==="darm")list=list.filter(r=>r.bl===0);
  if(filter==="kurz")list=list.filter(r=>r.min<=25);
  if(filter==="asana")list=list.filter(r=>r.src==="asana");
  if(filter==="eigen")list=list.filter(r=>r.src==="eigen");
  if(TYP[filter])list=list.filter(r=>typVon(r)===filter);
  /* Auch in den Zutaten suchen: „Zucchini" soll die Gerichte finden, in denen
     sie steckt – nicht nur die mit Zucchini im Titel. */
  const q=String(suche||"").trim().toLowerCase();
  const imNamen=r=>r.n.toLowerCase().includes(q);
  const inZutat=r=>(r.z||[]).some(z=>String(z[0]).toLowerCase().includes(q));
  if(q)list=list.filter(r=>imNamen(r)||inZutat(r));
  list.sort((a,b)=>(q?(imNamen(b)-imNamen(a)):0)||(b.m.includes(m)-a.m.includes(m))||a.n.localeCompare(b.n));
  if(!list.length)return `<div class="empty"><b>Nichts gefunden</b>Ändere den Filter oder hol dir neue Rezepte unter Entdecken.</div>`;
  return list.map(r=>{
    const [lbl,tag,,kk]=KIND[r.k];
    const zuletzt=zuletztGekocht(r.id);
    const herTage=zuletzt?Math.round((Date.now()-zuletzt)/TAG):0;
    /* Wenn nur eine Zutat den Treffer gebracht hat, zeigen welche */
    const treffZutat=q&&!imNamen(r)?(r.z||[]).find(z=>String(z[0]).toLowerCase().includes(q)):null;
    const drin=!!S.sammlung[r.id];
    const schnell=istSchnell(r), gekocht=schnell?malGekocht(r.id):0;
    return `<div class="rec ${kk}"><div class="rec-b" onclick="detail('${r.id}')">
      <div class="rec-t">${esc(r.n)}${schnell?'<span class="pill" style="margin-left:7px">Schnell</span>':""}</div>
      <div class="rec-m">${TYP[typVon(r)]} · ${r.min} Min${herTage?" · zuletzt vor "+herTage+" Tag"+(herTage===1?"":"en"):""}</div>
      ${treffZutat?`<div class="rec-m" style="color:var(--herb)">mit ${esc(treffZutat[0])}</div>`:""}
      <div class="rec-tags"><span class="tag ${tag}">${lbl}</span><span class="pill">${r.p} g Protein</span>${
        schnell&&gekocht>=SCHNELL_SCHWELLE?`<button class="tag t-sun" style="border:0;cursor:pointer" onclick="event.stopPropagation();schnellAufnehmen('${r.id}')">${gekocht}× gekocht · als Rezept aufnehmen</button>`:""}</div>
    </div>${schnell
      ?`<button class="add-b" style="border:0;background:transparent;font-size:18px" onclick="event.stopPropagation();schnellWeg('${r.id}')" aria-label="Löschen">${IKON.muell}</button>`
      /* Entfernen stand bisher auf jeder Zeile und war damit das Auffälligste
         neben dem Titel – eine seltene und noch dazu zerstörende Handlung.
         Sie liegt jetzt im Rezept selbst. Das Plus bleibt: Aufnehmen ist eine
         Handlung, die man aus der Liste heraus wirklich braucht. */
      :drin ? ""
      :`<button class="add-b" onclick="mut('sammlung/${r.id}',Date.now())" aria-label="In die Sammlung">${IKON.plus}</button>`}</div>`;}).join("");
}

/* ---------- Resteküche: was koche ich aus dem, was noch da ist? ----------
   Die häufigste Frage, wenn im Kühlschrank etwas weg muss. Sortiert wird nach
   der Zahl der getroffenen Zutaten, danach nach Zubereitungszeit. */
let resteWahl=[];
/* Die gängigsten Zutaten aus dem eigenen Bestand – nach Häufigkeit, damit die
   Auswahl kurz bleibt und trotzdem das Übliche abdeckt. */
function resteZutaten(n=36){
  const zaehler={};
  RZ().forEach(r=>{
    const gesehen=new Set();
    (r.z||[]).forEach(([name])=>{
      const k=String(name).trim();
      if(!k||gesehen.has(k.toLowerCase())) return;
      gesehen.add(k.toLowerCase());
      zaehler[k]=(zaehler[k]||0)+1;
    });
  });
  /* Grundzutaten wie Salz und Öl helfen bei der Suche nicht weiter */
  const uninteressant=/^(salz|pfeffer|wasser|öl|olivenöl|zucker|mehl|butter|essig|senf|paprikapulver|kreuzk|currypulver|zimt|honig|hefe|backpulver|semmelbr|petersilie|schnittlauch)/i;
  return Object.entries(zaehler)
    .filter(([k,v])=>v>=3&&!uninteressant.test(k))
    .sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k])=>k);
}
function resteTreffer(){
  if(!resteWahl.length) return [];
  const passt=(r,w)=>(r.z||[]).some(z=>String(z[0]).toLowerCase().includes(w.toLowerCase()));
  return RZ().filter(r=>istTagesgericht(r)||typVon(r)==="snack")
    .map(r=>({r,treffer:resteWahl.filter(w=>passt(r,w))}))
    .filter(x=>x.treffer.length)
    .sort((a,b)=>b.treffer.length-a.treffer.length||a.r.min-b.r.min)
    .slice(0,25);
}
function resteKueche(){
  const koerper=()=>{
    const zutaten=resteZutaten();

    return `<div class="grab"></div><h2 style="font-size:20px">Was ist noch da?</h2>
      <p class="note" style="margin:7px 0 12px">Tipp an, was weg muss. Die Liste zeigt Gerichte, die es verwenden – oben die mit den meisten Treffern.</p>
      <div class="chips" style="flex-wrap:wrap;overflow:visible;padding-bottom:8px">
        ${zutaten.map(z=>`<button class="chip" aria-pressed="${resteWahl.includes(z)}" onclick="resteTick('${esc(z).replace(/'/g,"\\'")}')">${esc(z)}</button>`).join("")}</div>
      <div class="row-btns" style="margin-bottom:10px">

        <button class="btn btn-s" onclick="resteEigen()">Dazu</button>
        ${resteWahl.length?`<button class="btn btn-s btn-ghost" onclick="resteWahl=[];openSheet(resteKoerper(),true)">Auswahl leeren</button>`:""}</div>
      ${!resteWahl.length
        ? `<p class="note">Noch nichts gewählt.</p>`
        : (treffer.length
          ? `<div class="sect"><h2>${treffer.length} Gericht${treffer.length===1?"":"e"}</h2></div>`+treffer.map(({r,treffer:tr})=>`
              <div class="meal"><div class="meal-main" onclick="closeSheet();detail('${r.id}')">
                <div class="meal-name">${esc(r.n)}</div>
                <div class="meal-sub">${tr.length} von ${resteWahl.length} · ${r.min} Min · ${esc(tr.join(", "))}</div></div>
                <button class="btn btn-s" onclick="closeSheet();einplanen('${r.id}')">Einplanen</button></div>`).join("")
          : `<p class="note">Damit findet sich kein Gericht. Nimm eine Zutat heraus oder such unter „Rezepte" direkt danach.</p>`)}
      <button class="btn btn-wide btn-ghost" style="margin-top:12px" onclick="closeSheet()">Schließen</button>`;
  };
  window.resteKoerper=koerper;
  window.resteTick=z=>{
    resteWahl=resteWahl.includes(z)?resteWahl.filter(x=>x!==z):resteWahl.concat([z]);
    openSheet(koerper(),true);
  };
  window.resteEigen=()=>{
    const el=document.getElementById("resteeigen"); if(!el||!el.value.trim()) return;
    const w=el.value.trim(); el.value="";
    if(!resteWahl.includes(w)) resteWahl=resteWahl.concat([w]);
    openSheet(koerper(),true);

  openSheet(koerper());
}

/* ============ Entdecken ============
   Bis 3.7 zeigte dieser Bereich Rezepte aus der mitgelieferten Sammlung, die man
   noch nicht angenommen hatte. Das war Verwaltung, keine Entdeckung: Nach ein
   paar Wochen war der Stapel durch und der Reiter tot. Jetzt kommen hier nur
   Vorschläge her, die es in der Sammlung noch nicht gibt – aus dem Ideenpool,
   passend zum Prospekt oder frisch aus den Blogs. Das Aussortieren alter
   Sammlungsrezepte ist nach „Mehr → Aufräumen" gezogen, wo Pflege hingehört. */
let ideenModus="ideen";        /* ideen | angebote | netz */
let themaWahl=null;            /* von Hand gewähltes Thema, sonst das der Woche */
const zuletztGekocht=id=>{const t=Object.entries(S.verlauf||{}).filter(([,v])=>v.r===id).map(([k])=>+k);return t.length?Math.max(...t):0;};

/* Das Thema wechselt mit der Kalenderwoche. Zwölf Themen ergeben einen Zyklus
   von einem Vierteljahr – lang genug, dass es sich nicht wiederholt anfühlt. */
function kwNummer(d=new Date()){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  const j=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil(((t-j)/86400000+1)/7);
}
const themaDerWoche=()=>THEMEN[(kwNummer()-1)%THEMEN.length];
const themaAktiv=()=>THEMEN.find(t=>t.k===themaWahl)||themaDerWoche();
const themaVon=k=>THEMEN.find(t=>t.k===k)||THEMEN[0];

/* Eine Idee ist offen, solange sie weder übernommen noch weggelegt wurde.
   Weggelegtes kommt nach der Frist wieder – Geschmack ändert sich. */
const ideeOffen=i=>!!i&&!S.eigene[i.id]&&!S.sammlung[i.id]&&!S.archiv[i.id]&&
  !((S.ideenWeg||{})[i.id]&&Date.now()-S.ideenWeg[i.id]<FRIST.idee*TAG);
const ideeVon=id=>IDEEN.find(i=>i.id===id)||null;
/* Erst das Thema, dann die Saison, dann der Rest – innerhalb dessen stabil
   sortiert, damit die Liste beim Neuzeichnen nicht springt. */
function ideenPool(thema){
  const t=thema||themaAktiv().k;
  return IDEEN.filter(ideeOffen).sort((a,b)=>
    (b.thema===t)-(a.thema===t) ||
    (b.m.includes(monat()))-(a.m.includes(monat())) ||
    (S.still?a.bl-b.bl:0) ||
    (a.id<b.id?-1:1));
}
const ideenZumThema=t=>ideenPool(t).filter(i=>i.thema===(t||themaAktiv().k));
/* Ideen, für die diese Woche etwas im Prospekt steht. Der Treffer wird
   mitgegeben, damit die Karte zeigen kann, worauf er beruht. */
function ideenImAngebot(){
  return IDEEN.filter(ideeOffen).map(i=>{
    const treffer=(i.z||[]).map(([n])=>({n,a:zutatImAngebot(n,0)})).filter(x=>x.a);
    return treffer.length?{idee:i,treffer}:null;
  }).filter(Boolean).sort((a,b)=>
    (b.treffer.some(x=>istBio(x.a))-a.treffer.some(x=>istBio(x.a))) || (b.treffer.length-a.treffer.length));
}

function ideeUebernehmen(id){
  const i=ideeVon(id); if(!i) return;
  /* Als eigenes Rezept ablegen: ab hier ist es ein Rezept wie jedes andere und
     lässt sich einplanen, einkaufen und kochen. src bleibt als Herkunft stehen. */
  const {thema,...rest}=i;
  mut("eigene/"+id,{...rest,src:"idee",erstellt:Date.now()},false);
  mut("sammlung/"+id,Date.now());
  meldung("„"+i.n+"“ ist jetzt in deiner Sammlung.","Ansehen",()=>detail(id));
}
function ideeWeg(id){
  const i=ideeVon(id); if(!i) return;
  mut("ideenWeg/"+id,Date.now());
  meldung("Weggelegt. In "+FRIST.idee+" Tagen fragen wir noch einmal.","Zurück",()=>mut("ideenWeg/"+id,null));
}
/* Ganze Idee ansehen, bevor man sie annimmt – Zutaten allein sagen wenig. */
function ideeDetail(id){

    <button class="btn btn-wide btn-ghost" style="margin-top:6px" onclick="closeSheet()">Schließen</button>`);

/* Eine Karte im Strom. Der Titel führt in die Einzelheiten, die beiden Knöpfe
   entscheiden – wie im Stapel vorher, nur ohne Wischen und mit mehreren Ideen
   im Blick. Inspiration heißt vergleichen können. */
function ideenKarte(i,zusatz){
  const [lbl,tag]=KIND[i.k];
  return `<div class="rec k-${i.k}"><div class="rec-b">
    <button class="ideen-t" onclick="ideeDetail('${i.id}')">${esc(i.n)}</button>
    <div class="rec-m">${lbl} · ${i.min} Min · ${i.p} g Protein${i.m.includes(monat())?" · Saison":""}</div>

    ${zusatz||""}

    <div class="row-btns" style="margin-top:10px">
      <button class="btn btn-s btn-primary" onclick="ideeUebernehmen('${i.id}')">${IKON.plus} Übernehmen</button>
      <button class="btn btn-s" onclick="ideeWeg('${i.id}')">Nicht mein Ding</button>
    </div></div></div>`;
}

function vEntdecken(){
  const kopf=`<div class="toggle" style="width:100%;margin-bottom:12px">
      <button style="flex:1" aria-pressed="${ideenModus==="ideen"}" onclick="ideenModus='ideen';render()">Ideen</button>
      <button style="flex:1" aria-pressed="${ideenModus==="angebote"}" onclick="ideenModus='angebote';render()">Im Angebot</button>
      <button style="flex:1" aria-pressed="${ideenModus==="netz"}" onclick="ideenModus='netz';render()">Aus dem Netz</button></div>`;
  if(ideenModus==="netz") return kopf+vNetz();
  if(ideenModus==="angebote") return kopf+vIdeenAngebote();

  const thema=themaAktiv();
  const zumThema=ideenZumThema(thema.k);
  const rest=ideenPool().filter(i=>i.thema!==thema.k);
  const zeigen=zumThema.slice(0,6);
  const auffuellen=zeigen.length<3?rest.slice(0,4-zeigen.length):[];
  if(!zumThema.length&&!rest.length)
    return kopf+`<div class="empty"><b>Alle Ideen gesichtet</b>
      Du hast jede der ${IDEEN.length} Ideen entweder übernommen oder weggelegt. Weggelegtes kommt nach ${FRIST.idee} Tagen wieder.
      <div style="margin-top:14px"><button class="btn" onclick="ideenModus='netz';render()">Aus dem Netz ansehen</button></div></div>`;
  return kopf+`<div class="themakarte">
      <div class="thema-k">Thema der Woche${themaWahl?" · selbst gewählt":""}</div>
      <b>${thema.n}</b>
      <p class="note" style="margin-top:4px">${thema.t}</p>
      <div class="row-btns" style="margin-top:10px">
        <button class="btn btn-s" onclick="themaWaehlen()">Anderes Thema</button>
        <span class="rec-m" style="align-self:center">${zumThema.length} Ideen offen</span></div>
    </div>
    ${zeigen.map(i=>ideenKarte(i)).join("")}
    ${auffuellen.length?`<div class="sect"><h2>Auch neu</h2></div>${auffuellen.map(i=>ideenKarte(i)).join("")}`:""}
    ${zumThema.length>6?`<p class="note" style="margin-top:12px;text-align:center">Noch ${zumThema.length-6} weitere Ideen zu diesem Thema – sie rücken nach, sobald du oben entschieden hast.</p>`:""}`;
}
/* Ideen, für die diese Woche etwas günstig ist. Der Prospekt liegt ohnehin
   schon eingelesen vor – das ist der Moment, in dem ein Vorschlag etwas wert ist. */
function vIdeenAngebote(){
  if(!angeboteAktiv(0).length)
    return `<div class="empty"><b>Kein Prospekt für diese Woche</b>
      Lies unter „Mehr → Angebote" den aktuellen Aldi-Prospekt ein. Danach stehen hier die Ideen, deren Zutaten gerade günstig sind.
      <div style="margin-top:14px"><button class="btn btn-primary" onclick="mehrOeffnen('angebote')">Zu den Angeboten</button></div></div>`;
  const treffer=ideenImAngebot();
  if(!treffer.length)
    return `<div class="empty"><b>Nichts Passendes im Prospekt</b>
      Diese Woche trifft keine offene Idee auf ein Angebot. Sieh unter „Ideen" nach – oder nächste Woche wieder hier.</div>`;
  return `<p class="note" style="margin-bottom:12px">${treffer.length} Idee${treffer.length===1?"":"n"}, deren Zutaten gerade im Prospekt stehen.</p>`
    +treffer.slice(0,8).map(({idee,treffer:t})=>ideenKarte(idee,
      (()=>{const bio=t.filter(x=>istBio(x.a));
        return `<p class="note" style="margin-top:6px;color:var(--${bio.length?"herb":"sun"})">${
          bio.length?"Bio im Angebot: "+bio.map(x=>esc(x.n)).join(", ")+(t.length>bio.length?" · außerdem im Angebot: "+t.filter(x=>!istBio(x.a)).map(x=>esc(x.n)).join(", "):"")
                    :"Im Angebot: "+t.map(x=>esc(x.n)).join(", ")}</p>`;})())).join("");
}

/* ---------- Aufräumen: liegt jetzt unter „Mehr" ----------
   Karteileichen: lange in der Sammlung, nie oder ewig nicht gekocht, zuletzt
   nicht bestätigt. Das ist Pflege der eigenen Sammlung und hat mit Entdecken
   nichts zu tun – hier wird nichts Neues gefunden, nur Altes aussortiert. */
const poolAlt=()=>RZ().filter(r=>{
    const rein=S.sammlung[r.id]; if(!rein) return false;
    if(Date.now()-rein<FRIST.alt*TAG) return false;
    const g=zuletztGekocht(r.id);
    if(g&&Date.now()-g<FRIST.ungekocht*TAG) return false;
    const p=S.geprueft[r.id];
    if(p&&Date.now()-p<FRIST.geprueft*TAG) return false;
    return true;
  }).sort((a,b)=>zuletztGekocht(a.id)-zuletztGekocht(b.id));
function aufraeumenBehalten(id){ mut("geprueft/"+id,Date.now(),false); mehrZeigen(); }
function aufraeumenWeg(id){
  const r=R(id);
  mut("sammlung/"+id,null,false); mut("archiv/"+id,Date.now(),false);
  mehrZeigen();
  meldung("„"+(r?r.n:"Rezept")+"“ aussortiert.","Rückgängig",()=>{
    mut("archiv/"+id,null,false); mut("sammlung/"+id,Date.now(),false); mehrZeigen();
  });
}
function zurueckholen(id){mut("archiv/"+id,null,false);mut("sammlung/"+id,Date.now());}
function nochmalZeigen(id){mut("archiv/"+id,null);}

    ${alt.length?`<div class="sect"><h2>Vielleicht übersehen</h2><button class="btn btn-s" onclick="archivNeuMischen()">Andere zeigen</button></div>

/* Wer nicht bis morgen warten will, bekommt sofort eine andere Auswahl. */
let archivVersatz=0;
function archivNeuMischen(){ archivVersatz++; render(); }
const vorZeit=ts=>{
  const min=Math.round((Date.now()-ts)/60000);
  if(min<2) return "gerade eben";
  if(min<60) return "vor "+min+" Minuten";
  const std=Math.round(min/60);
  if(std<24) return "vor "+std+(std===1?" Stunde":" Stunden");
  const tage=Math.round(std/24);
  return "vor "+tage+(tage===1?" Tag":" Tagen");
};

/* Welche Vorratsdinge kommen in den Gerichten dieser Woche überhaupt vor?
   Alles andere jede Woche abzufragen ist eine Wand aus Schaltern ohne Nutzen. */
function vorratGebraucht(){
  const noetig=new Set();
  const sammeln=r=>{ if(r) (r.z||[]).forEach(([n])=>{ const v=imVorrat(n); if(v) noetig.add(slug(v.n)); }); };
  slots().forEach(k=>{const e=S.plan[k]; if(e&&e.p!==0) sammeln(R(e.r));});
  extraListe(planWoche).forEach(e=>{ if(e.p!==0) sammeln(R(e.r)); });
  return noetig;
}
let vorratAlle=false;
function vorratFrage(){
  vorratAlle=false;
  const body=()=>{
    const noetig=vorratGebraucht();
    const alleEintraege=Object.entries(S.vorrat);
    const relevant=alleEintraege.filter(([,v])=>noetig.has(slug(v.n)));
    const zeigen=(vorratAlle||!relevant.length)?alleEintraege:relevant;
    const rest=alleEintraege.length-zeigen.length;
    const zeile=([id,v])=>`<div class="meal"><div class="meal-main"><div class="meal-name" style="font-size:15px">${esc(v.n)}</div><div class="meal-sub">${ABT[v.k]}</div></div>
      <div class="toggle"><button aria-pressed="${!!v.da}" onclick="vt('${id}',true)">Da</button><button aria-pressed="${!v.da}" onclick="vt('${id}',false)">Fehlt</button></div></div>`;
    return `<div class="grab"></div><h2 style="font-size:20px">Was ist noch da?</h2>
    <p class="note" style="margin:7px 0 16px">${relevant.length&&!vorratAlle
      ? "Nur das, was in den Gerichten dieser Woche vorkommt. Alles auf „Fehlt“ landet auf der Einkaufsliste."
      : "Alles auf „Fehlt“ landet automatisch auf der Einkaufsliste."}</p>
    ${zeigen.map(zeile).join("")}
    ${rest>0?`<button class="btn btn-s btn-wide" style="margin-top:10px" onclick="vorratAlle=true;openSheet(vorratKoerper(),true)">Restliche ${rest} auch zeigen</button>`:""}
    <div style="margin-top:16px"><button class="btn btn-primary btn-wide" onclick="listeBauen()">Liste erstellen</button>
    <button class="btn btn-wide btn-ghost" style="margin-top:6px" onclick="closeSheet()">Abbrechen</button></div>`;
  };
  window.vorratKoerper=body;
  window.vt=(id,d)=>{const v=(S.vorrat||{})[id]; if(!v)return;
    mut("vorrat/"+id,{...v,da:d},false);openSheet(body(),true);};
  openSheet(body());
}
/* Vorratstreffer: nur exakt oder als einfache Mehrzahl, damit Kokosmilch nicht als Milch durchgeht */
function imVorrat(name){
  const a=slug(name);
  return Object.values(S.vorrat).find(v=>{const b=slug(v.n);
    return b===a||b===a+"n"||b===a+"e"||b+"n"===a||b+"e"===a;});
}
function listeBauen(){
  const map=new Map();
  const ausVorrat=new Set();   /* welche Zutaten der Vorrat deckt – verschiedene, nicht Vorkommen */
  /* Im Markt steht man vor „Lauch, 120 g“ und weiß nicht mehr, wofür.
     Deshalb merkt sich jeder Posten, aus welchen Gerichten er stammt. */
  const dazu=(n,q,ein,kat,portionen,rezeptId)=>{
    const v=imVorrat(n); if(v&&v.da){ ausVorrat.add(v.n); return; }
    const id=slug(n+"_"+ein), menge=q*(portionen||2);
    if(map.has(id)){
      const alt=map.get(id);
      alt.q+=menge;
      if(rezeptId&&!alt.fuer.includes(rezeptId)) alt.fuer.push(rezeptId);
    } else {
      map.set(id,{n,q:menge,e:ein,k:kat,on:false,ang:zutatImAngebot(n,planWoche)||"",
        fuer:rezeptId?[rezeptId]:[]});
    }
  };
  slots().forEach(k=>{const e=S.plan[k];if(!e)return;const r=R(e.r);if(!r)return;
    if(e.p===0)return;   /* Restetag */
    r.z.forEach(([n,q,ein,kat])=>dazu(n,q,ein,kat,e.p,r.id));});
  /* Extras derselben Woche zählen mit */
  extraListe(planWoche).forEach(e=>{
    const r=R(e.r); if(!r||e.p===0) return;
    r.z.forEach(([n,q,ein,kat])=>dazu(n,q,ein,kat,e.p,r.id));
  });
  /* Beim zweiten Einkauf der Woche zählt nur, was noch fehlt */
  const liste={};
  const bisher=S.liste||{};   /* Firebase liefert eine leere Liste gar nicht erst zurück */
  /* Von Hand ergänzte Posten bleiben immer erhalten – außer der Plan bringt
     dieselbe Sache ohnehin mit, sonst stünde sie zweimal im Laufplan. */
  const ausRezepten=new Set([...map.values()].map(v=>slug(v.n)));
  Object.entries(bisher).forEach(([id,i])=>{ if(i&&i.manuell&&!ausRezepten.has(slug(i.n))) liste[id]=i; });
  map.forEach((v,id)=>{
    const alt=bisher[id];
    const schon=alt?(alt.gekauft||(alt.on?(alt.q||0):0)):0;
    const rest=Math.max(0,(v.q||0)-schon);
    const erledigt=schon>0&&rest<=0.001;
    liste[id]={...v, q:erledigt?(v.q||0):(schon>0?rest:v.q), on:erledigt,
      gekauft:schon, nach:v.q===0?true:undefined};
  });
  Object.values(S.vorrat).filter(v=>!v.da).forEach(v=>{const id=slug(v.n+"_vorrat");
    if(!Object.values(liste).some(i=>i.n===v.n))liste[id]={n:v.n,q:0,e:"",k:v.k,on:false,nach:true,
      ang:zutatImAngebot(v.n,planWoche)||""};});
  S.listeInfo={ausVorrat:ausVorrat.size,gebaut:Date.now(),woche:planWoche};
  mut("liste",liste);closeSheet();go("einkauf");
}

        </button></div>`;}).join("")}</div></div>`;
  }).join("");
  const rEdit=routeOffen?`<div class="card" style="margin-top:8px">${S.route.map((k,i)=>`<div class="ingline"><span>${i+1}. ${ABT[k]}</span><span>

  ].filter(Boolean).join(" · ");
  return wahl+`<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline">

function postenWoher(id){
  const i=(S.liste||{})[id]; if(!i) return;
  const roh=(i.fuer&&(Array.isArray(i.fuer)?i.fuer:Object.values(i.fuer)))||[];
  const gerichte=roh.map(x=>R(x)).filter(Boolean);
  const anteil=r=>{
    const z=(r.z||[]).find(x=>slug(x[0]+"_"+x[2])===id);
    if(!z) return "";
    /* Portionen dieses Gerichts in der laufenden Woche zusammenzählen */
    let p=0;
    slots().forEach(k=>{const e=S.plan[k]; if(e&&e.r===r.id&&e.p!==0) p+=(e.p||2);});
    extraListe(planWoche).forEach(e=>{ if(e.r===r.id&&e.p!==0) p+=(e.p||2); });
    return p?fmt(z[1]*p,z[2]):"";
  };
  openSheet(`<div class="grab"></div>
    <h2 style="font-size:20px">${esc(i.n)}</h2>
    <p class="note" style="margin:6px 0 14px">${i.q?fmt(i.q,i.e)+" insgesamt":"ohne feste Menge"}${i.gekauft?" · "+fmt(i.gekauft,i.e)+" schon gekauft":""}${i.ang?(istBio(i.ang)?" · steht als Bio im Prospekt":" · steht im Prospekt"):""}</p>
    ${i.ang?`<p class="note" style="margin:-8px 0 14px;${istBio(i.ang)?"color:var(--herb)":""}">${esc(i.ang)}</p>`:""}

      ? `<div class="sect"><h2>Wofür</h2></div>`+gerichte.map(r=>`<div class="meal">
          <div class="meal-main" onclick="closeSheet();detail('${r.id}')">
            <div class="meal-name">${esc(r.n)}</div>
            <div class="meal-sub">${anteil(r)||"Menge nicht zuzuordnen"}</div></div></div>`).join("")
      : `<p class="note">${i.manuell?"Von Hand ergänzt – gehört zu keinem Gericht.":"Aus dem Vorrat nachzufüllen."}</p>`}
    <button class="btn btn-wide btn-ghost" style="margin-top:12px" onclick="closeSheet()">Schließen</button>`);
}

      +(()=>{const bio=bioAngebote(0);
        if(!bio.length) return angeboteAktiv(0).length
          ? `<p class="note" style="margin-bottom:12px">Im Prospekt dieser Woche steht nichts in Bio.</p>` : "";
        return `<div class="sect"><h2>Bio im Angebot</h2><span class="rec-m">${bio.length}</span></div>
          <div class="card" style="margin-bottom:12px">${bio.slice(0,20).map(x=>
            `<div class="ingline"><span>${esc(x)}</span><span class="pill bio">Bio</span></div>`).join("")}
          ${bio.length>20?`<p class="note" style="margin-top:8px">und ${bio.length-20} weitere</p>`:""}</div>`;})()
      +`<button class="btn btn-wide btn-primary" onclick="angeboteBearbeiten()">Prospekt hinzufügen</button>
        ${l.length?`<button class="btn btn-wide" style="margin-top:6px" onclick="abgelaufeneWeg();mehrZeigen()">Abgelaufene löschen</button>`:""}`
      +blattFuss;
  },
  eigene(){
    return blattKopf("Eigene Rezepte",`${Object.keys(S.eigene||{}).length} selbst angelegt. Sie gleichen sich wie alles andere auf beide Handys ab.`)
      +`<button class="btn btn-wide btn-primary" onclick="mehrSchliessen();neuesRezept()">Neues Rezept anlegen</button>
        <div class="row-btns" style="margin-top:8px">
          <button class="btn btn-s" onclick="eigeneImportieren()">Aus Datei einspielen</button>
          <button class="btn btn-s" onclick="eigeneExportieren()">Als Datei sichern</button></div>
        <div class="sect"><h2>Aus Link holen</h2></div>
        <label class="fl" for="leser">Adresse des Rezept-Lesers</label>
        <input type="url" id="leser" value="${esc(cfg.leser)}" placeholder="https://rezeptleser.dein-name.workers.dev">
        <button class="btn btn-s" style="margin-top:8px" onclick="leserSpeichern();mehrZeigen()">Speichern</button>
        <p class="note" style="margin-top:9px">Damit füllt „Aus Link holen“ Zutaten und Zubereitung automatisch aus einer Rezeptseite. Ohne Eintrag funktioniert weiterhin „Rezepttext einfügen“.</p>
        <p class="note" style="margin-top:10px">Damit „Küchenplan“ im Teilen-Menü deines Handys auftaucht, muss die App über das Chrome-Menü installiert sein. Danach landet eine geteilte Seite direkt im Formular.</p>`
      +blattFuss;
  },
  archiv(){
    const arch=Object.entries(S.archiv||{}).sort((a,b)=>b[1]-a[1]);
    const spa=Object.entries(S.spaeter||{}).length;
    if(!arch.length) return blattKopf("Archiv",`Noch nichts aussortiert.${spa?` ${spa} Rezept${spa>1?"e liegen":" liegt"} auf „Später nochmal“ und taucht nach ${FRIST.spaeter} Tagen wieder unter Entdecken auf.`:""}`)+blattFuss;
    return blattKopf("Archiv",`${arch.length} aussortiert.${spa?` Weitere ${spa} auf „Später nochmal“.`:""} Nichts davon ist gelöscht.`)
      +arch.map(([id])=>{const r=R(id); if(!r) return "";
        return `<div class="meal"><div class="meal-main"><div class="meal-name" style="font-size:15px">${esc(r.n)}</div>
          <div class="meal-sub">${KIND[r.k][0]} · ${r.min} Min</div></div>
          <button class="btn btn-s" onclick="nochmalZeigen('${id}');mehrZeigen()">Nochmal zeigen</button>
          <button class="btn btn-s btn-primary" onclick="zurueckholen('${id}');mehrZeigen()">In die Sammlung</button></div>`;}).join("")
      +blattFuss;
  },
  sync(){
    const b=basis();
    return blattKopf("Abgleich",b?`Status: ${SYNCTEXT[syncState]||syncState}${queue.length?` · ${queue.length===1?"1 Änderung wartet":queue.length+" Änderungen warten"}`:""}`
                            :"Noch nicht eingerichtet – alles liegt nur auf diesem Gerät.")
      +(b&&dauerfehler()?`<p class="note" style="color:var(--gefahr);font-weight:550;margin-bottom:12px">${SYNC_FEHLER[syncState]}</p>`:"")
      +(b?`<div class="row-btns" style="margin-bottom:14px"><button class="btn btn-s" onclick="versuche=0;verbinden();flush();mehrZeigen()">Neu verbinden</button>${queue.length?`<button class="btn btn-s" onclick="flush();mehrZeigen()">Wartendes senden</button>`:""}</div>`:"")
      +`<label class="fl" for="db">Datenbank-URL aus Firebase</label>
        <input type="url" id="db" value="${esc(cfg.db)}" placeholder="https://name-default-rtdb.europe-west1.firebasedatabase.app">
        <label class="fl" for="hid">Haushalts-Code</label>
        <input type="text" id="hid" value="${esc(cfg.hid)}" placeholder="mindestens 20 Zeichen">
        <div class="row-btns" style="margin-top:10px">
          <button class="btn btn-s" onclick="codeErzeugen()">Code erzeugen</button>
          <button class="btn btn-s btn-primary" onclick="cfgSpeichern();mehrZeigen()">Speichern und verbinden</button></div>
        <p class="note" style="margin-top:11px">Auf dem zweiten Handy dieselbe URL und denselben Code eintragen. Beim Verbinden werden beide Stände zusammengeführt, nicht überschrieben.</p>
        ${b?`<div class="sect"><h2>Notfall</h2></div>
          <button class="btn btn-wide" onclick="hochladen()">Diesen Stand hochladen</button>
          <p class="note" style="margin-top:6px">Überschreibt den Stand in der Datenbank mit dem dieses Geräts. Nur nötig, wenn wirklich etwas schiefgegangen ist.</p>`:""}
        <div class="sect"><h2>Firebase einrichten</h2></div>
        <p class="note">Einmalig, kostenlos, etwa fünf Minuten:</p>
        <ol class="note" style="padding-left:18px;margin:8px 0"><li>Auf console.firebase.google.com ein Projekt anlegen (Spark-Tarif, keine Karte nötig).</li>
        <li>Realtime Database erstellen, Region Europa, Start im gesperrten Modus.</li>
        <li>Unter Regeln folgendes eintragen und veröffentlichen:</li></ol>
        <pre>{
  "rules": {
    "haushalte": {
      "$id": {
        ".read": "$id.length >= 20",
        ".write": "$id.length >= 20"
      }
    }
  }
}</pre>
        <p class="note" style="margin-top:8px">Die URL steht oben in der Datenbankansicht. Wer den Haushalts-Code kennt, kann eure Liste lesen und ändern – auflisten oder erraten kann sie niemand. Für eine Einkaufsliste ist das in Ordnung, für Sensibleres wäre es das nicht.</p>`
      +blattFuss;
  }
};
/* Ganzer Eintrag statt nur des Feldes: nur so bekommt er einen Zeitstempel */
function vorratSetzen(id,da){ const v=S.vorrat&&S.vorrat[id]; if(!v)return; mut("vorrat/"+id,{...v,da}); mehrZeigen(); }
function vorratWeg(id){ mut("vorrat/"+id,null); mehrZeigen(); }
function addV(){const el=document.getElementById("vn"); const n=el?el.value.trim():""; if(!n)return;
  el.value="";
  mut("vorrat/"+slug(n),{n,k:document.getElementById("vk").value,da:true}); mehrZeigen();}
function codeErzeugen(){
  const a="abcdefghijkmnopqrstuvwxyz23456789";let s="";
  const r=crypto.getRandomValues(new Uint8Array(24));r.forEach(x=>s+=a[x%a.length]);
  document.getElementById("hid").value=s;
}
function cfgSpeichern(){
  cfg.db=document.getElementById("db").value.trim().replace(/\/$/,"");
  cfg.hid=document.getElementById("hid").value.trim();
  if(cfg.hid&&cfg.hid.length<20){alert("Der Haushalts-Code muss mindestens 20 Zeichen haben – so verlangen es die Firebase-Regeln.");return;}
  schreibenLokal();verbinden();render();
}
function leserSpeichern(){
  cfg.leser=document.getElementById("leser").value.trim().replace(/\/$/,"");
  schreibenLokal(); render();
}
async function hochladen(){
  if(!confirm("Den Stand dieses Geräts in die Datenbank schreiben? Ein dort vorhandener Stand wird überschrieben."))return;
  await senden("",S);render();
}

/* ============ Blatt ============ */
function openSheet(html,behalten){
  const alt=document.querySelector(".sheet-in"), y=behalten&&alt?alt.scrollTop:0;
  document.getElementById("sheet").innerHTML=`<div class="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheet-in">${html}</div></div>`;
  document.body.style.overflow="hidden";
  if(y)document.querySelector(".sheet-in").scrollTop=y;
}
function closeSheet(){document.getElementById("sheet").innerHTML="";document.body.style.overflow="";render();}

/* ============ Start ============ */
lesenLokal();
netzLesen();
migrieren();
render();
if(!shareAufnehmen()){}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
(function(){
  const p=document.getElementById("pdfwahl"); if(p) p.onchange=()=>prospektLesen(p.files);
  const f=document.getElementById("fotowahl"); if(f) f.onchange=()=>fotoLesen(f.files&&f.files[0]);
  const k=document.getElementById("fotokamera"); if(k) k.onchange=()=>fotoLesen(k.files&&k.files[0]);
})();
/* Der frühere zweite Block hat den richtigen Handler überschrieben und eine
   einzelne Datei statt der Dateiliste übergeben – prospektLesen brach damit ab. */
if(basis())verbinden();

</script>
</body>
